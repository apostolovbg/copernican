default_language_version:
  python: python3.11
repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--line-length, "79"]
        exclude: "(^copernican_lib/vendor/)"
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile, black, --line-length, "79"]
        exclude: "(^copernican_lib/vendor/)"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --line-length, "79", --extend-exclude, "copernican_lib/vendor"]
      - id: ruff-format
        args: [--line-length, "79", --extend-exclude, "copernican_lib/vendor"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: "(^archive/|^data/|^licenses/|^start\\.|^Makefile$|^copernican_lib/vendor/)"
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: "(^archive/|^data/|^licenses/|^start\\.|^Makefile$|^copernican_lib/vendor/)"
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=79, "--extend-ignore=E203,W503"]
        exclude: "(^copernican_lib/vendor/)"
  - repo: local
    hooks:
      - id: make-lock
        name: update dependency lock
        entry: make lock
        language: python
        additional_dependencies:
          - pip-tools==7.4.1
          - pip<24.3
        files: ^requirements\.in$
        pass_filenames: false
      - id: copernican-policy
        name: enforce Copernican repository policies (DevCovenant)
        entry: env VIRTUAL_ENV=.venv ./.venv/bin/python devcovenant_check.py check
        language: system
        types: [text]
        pass_filenames: false
        always_run: true
