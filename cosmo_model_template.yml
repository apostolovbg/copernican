model_name: YourModelName
version: "1.0"
description: |
  A comprehensive manuscript-level exposition of the theory. Treat
  this field as the canonical paper for the model: include at least ten
  pages of context, derivations, observational strategy, parameter
  justification and falsifiability criteria written in Markdown and
  LaTeX. Capture every assumption, historical motivation and
  reproducibility note so the YAML file alone lets a reviewer
  reconstruct the entire theory without consulting external material.
abstract: |
  A concise abstract paragraph that summarises the entire theory,
  including key equations and their roles.
parameters:
  - name: Hubble constant
    definition: N/A
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    prior:
      type: gaussian
      mean: 65.0
      sigma: 5.0
  - name: Matter density
    definition: N/A
    bounds: [0.1, 0.5]
    unit: ""
    latex_name: \Omega_{m0}
    prior:
      type: uniform
      lower: 0.1
      upper: 0.5
Hz_expression: "H(z) = H_0 * \sqrt{\Omega_{m0}*(1+z)^3 + /* additional model terms */}"
equations:
  sne:
    - "d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}"
    - "\mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25"
  bao:
    - "D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}"
    - "D_H(z) = \frac{c}{H(z)}"
    - "D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}"
rs_expression: "rs0*(1 + B*z_{rec}*exp(-gamma*z_{rec}))"
predicts_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H_0
    ombh2: \Omega_b * (H_0/100)**2
    omch2: (\Omega_{m0} - \Omega_b) * (H_0/100)**2
    omnuh2: \Omega_{\gamma} * (H_0/100)**2
    tau: 0.054
    As: 2.1e-9
    ns: 0.965
