# Last Updated: 2025-11-08
model_name: QRSF
version: '1.0'
description: >-
  ### Quantum Relational Scale Field (QRSF)

  The Quantum Relational Scale Field (QRSF) model treats the cosmic background
  as a baryon-carried relational condensate whose contraction modifies the
  rulers and clocks used to measure expansion. Rather than introducing cold
  dark matter and a cosmological constant, the theory posits that baryons pick
  up inertial dressing from vacuum entanglement at high redshift and then
  gradually release stored correlations as cosmic structures mature. The same
  relational field therefore sources both the apparent dark matter reservoir
  seen by the cosmic microwave background and the late-time acceleration traced
  by supernovae and baryon acoustic oscillations.

  Two tightly coupled sectors capture this behaviour. An entanglement dressing
  term multiplies the baryon density by a floor ξ_floor and a high-redshift
  plateau ξ_run that activates through a smooth logistic run rate set by
  n_run around the transition scale z_star. This preserves the near-standard
  matter era required by BAO measurements while keeping a controlled residual
  inertia at low redshift so SNe Ia distance moduli remain well matched. A
  relational release sector describes how the same condensate feeds back a
  positive pressure component. The release amplitude σ_rel turns on through a
  logistic gate centred on z_rel with width Δ_rel, yielding late-time cosmic
  acceleration without violating energy conservation inside the relational
  picture. Because both mechanisms depend only on baryons, photons and the
  relational field, early-universe physics stays intact and the model remains
  compatible with precision CMB constraints.

  The revised formulation emphasises observables. The sound horizon integral,
  distance ladder relations and CMB parameter map all draw from the same
  analytic H(z) expression, making Stage 2 sampling sensitive to how the
  relational condensate couples to each probe. Expressing the speed of light as
  a fixed parameter keeps the symbolic system compact so integrals render
  cleanly inside the Copernican Suite interface.
abstract: >-
  The Quantum Relational Scale Field model replaces separate dark matter and
  dark energy sectors with a baryon-traced relational condensate. A logistic
  entanglement dressing maintains a high-redshift inertia plateau for CMB and
  BAO compatibility while leaving a calibrated floor that preserves supernova
  distances. A complementary relational release injects late-time acceleration
  through a controlled logistic gate. All observables share a single analytic
  H(z) expression with the speed of light promoted to a fixed parameter so the
  Copernican Suite renders distance relations cleanly.
parameters:
  - name: Hubble scale today
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_\star
    python_var: H_star
    definition: Apparent Hubble rate measured by local shrinking clocks.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Baryon density
    bounds: [0.01, 0.12]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Physical baryon fraction referenced to the universal frame.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.12
  - name: Photon density
    bounds: [1.0e-05, 0.001]
    unit: ''
    latex_name: \Omega_\gamma
    python_var: Omega_gamma
    definition: Photon contribution for the sound horizon integrand.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.001
  - name: Recombination redshift
    bounds: [900.0, 1200.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift used in the sound-horizon integral.
    prior:
      type: uniform
      lower: 900.0
      upper: 1200.0
  - name: Entanglement enhancement
    bounds: [0.0, 8.0]
    unit: ''
    latex_name: \xi_{\rm run}
    python_var: xi_run
    definition: High-redshift boost of baryon inertia from entanglement.
    prior:
      type: uniform
      lower: 0.0
      upper: 8.0
  - name: Low-redshift floor
    bounds: [0.0, 5.0]
    unit: ''
    latex_name: \xi_{\rm floor}
    python_var: xi_floor
    definition: Residual dressing that persists after the run saturates.
    prior:
      type: uniform
      lower: 0.0
      upper: 5.0
  - name: Running slope
    bounds: [0.5, 5.0]
    unit: ''
    latex_name: n_{\rm run}
    python_var: n_run
    definition: Controls how quickly the enhancement saturates with redshift.
    prior:
      type: uniform
      lower: 0.5
      upper: 5.0
  - name: Transition redshift
    bounds: [0.3, 20.0]
    unit: ''
    latex_name: z_\star
    python_var: z_star
    definition: Redshift pivot where the entanglement enhancement nears its
      plateau.
    prior:
      type: uniform
      lower: 0.3
      upper: 20.0
  - name: Relational release amplitude
    bounds: [0.0, 1.5]
    unit: ''
    latex_name: \sigma_{\rm rel}
    python_var: sigma_rel
    definition: Strength of the late-time relational pressure release.
    prior:
      type: uniform
      lower: 0.0
      upper: 1.5
  - name: Release midpoint redshift
    bounds: [0.0, 3.0]
    unit: ''
    latex_name: z_{\rm rel}
    python_var: z_rel
    definition: Logistic midpoint for the relational release activation.
    prior:
      type: uniform
      lower: 0.0
      upper: 3.0
  - name: Release width
    bounds: [0.1, 2.0]
    unit: ''
    latex_name: \Delta_{\rm rel}
    python_var: delta_rel
    definition: Controls how sharply the release term turns on.
    prior:
      type: uniform
      lower: 0.1
      upper: 2.0
  - name: Speed of light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    python_var: c
    definition: Fixed physical speed of light used in all distance measures.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H_star * sqrt(
    Omega_b * (1 + z)**3 * (
      1 + xi_floor + xi_run * (
        ((1 + z)/(1 + z_star))**n_run
        / (1 + ((1 + z)/(1 + z_star))**n_run)
      )
    )
    + Omega_gamma * (1 + z)**4
    + sigma_rel / (1 + exp((z - z_rel)/delta_rel))
  )
equations:
  sne:
    - d_L(z) = (1+z) * Integral(c / H(zp), (zp, 0, z))
    - mu(z) = 5 * log10(d_L(z)) + 25
  bao:
    - D_M(z) = Integral(c / H(zp), (zp, 0, z))
    - D_H(z) = c / H(z)
    - D_V(z) = (D_M(z)**2 * D_H(z))**(1/3)
rs_expression: >-
  r_s = Integral(
    c / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H_star * sqrt(
        Omega_b * (1 + z)**3 * (
          1 + xi_floor + xi_run * (
            ((1 + z)/(1 + z_star))**n_run
            / (1 + ((1 + z)/(1 + z_star))**n_run)
          )
        )
        + Omega_gamma * (1 + z)**4
        + sigma_rel / (1 + exp((z - z_rel)/delta_rel))
      )
    ), (z, z_rec, oo)
  )
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H_star
    ombh2: Omega_b * (H_star/100)**2
    omch2: Omega_b * (xi_floor + xi_run) * (H_star/100)**2
    omnuh2: Omega_gamma * (H_star/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: 3.044
    num_massive_neutrinos: 3
    sum_mnu: 0.06
notes: >-
  The entanglement run saturates toward 1 + xi_floor + xi_run at high redshift
  and drops to 1 + xi_floor after the transition, keeping BAO and SNe distances
  consistent while still yielding late-time acceleration through the release
  term. Treat omch2 in the CAMB map as geometric inertia from relational
  dressing rather than particulate cold dark matter. Declaring c as a fixed
  parameter keeps every equation compact for the Copernican renderer.
title: Quantum Relational Scale Field Cosmology
  date: '2025-11-08'
