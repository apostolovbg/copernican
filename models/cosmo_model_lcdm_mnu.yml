model_name: LambdaCDM+Mnu
version: '1.0'
description: >-
  ### LambdaCDM with variable neutrino mass

  This sample keeps the flat ΛCDM background but promotes the summed
  neutrino mass to a sampled quantity instead of a fixed heritage value.
  Supernovae and BAO distances remain governed by the same H(z)
  expression while the CAMB-based CMB likelihood now sees the explicit
  nummerical contribution through Omnus. Elevating m_ν lets the
  manifest capture the neutrino signature shown by galaxy clustering
  without rewriting the BAO or SNe integrals.

  Observationally, raising sum_mnu shifts the small-scale power while
  leaving the high-z acoustic scale practically untouched; the sampler
  mitigates this by letting Omega_m0 adjust in concert with Omega_b
  while the massless photon term preserves the early-time speed of
  sound. The description below keeps the derived nu density explicit so
  downstream validators compare the manifest entry against the cached
  neutrino density metadata.
abstract: >-
  LambdaCDM+Mnu keeps the classic expansion law but learns the neutrino sector.
  The total matter density still sources the Friedmann equation, and the sound
  horizon uses the standard radiation term; only the CMB mapping picks up a
  varying omnuh2 to match the declared sum_mnu so the pipeline knows which
  neutrino density to forward to CAMB.
parameters:
  - name: Hubble constant
    python_var: H0
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    definition: Present-day expansion rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Matter density
    python_var: Omega_m0
    bounds: [0.05, 0.7]
    latex_name: Omega_{m0}
    definition: Includes baryons, cold dark matter and neutrinos.
    prior:
      type: uniform
      lower: 0.05
      upper: 0.7
  - name: Baryon density
    python_var: Omega_b
    bounds: [0.01, 0.1]
    latex_name: Omega_b
    definition: Physical baryon mass fraction today.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    python_var: Omega_gamma
    bounds: [1.0e-05, 0.0001]
    latex_name: Omega_{gamma}
    definition: Photon contribution to acoustic physics.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.0001
  - name: Effective neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    latex_name: N_{\rm eff}
    definition: Effective relativistic density beyond photons.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5
  - name: Sum of neutrino masses
    python_var: sum_mnu
    bounds: [0.0, 0.5]
    latex_name: \sum m_{\nu}
    unit: eV
    definition: >-
      Total mass in electron-volts carried by the three active neutrinos.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Recombination redshift
    python_var: z_rec
    bounds: [1000.0, 1200.0]
    latex_name: z_{\rm rec}
    definition: Upper limit for the sound-horizon integral.
    prior:
      type: uniform
      lower: 1000.0
      upper: 1200.0
  - name: Speed of light
    python_var: c_light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    definition: Used in distance and sound-horizon integrals.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0 * (1 + z)**3
    + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
    + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff))
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c_light\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c_light\,dz'}{H(z')}
    - D_H(z) = \frac{c_light}{H(z)}
    - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
        + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff))
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  backend: camb
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omnuh2: sum_mnu / 93.14
    omch2: (Omega_m0 - Omega_b) * (H0/100)**2 - sum_mnu / 93.14
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: sum_mnu
  grids: {}
  values: {}
  calls: []
  perturbations:
    contract_version: 1
    standard: true
    gauge: unspecified
    variables: {}
    derived: {}
    equations: {}
    closures: {}
    sources: {}
    validity:
      regimes:
        - standard_camb
      notes: Uses the backend standard perturbation machinery.
    backend_mapping:
      camb:
        uses_standard_perturbations: true
    notes: >-
      This model declares that its CMB perturbations are represented by the
      selected backend's standard perturbation system.
notes: >-
  The neutrino contribution enters only through omnuh2, which is
  derived from the declared sum_mnu. The radiation term multiplies
  Omega_gamma by (1 + 0.2271 * Neff) so the BAO integral mirrors the
  same effective relativistic density that CAMB uses alongside the
  explicit neutrino mass information. The matter density Omch2
  subtracts the neutrino density so cold dark matter carries the
  remaining mass.
title: LambdaCDM with active neutrino mass
date: '2025-12-06'
