model_name: QRSFv4
version: '4.0'
description: |
  ### Overview

  This model specifies a self-contained cosmology in which the baryonic
  inertia is enhanced by a smooth, monotonic kernel that rises at low
  redshift while remaining negligible at recombination and earlier.
  Radiation follows the standard photon background. A vacuum component
  with a Chevallier–Polarski–Linder (CPL) equation of state provides a
  controlled late-time acceleration channel. All expressions are closed
  form and parseable by the suite’s sanitized interpreter. The model
  is intended for joint inference across supernovae, BAO and CMB.

  ### Expansion law

  The Hubble rate is constructed from three ingredients. First, a
  baryon term Ω_b (1+z)^3 multiplied by a logistic kernel K(z). The
  kernel is defined as K(z) = 1 + A_k / [1 + X(z)^{n_k}]^{m_k} with
  X(z) = (1+z)/(1+z_t). This kernel satisfies K(z) → 1 when z ≫ z_t,
  preserving early-universe physics, and grows monotonically for
  z ≲ z_t, saturating to 1 + A_k at low redshift. Second, a photon
  term Ω_γ (1+z)^4 is included with Ω_γ fixed to the CMB monopole.
  Third, a vacuum density uses the CPL form
  ρ_vac ∝ (1+z)^{3(1+w0+wa)} exp[-3 wa z/(1+z)].

  ### Probes and mapping

  Supernova distances are computed from the luminosity distance integral.
  BAO predictions use consistent background distances; the preferred
  sound-horizon value for production runs is the one computed by CAMB.
  The CMB interface maps model parameters to CAMB with an explicit
  parameter map. CAMB is used as a forward model only; all fitting is
  performed by the sampler against the joint likelihood.

  ### Parameters and priors

  The sampled parameters are H_* (H0), Ω_b, the kernel controls A_k,
  z_t, n_k, m_k, and a vacuum density with CPL parameters Ω_rel0, w_rel0
  and w_rel_a. The primordial sector parameters τ, A_s and n_s are also
  sampled with informative priors so that the CMB likelihood constrains
  them within standard assumptions. Bounds are chosen to maintain
  numerical stability and physical plausibility.

  ### Physical behaviour

  With K(z_rec) ≈ 1 by construction, the acoustic-era physics remains
  standard given τ, A_s and n_s. At intermediate redshifts the kernel
  increases the effective inertia carried by baryons, modifying H(z)
  and distances in a controlled way. The CPL vacuum term regulates very
  late times. The combination supplies falsifiable predictions across
  supernovae, BAO and CMB without introducing a cold dark matter fluid.

  ### Reproducibility

  All parameters, bounds, priors and expressions are explicit. The
  parameter map to CAMB contains no hidden defaults. The model declares
  its supported probes and is suitable for non-interactive execution in
  the suite’s orchestrator. Artifacts should include manifests and
  diagnostics sufficient for full reproduction.

abstract: |
  Baryonic inertia is modulated by a monotonic logistic kernel that is
  negligible at recombination and saturates at low redshift. A CPL
  vacuum component models late-time acceleration. Radiation is standard.
  The model provides closed-form expressions for H(z), distances and the
  sound-horizon integral and supplies an explicit mapping to CAMB for
  linear-theory predictions used by BAO and CMB.

parameters:
  - name: Hubble scale today
    bounds: [50.0, 85.0]
    unit: km/s/Mpc
    latex_name: H_\star
    python_var: H_star
    definition: Present-day Hubble parameter.
    prior:
      type: uniform
      lower: 50.0
      upper: 85.0

  - name: Baryon density
    bounds: [0.03, 0.08]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Baryon density fraction.
    prior:
      type: uniform
      lower: 0.03
      upper: 0.08

  - name: Photon density
    bounds: [5.38e-05, 5.38e-05]
    unit: ''
    latex_name: \Omega_\gamma
    python_var: Omega_gamma
    definition: Photon density from the CMB monopole.
    prior:
      type: fixed
      value: 5.38e-05

  - name: Kernel amplitude
    bounds: [0.0, 20.0]
    unit: ''
    latex_name: A_k
    python_var: A_k
    definition: Low-redshift inertia enhancement amplitude.
    prior:
      type: uniform
      lower: 0.0
      upper: 20.0

  - name: Kernel transition redshift
    bounds: [0.2, 25.0]
    unit: ''
    latex_name: z_t
    python_var: z_t
    definition: Redshift where the kernel begins to rise.
    prior:
      type: uniform
      lower: 0.2
      upper: 25.0

  - name: Kernel steepness
    bounds: [0.5, 10.0]
    unit: ''
    latex_name: n_k
    python_var: n_k
    definition: Steepness exponent of the kernel rise.
    prior:
      type: uniform
      lower: 0.5
      upper: 10.0

  - name: Kernel saturation exponent
    bounds: [0.5, 8.0]
    unit: ''
    latex_name: m_k
    python_var: m_k
    definition: Saturation exponent of the kernel.
    prior:
      type: uniform
      lower: 0.5
      upper: 8.0

  - name: Relational-vacuum density today
    bounds: [0.0, 1.2]
    unit: ''
    latex_name: \Omega_{\rm rel0}
    python_var: Omega_rel0
    definition: Effective vacuum-like density at z=0.
    prior:
      type: uniform
      lower: 0.0
      upper: 1.2

  - name: CPL w0
    bounds: [-2.5, 0.3]
    unit: ''
    latex_name: w_{\rm rel0}
    python_var: w_rel0
    definition: CPL equation-of-state parameter at a=1.
    prior:
      type: uniform
      lower: -2.5
      upper: 0.3

  - name: CPL wa
    bounds: [-2.5, 2.5]
    unit: ''
    latex_name: w_{\rm rel\,a}
    python_var: w_rel_a
    definition: CPL running parameter.
    prior:
      type: uniform
      lower: -2.5
      upper: 2.5

  - name: Optical depth
    bounds: [0.01, 0.12]
    unit: ''
    latex_name: \tau
    python_var: tau
    definition: Reionization optical depth.
    prior:
      type: gaussian
      mean: 0.054
      sigma: 0.007

  - name: Scalar amplitude A_s
    bounds: [1.0e-9, 5.0e-9]
    unit: ''
    latex_name: A_s
    python_var: As
    definition: Scalar amplitude at k=0.05 Mpc^-1.
    prior:
      type: loguniform
      lower: 1.0e-9
      upper: 5.0e-9

  - name: Scalar spectral index
    bounds: [0.9, 1.05]
    unit: ''
    latex_name: n_s
    python_var: ns
    definition: Scalar spectral index of the primordial spectrum.
    prior:
      type: gaussian
      mean: 0.965
      sigma: 0.02

  - name: Recombination redshift
    bounds: [1089.0, 1089.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift for mapping and r_s.
    prior:
      type: fixed
      value: 1089.0

  - name: Speed of light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    python_var: c_light
    definition: Speed of light used in distance integrals.
    prior:
      type: fixed
      value: 299792.458

Hz_expression: >-
  H(z) = H_star * sqrt(
    Omega_b * (1 + z)**3 * (
      1 + A_k / (1 + ((1 + z)/(1 + z_t))**n_k )**m_k
    )
    + Omega_gamma * (1 + z)**4
    + Omega_rel0 * (1 + z)**(3 * (1 + w_rel0 + w_rel_a))
      * exp(-3 * w_rel_a * z / (1 + z))
  )

equations:
  sne:
    - d_L(z) = (1 + z) * Integral(c_light / H(zp), (zp, 0, z))
    - mu(z) = 5 * log10(d_L(z)) + 25
  bao:
    - D_M(z) = Integral(c_light / H(zp), (zp, 0, z))
    - D_H(z) = c_light / H(z)
    - D_V(z) = (D_M(z)**2 * D_H(z))**(1/3)

rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (
        1 + 3 * Omega_b * (
          1 + A_k / (1 + ((1 + z)/(1 + z_t))**n_k )**m_k
        ) / (4 * Omega_gamma * (1 + z))
      )
    ) / (
      H_star * sqrt(
        Omega_b * (1 + z)**3 * (
          1 + A_k / (1 + ((1 + z)/(1 + z_t))**n_k )**m_k
        )
        + Omega_gamma * (1 + z)**4
        + Omega_rel0 * (1 + z)**(3 * (1 + w_rel0 + w_rel_a))
          * exp(-3 * w_rel_a * z / (1 + z))
      )
    ), (z, z_rec, oo)
  )

predicts_bao: true
valid_for_bao: true
valid_for_cmb: true

cmb:
  param_map:
    H0: H_star
    ombh2: >-
      Omega_b * (
        1 + A_k / (1 + ((1 + z_rec)/(1 + z_t))**n_k )**m_k
      ) * (H_star/100)**2
    omch2: 0.0
    omnuh2: 0.000645
    tau: tau
    As: As
    ns: ns
    Neff: 3.044
    num_massive_neutrinos: 3
    sum_mnu: 0.06

notes: |
  The kernel is evaluated at recombination inside the CMB parameter map
  to align baryonic inertia with the acoustic-era requirement for peak
  support while preserving the no–cold-dark-matter condition via omch2=0.
  Radiation density follows the standard value. The mapping declares all
  inputs explicitly and avoids hidden defaults. For BAO and CMB in
  production, the sound horizon should be taken from CAMB to maintain
  internal consistency across probes. The expressions and priors are
  chosen to keep integrals stable and to ensure finite likelihoods
  across the full parameter domain used in inference.

title: Quantum Relational Synthesis Field Cosmology v4
date: '2025-11-08'
