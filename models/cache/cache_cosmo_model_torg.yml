    unit: km s^-1 Mpc^-1
    description: Hubble expansion rate.
  sound_horizon_Mpc:
    expression: "c_km_s / sqrt(3.0) / H0 * integral(\n    1.0 / (\n      E_z * sqrt(\n\
      \        1.0\n        + 3.0 * Ob0 / (4.0 * Or0 * (1.0 + z))\n      )\n    ),\n\
      \    z,\n    z_rec,\n    1.0e7\n  )"
    unit: Mpc
    description: Background sound-horizon representation. Photon opacity is tied to
      bare baryons; native perturbations separately declare relational inertial loading.
derived:
  relational_density_factor:
    expression: Xr_z
