Hz_expression: "$$H(z) = H0 * sqrt(\n  Or0 * (1 + z)**4\n  + Ob0 * (1 + z)**3 * (\n\
  \    1 + Xr0\n      * (\n        1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)\n\
  \      )\n      * (1.0 / (1.0 + z))**gamma_r\n      / (\n        1.0 / (1.0 + (1.0\
  \ / (1.0 + zt))**beta)\n      )\n  )\n  + (1.0 - Or0 - Ob0 * (1.0 + Xr0))\n    *\
  \ (\n      1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)\n    )\n    * (1.0 / (1.0\
  \ + z))**gamma_r\n    / (\n      1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)\n    )\n\
  )$$"
equations: {}
rs_expression: "$$r_s = Integral(\n  299792.458 / sqrt(\n    3 * (1 + 3 * Ob0 / (4\
  \ * Or0 * (1 + z)))\n  ) / (\n    H0 * sqrt(\n      Or0 * (1 + z)**4\n      + Ob0\
  \ * (1 + z)**3 * (\n        1 + Xr0\n          * (\n            1.0 / (1.0 + ((1.0\
  \ + z) / (1.0 + zt))**beta)\n          )\n          * (1.0 / (1.0 + z))**gamma_r\n\
  \          / (\n            1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)\n          )\n\
  \      )\n      + (1.0 - Or0 - Ob0 * (1.0 + Xr0))\n        * (\n          1.0 /\
  \ (1.0 + ((1.0 + z) / (1.0 + zt))**beta)\n        )\n        * (1.0 / (1.0 + z))**gamma_r\n\
  \        / (\n          1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)\n        )\n    )\n\
  \  ),\n  (z, z_rec, oo)\n)$$"
constants:
  c_km_s: 299792.458
  T_cmb_K: 2.7255
  Neff: 3.046
expressions:
  a_z: 1.0 / (1.0 + z)
  activation_0: 1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)
  activation_z: 1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)
  temporal_growth_z: (1.0 / (1.0 + z))**gamma_r
  Tau_z: activation_z * temporal_growth_z / activation_0
  Xr_z: Xr0 * Tau_z
  Ob_eff_z: Ob0 * (1.0 + Xr_z)
  matter_rel_z: Or0*(1.0 + z)**4 + Ob0*(1.0 + z)**3*(1.0 + Xr_z)
  Omega_tau0: 1.0 - Or0 - Ob0*(1.0 + Xr0)
  temporal_closure_z: Omega_tau0 * Tau_z
  E2_z: matter_rel_z + temporal_closure_z
  E_z: sqrt(E2_z)
  H_z: H0 * E_z
  inv_E_z: 1.0 / E_z
  dH_Mpc_z: c_km_s / H_z
observables:
  luminosity_distance_Mpc:
    expression: (1.0 + z) * c_km_s / H0 * integral(inv_E_z, z, 0.0, z)
