model_name: USMFv7
version: '7.0'
description: >-
  USMF v7 demonstrates how to express logarithmic oscillations directly in YAML.
  A logistic tail keeps late-time acceleration under control while the
  oscillation acts on log(1+z), providing gentle wiggles without high-frequency
  behaviour at early times.
abstract: >-
  The template combines a shrink-based baseline, emergent matter, radiation, a
  sinusoid in log(1+z), and a logistic tail. The structure aims to be easy to
  modify so future USMF variants can add or remove components quickly.
  - name: Hubble scale today
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Present-day Hubble parameter.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Shrink exponent
    bounds: [0.2, 1.5]
    unit: ''
    latex_name: p_{\alpha}
    python_var: p_alpha
    definition: Baseline shrink exponent.
    prior:
      type: uniform
      lower: 0.2
      upper: 1.5
  - name: Log-oscillation amplitude
    bounds: [0.0, 0.3]
    unit: ''
    latex_name: A_{\rm log}
    python_var: A_log
    definition: Amplitude of the log(1+z) oscillation.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.3
  - name: Log-oscillation frequency
    bounds: [0.0, 5.0]
    unit: ''
    latex_name: \omega_{\rm log}
    python_var: omega_log
    definition: Frequency of the log-space oscillation.
    prior:
      type: uniform
      lower: 0.0
      upper: 5.0
  - name: Log-oscillation phase
    bounds: [-3.1416, 3.1416]
    unit: rad
    latex_name: \phi_{\rm log}
    python_var: phi_log
    definition: Phase of the log-space oscillation.
    prior:
      type: uniform
      lower: -3.1416
      upper: 3.1416
  - name: Emergent matter density
    bounds: [0.0, 0.6]
    unit: ''
    latex_name: \Omega_{\rm eff}
    python_var: Omega_eff
    definition: Effective matter-like density.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.6
  - name: Logistic tail amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: A_{\rm tail}
    python_var: A_tail
    definition: Amplitude of the late-time logistic tail.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Logistic tail centre
    bounds: [0.0, 5.0]
    unit: ''
    latex_name: z_{\rm tail}
    python_var: z_tail
    definition: Redshift where the logistic tail activates.
    prior:
      type: uniform
      lower: 0.0
      upper: 5.0
  - name: Logistic tail width
    bounds: [0.2, 3.0]
    unit: ''
    latex_name: w_{\rm tail}
    python_var: w_tail
    definition: Width of the logistic tail.
    prior:
      type: uniform
      lower: 0.2
      upper: 3.0
  - name: Baryon density
    bounds: [0.01, 0.1]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Baryon density for CMB mappings.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    bounds: [1.0e-05, 0.001]
    unit: ''
    latex_name: \Omega_{\gamma}
    python_var: Omega_gamma
    definition: Photon density entering r_s.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.001
  - name: Recombination redshift
    bounds: [900.0, 1200.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift for the sound horizon.
    prior:
      type: uniform
      lower: 900.0
      upper: 1200.0
Hz_expression: >-
  H(z) = H0 * sqrt(
    (1 + z)**(2*p_alpha)
      * (1 + A_log*sin(omega_log*log(1 + z) + phi_log))
    + Omega_eff*(1 + z)**3
    + Omega_gamma*(1 + z)**4
    + A_tail/(1 + exp((z - z_tail)/w_tail))
  )
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_eff - Omega_b) * (H0/100)**2
    omnuh2: Omega_gamma * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    ombh2: Omega_b*(H_A/100)**2
    omch2: "Omega_{\rm eff}*(H_A/100)**2"
    omnuh2: Omega_{gamma}*(H_A/100)**2
    tau: tau
    As: A_s
    ns: n_s
notes: "Re-introduced … wrappers around each equation and fixed all LaTeX backslashes
  (e.g. int and \frac and ,dz') so that the plotter and JSON parser accept them without
  error."
