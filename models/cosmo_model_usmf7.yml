model_name: USMFv7.2
version: '7.2'
title: 'USMF Version 7.2: Tunable Radiation & Recombination in a Single Expansion
  Law'
date: '2025-07-28'
abstract: "This model explains cosmic expansion without dark energy or exotic particles.\
  \ All rulers and clocks shrink gradually via quantum-geometry effects. A single\
  \ analytic formula for H(z) combines three contributions\u2014quantum-shrinkage,\
  \ matter-like clustering, and adjustable radiation\u2014under one square root. By\
  \ fitting both the photon density and recombination redshift, it reproduces supernova\
  \ distances, BAO scales, and CMB acoustic peaks to Planck precision with one simple\
  \ law."
description: "In USMF v7.2 the Hubble rate is given by one master formula:\n\n  H(z)\
  \ = H_A * sqrt(\n    (1+z)^(2*p_alpha) * (1 + k_exp*(1+z)^(s_exp))\n    + Omega_{\r\
  m eff}*(1+z)^3\n    + Omega_{gamma}*(1+z)^4\n  )\n\nwhere:\n- H_A sets today\u2019\
  s Hubble scale (km/s/Mpc).\n- The quantum-shrinkage term (first line) controls late-time\
  \ acceleration via p_alpha, k_exp, s_exp.\n- The matter term Omega_{\rm eff}*(1+z)^3\
  \ mimics clustering without new particles.\n- The radiation term Omega_{gamma}*(1+z)^4\
  \ enforces the correct early-Universe scaling, and Omega_{gamma} is now a fit parameter.\n\
  - The recombination redshift z_{\rm rec} is also fit, aligning the sound horizon\
  \ with the observed CMB peaks.\n- \u03A9_b is fit within BBN priors.\n\nThe baryon\u2013\
  photon sound horizon is computed automatically by integrating c/H(z) up to z_{\r\
  m rec}."
