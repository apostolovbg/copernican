# Last Updated: 2025-11-29
model_name: ConformalStationaryFieldCosmology
version: '1.1'
description: >-
  Conformal Stationary Field Cosmology (CSFC) models redshift as a continuous
  interaction between photons and a static conformal field rather than universal
  expansion. The field introduces polynomial and damped oscillatory corrections
  to an effective matter-like component so that luminosity distances can match
  SNe Ia residuals without invoking dark energy or dark matter.
abstract: >-
  CSFC replaces cosmic expansion with a conformal background field. The
  resulting Hubble rate combines a small matter-mimicking density, linear and
  quadratic drifts, and two decaying oscillatory modes. A phenomenological
  expression for the sound horizon allows BAO predictions while keeping the
  model agnostic to recombination microphysics.
parameters:
  - name: Hubble-scale rate
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Effective present-day redshift rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 80.0
  - name: Linear redshift term
    bounds: [-1.0, 1.0]
    unit: ''
    latex_name: L
    python_var: L
    definition: Linear drift of the conformal field interaction strength.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Quadratic redshift term
    bounds: [-1.0, 1.0]
    unit: ''
    latex_name: D
    python_var: D
    definition: Quadratic drift of the conformal field interaction strength.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Mode-1 amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: A_1
    python_var: A1
    definition: Amplitude of the first damped oscillatory correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Mode-1 decay rate
    bounds: [0.1, 10.0]
    unit: ''
    latex_name: alpha_1
    python_var: alpha1
    definition: Exponential damping of the first oscillatory correction.
    prior:
      type: uniform
      lower: 0.1
      upper: 10.0
  - name: Mode-1 frequency
    bounds: [0.0, 20.0]
    unit: ''
    latex_name: omega_1
    python_var: omega1
    definition: Angular frequency of the first oscillatory correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 20.0
  - name: Mode-1 phase
    bounds: [0.0, 6.283]
    unit: rad
    latex_name: \varphi_{0,1}
    python_var: phi01
    definition: Phase offset of the first oscillatory correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 6.283
  - name: Mode-2 amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: A_2
    python_var: A2
    definition: Amplitude of the second damped oscillatory correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Mode-2 decay rate
    bounds: [0.1, 10.0]
    unit: ''
    latex_name: alpha_2
    python_var: alpha2
    definition: Exponential damping of the second oscillatory correction.
    prior:
      type: uniform
      lower: 0.1
      upper: 10.0
  - name: Mode-2 frequency
    bounds: [0.0, 50.0]
    unit: ''
    latex_name: omega_2
    python_var: omega2
    definition: Angular frequency of the second oscillatory correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 50.0
  - name: Mode-2 phase
    bounds: [0.0, 6.283]
    unit: rad
    latex_name: \varphi_{0,2}
    python_var: phi02
    definition: Phase offset of the second oscillatory correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 6.283
  - name: Effective matter term
    bounds: [0.0, 0.05]
    unit: ''
    latex_name: M_{\rm eff}
    python_var: M_eff
    definition: Matter-like contribution sourced by the conformal field.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.05
  - name: Sound horizon base
    bounds: [140.0, 160.0]
    unit: Mpc
    latex_name: r_{s,0}
    python_var: rs0
    definition: Baseline sound horizon in the stationary-field picture.
    prior:
      type: uniform
      lower: 140.0
      upper: 160.0
  - name: BAO exponential bump amplitude
    bounds: [-1.0, 1.0]
    unit: ''
    latex_name: B
    python_var: B
    definition: Strength of the exponential modulation in r_s.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: BAO exponential bump decay
    bounds: [0.0, 5.0]
    unit: ''
    latex_name: \gamma
    python_var: gamma
    definition: Decay scale of the exponential modulation in r_s.
    prior:
      type: uniform
      lower: 0.0
      upper: 5.0
  - name: BAO logarithmic amplitude
    bounds: [-1.0, 1.0]
    unit: ''
    latex_name: C
    python_var: C
    definition: Coefficient of the logarithmic modulation in r_s.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Drag redshift
    bounds: [800.0, 1500.0]
    unit: ''
    latex_name: z_{\rm drag}
    python_var: z_drag
    definition: Effective drag-epoch redshift.
    prior:
      type: uniform
      lower: 800.0
      upper: 1500.0
  - name: Speed of light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    python_var: c
    definition: Fixed value for the speed of light.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H0 * sqrt(
    M_eff*(1 + z)**3 + 1 + L*z + D*z**2
    + A1*exp(-alpha1*z)*cos(omega1*z + phi01)
    + A2*exp(-alpha2*z)*cos(omega2*z + phi02)
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
rs_expression: >-
  r_s = rs0 * (1 + B*z_drag*exp(-gamma*z_drag) + C*log(1 + z_drag))
predicts_bao: true
valid_for_bao: true
valid_for_cmb: false
