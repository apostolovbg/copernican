model_name: LambdaCDM
version: '1.0'
description: |-
  Uses H(z)=H0*sqrt(Omega_m0(1+z)^3+Omega_Lambda0). Luminosity distance integrates c/H. BAO scale DV uses angular distance and H(z).
abstract: |-
  LambdaCDM model describes a flat universe dominated by cold dark matter and a cosmological constant serving as the reference model
parameters:
- name: Hubble constant
  bounds:
  - 50.0
  - 100.0
  unit: km/s/Mpc
  latex_name: H_0
  definition: N/A
- name: Matter density
  bounds:
  - 0.05
  - 0.7
  latex_name: Omega_{m0}
  definition: N/A
- name: Baryon density
  bounds:
  - 0.01
  - 0.1
  latex_name: Omega_b
  definition: N/A
- name: Photon density
  bounds:
  - 1.0e-05
  - 0.0001
  latex_name: Omega_{gamma}
  definition: N/A
- name: Recombination redshift
  bounds:
  - 1000
  - 1200
  latex_name: z_{rec}
  definition: N/A
Hz_expression: H(z) = H_0 * sqrt{Omega_{m0}*(1+z)^3 + (1 - Omega_{m0})}
equations:
  sne:
  - "d_L(z) = (1+z) int_0^z \frac{c,dz'}{H(z')}"
  - "mu(z) = 5log_{10}[d_L(z)/{\rm Mpc}] + 25"
  bao:
  - "D_M(z) = int_0^z \frac{c,dz'}{H(z')}"
  - "D_H(z) = \frac{c}{H(z)}"
  - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H_0
    ombh2: Omega_b * (H_0/100)**2
    omch2: (Omega_{m0} - Omega_b) * (H_0/100)**2
    omnuh2: Omega_{gamma} * (H_0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
notes: Additional notes available.
