model_name: USMFv3
version: '3.0'
description: |-
  ### 1. Introduction
  This version extends the Unified Shrinking Matter Framework by introducing a flexible expansion history and an emergent clustering term, allowing the model to fit CMB and BAO without a cosmological constant or exotic dark components.

  ### 2. Key Modifications
  - **Flexible H(z):** a two-term law with a tunable power-law and exponential component.
  - **Effective clustering:** an emergent Ω_eff term replaces traditional cold dark matter.
  - **Improved sound horizon:** includes the baryon–photon sound speed integral for realistic r_s.

  ### 3. Implications
  These changes enable the correct radiation→matter→late-time sequence, bringing the sound horizon, BAO scales, and CMB peaks into agreement with observations while preserving USMF’s purely geometric/quantum interpretation.
abstract: |-
  USMF v3 builds on the shrinking-frame paradigm to reproduce all major cosmological probes—SNe Ia, BAO, and the CMB—without invoking a fundamental cosmological constant or new particle species. Key innovations include a generalized expansion law with tunable power-law and exponential components, an emergent clustering parameter Ω_eff that mimics pressureless matter, and an improved calculation of the baryon–photon sound horizon. These allow USMF v3 to achieve Planck, BAO, and Pantheon+SH0ES–level fits while retaining a purely geometric/quantum origin of accelerated expansion.
