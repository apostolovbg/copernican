model_name: USMFv3
version: '3.1'
description: >-
  Version 3 of the Unified Shrinking Matter Framework introduces a smooth
  transition between early shrink-driven behaviour and a late oscillatory tail.
  The YAML definition emphasises readability so future variants can extend the
  functional form without wrestling with escape sequences.
abstract: >-
  The Hubble rate blends a shrinking reference-frame contribution with an
  emergent matter density, a fixed radiation background, and a Gaussian-windowed
  oscillation. The model supports BAO and CMB calculations through explicit
  baryon and photon densities.
parameters:
  - name: Hubble scale today
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Effective Hubble constant in the shrinking-frame picture.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Shrink exponent
    bounds: [0.2, 1.5]
    unit: ''
    latex_name: p_{\alpha}
    python_var: p_alpha
    definition: Power-law index governing the baseline shrink rate.
    prior:
      type: uniform
      lower: 0.2
      upper: 1.5
  - name: Shrink amplitude
    bounds: [-2.0, 2.0]
    unit: ''
    latex_name: k_{\rm exp}
    python_var: k_exp
    definition: Exponential correction to the shrink-driven term.
    prior:
      type: uniform
      lower: -2.0
      upper: 2.0
  - name: Shrink slope
    bounds: [0.5, 3.0]
    unit: ''
    latex_name: s_{\rm exp}
    python_var: s_exp
    definition: Redshift dependence of the exponential correction.
    prior:
      type: uniform
      lower: 0.5
      upper: 3.0
  - name: Emergent matter density
    bounds: [0.0, 0.6]
    unit: ''
    latex_name: \Omega_{\rm eff}
    python_var: Omega_eff
    definition: Matter-like term induced by shrinking reference frames.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.6
  - name: Baryon density
    bounds: [0.01, 0.1]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Baryon density used for r_s and CAMB mappings.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    bounds: [1.0e-05, 0.001]
    unit: ''
    latex_name: \Omega_{\gamma}
    python_var: Omega_gamma
    definition: Photon density entering the sound-horizon integral.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.001
  - name: Recombination redshift
    bounds: [900.0, 1200.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference recombination redshift for the sound horizon.
    prior:
      type: uniform
      lower: 900.0
      upper: 1200.0
  - name: Oscillation amplitude
    bounds: [0.0, 0.1]
    unit: ''
    latex_name: A_{\rm osc}
    python_var: A_osc
    definition: Amplitude of the Gaussian-windowed oscillation.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.1
  - name: Oscillation frequency
    bounds: [0.0, 10.0]
    unit: ''
    latex_name: \omega_{\rm osc}
    python_var: omega_osc
    definition: Angular frequency of the oscillatory correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 10.0
  - name: Oscillation phase
    bounds: [-3.1416, 3.1416]
    unit: rad
    latex_name: \phi_{\rm osc}
    python_var: phi_osc
    definition: Phase offset of the oscillatory correction.
    prior:
      type: uniform
      lower: -3.1416
      upper: 3.1416
  - name: Oscillation window centre
    bounds: [0.5, 5.0]
    unit: ''
    latex_name: z_{\rm turn}
    python_var: z_turn
    definition: Characteristic redshift where the oscillation peaks.
    prior:
      type: uniform
      lower: 0.5
      upper: 5.0
Hz_expression: >-
  H(z) = H0 * sqrt(
    (1 + z)**(2*p_alpha) * (1 + k_exp*exp(-s_exp*z))
    + Omega_eff*(1 + z)**3
    + Omega_gamma*(1 + z)**4
    + A_osc*exp(-(z/z_turn)**2) * cos(omega_osc*z + phi_osc)
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_eff - Omega_b) * (H0/100)**2
    omnuh2: Omega_gamma * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
notes: >-
  This template keeps the maths compact so later USMF revisions can add new
  modulation terms without reformatting escaped LaTeX strings.
