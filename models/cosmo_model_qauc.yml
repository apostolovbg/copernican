  - 0.001
  unit: ''
  latex_name: Omega_{r0}
  definition: N/A
- name: Baryon density
  bounds:
  - 0.01
  - 0.1
  unit: ''
  latex_name: Omega_{b0}
  definition: N/A
- name: Photon density
  bounds:
  - 1.0e-06
  - 0.0001
  unit: ''
  latex_name: Omega_{gamma0}
  definition: N/A
- name: Recombination redshift
  bounds:
  - 800
  - 1500
  unit: ''
  latex_name: "z_{\rm recomb}"
  definition: N/A
- name: Sound horizon at drag epoch
  bounds:
  - 4.5359460447923097e+24
  - 4.5359460447923097e+24
  unit: m
  latex_name: r_s
  definition: N/A
- name: Envelope amplitude
