# Last Updated: 2025-11-26
model_name: QuantumAttractorUnifiedCosmology
version: '1.1'
description: >-
  Quantum Attractor Unified Cosmology (QAUC) extends \LambdaCDM with a dark
  energy sector that oscillates around an exponential attractor. The ansatz is
  lightweight yet demonstrates how YAML models can combine damped waves and
  standard density scalings.
abstract: >-
  The model keeps matter and radiation terms explicit while an attractor
  envelope modulates the dark-energy contribution. Adjustable amplitude,
  frequency, and phase parameters allow the template to mimic a broad range of
  late-time behaviours for experimentation.
parameters:
  - name: Hubble constant
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Present-day Hubble rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 80.0
  - name: Matter density
    bounds: [0.1, 0.5]
    unit: ''
    latex_name: \Omega_{m0}
    python_var: Omega_m0
    definition: Matter density parameter today.
    prior:
      type: uniform
      lower: 0.1
      upper: 0.5
  - name: Radiation density
    bounds: [1.0e-06, 1.0e-03]
    unit: ''
    latex_name: \Omega_{r0}
    python_var: Omega_r0
    definition: Photon and relativistic neutrino density.
    prior:
      type: uniform
      lower: 1.0e-06
      upper: 0.001
  - name: Baryon density
    bounds: [0.01, 0.1]
    unit: ''
    latex_name: \Omega_{b0}
    python_var: Omega_b
    definition: Baryon density parameter.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    bounds: [1.0e-06, 1.0e-04]
    unit: ''
    latex_name: \Omega_{\gamma0}
    python_var: Omega_gamma
    definition: Photon density used for r_s fallback integration.
    prior:
      type: uniform
      lower: 1.0e-06
      upper: 0.0001
  - name: Recombination redshift
    bounds: [800.0, 1500.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Effective recombination redshift for the sound horizon.
    prior:
      type: uniform
      lower: 800.0
      upper: 1500.0
  - name: Envelope amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: A
    python_var: A
    definition: Fractional amplitude of the oscillatory attractor.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Envelope decay scale
    bounds: [0.1, 10.0]
    unit: ''
    latex_name: \alpha
    python_var: alpha
    definition: Exponential damping scale for the oscillatory envelope.
    prior:
      type: uniform
      lower: 0.1
      upper: 10.0
  - name: Oscillation frequency
    bounds: [0.0, 20.0]
    unit: ''
    latex_name: \omega
    python_var: omega
    definition: Angular frequency of the oscillation.
    prior:
      type: uniform
      lower: 0.0
      upper: 20.0
  - name: Phase offset
    bounds: [0.0, 6.283]
    unit: rad
    latex_name: \varphi_0
    python_var: phi0
    definition: Phase offset for the oscillatory component.
    prior:
      type: uniform
      lower: 0.0
      upper: 6.283
Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0*(1 + z)**3 + Omega_r0*(1 + z)**4
    + (1 - Omega_m0 - Omega_r0)
      * (1 + A*exp(-alpha*z)*cos(omega*z + phi0))
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
rs_expression: >-
  r_s = Integral(
    299792.458 / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_r0 * (1 + z)**4
        + (1 - Omega_m0 - Omega_r0)
          * (1 + A*exp(-alpha*z)*cos(omega*z + phi0))
      )
    ), (z, z_rec, oo)
  )
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_m0 - Omega_b) * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: 3.044
    num_massive_neutrinos: 3
    sum_mnu: 0.1
notes: >-
  Provide explicit sound-horizon integrals so BAO fits remain physically
  consistent with the Quasi-Accelerating Unified Cosmology background.
