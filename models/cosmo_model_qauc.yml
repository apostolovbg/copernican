equations:
  sne:
  - "d_L(z) = (1+z) \\int_0^z \\frac{c\\,dz'}{H(z')}"
  - "mu(z) = 5\\log_{10}\\bigl[d_L(z)/{\\rm Mpc}\\bigr] + 25"
  bao:
  - "D_M(z) = \\int_0^z \\frac{c\\,dz'}{H(z')}"
  - "D_H(z) = \\frac{c}{H(z)}"
  - "D_V(z) = \\bigl[D_M(z)**2 \\tfrac{c,z}{H(z)}\\bigr]**{1/3}"
rs_expression: r_s = rs
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H_0
    ombh2: Omega_{b0} * (H_0/100)**2
    omch2: (Omega_{m0} - Omega_{b0}) * (H_0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
abstract: |-
  A scalar-tensor model with an exponential attractor envelope and oscillatory modulation in the dark-energy sector, designed to fit both SNe Ia and BAO while opening a portal to quantum topological couplings.
