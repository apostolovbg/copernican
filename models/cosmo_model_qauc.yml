model_name: QuantumAttractorUnifiedCosmology
version: '1.0'
description: |-
  Quantum Attractor Unified Cosmology (QAUC) enhances ΛCDM with a scalar–tensor attractor whose exponential envelope and sinusoidal modulation alter the dark-energy sector. Ordinary matter and radiation follow their standard evolution while the oscillating dark-energy wave hints at a link between acceleration and quantum topology.
Hz_expression: H(z) = H_0 * sqrt{Omega_{m0}*(1+z)**3 + Omega_{r0}*(1+z)**4 + (1 -
  Omega_{m0} - Omega_{r0})*(1 + A*exp(-alpha*z)*cos(omega*z + phi0))}
parameters:
- name: Hubble constant
  bounds:
  - 1.6203896447221826e-18
  - 2.592623431555492e-18
  unit: 1/s
  latex_name: H_0
  definition: N/A
- name: Matter density
  bounds:
  - 0.1
  - 0.5
  unit: ''
  latex_name: Omega_{m0}
  definition: N/A
- name: Radiation density
