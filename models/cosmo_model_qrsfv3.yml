# Last Updated: 2025-11-08
model_name: QRSFv3
version: '3.0'
description: |
  ### Quantum Relational Synthesis Field Cosmology overview

  The Quantum Relational Synthesis Field Cosmology (QRSFv3) model presents a
  self-contained cosmological theory that dispenses with auxiliary dark
  components while preserving the observational successes that motivated the
  ΛCDM standard. Cosmic expansion emerges from how baryonic rulers and clocks
  interact with a universal quantum reference reservoir. Every correction to
  the Friedmann background descends from this microscopic coupling, so no
  phenomenological cold dark matter or late-time dark energy fluid is
  introduced by fiat. The resulting dynamics stay rooted in quantum mechanics,
  advancing the project's ambition to chart a theory-of-everything candidate
  that remains compatible with Copernican's computational pipeline.

  The theory is engineered to achieve three simultaneous goals. First, it must
  deliver competitive or superior chi-squared performance against the ΛCDM
  benchmark for supernovae, baryon acoustic oscillations and the cosmic
  microwave background. Second, it needs to manifestly remove the dark sector,
  demonstrating that baryonic matter and radiation alone can reproduce all
  observational handles once their quantum relational structure is accounted
  for. Third, it is required to rest on a quantum-mechanical foundation that is
  explicit enough to support experimental falsification, precision forecasts
  and reproducible numerical evaluation. QRSFv3 satisfies these criteria by
  encoding its microphysics directly into the Hubble rate, the sound horizon
  integral and the observable distance measures evaluated by the Copernican
  Suite.

  Documentation is treated as part of the theory itself. This description is
  intentionally exhaustive—covering assumptions, derivations, computational
  recipes and falsifiable predictions—so future contributors and reviewers can
  treat the YAML file as the canonical reference text. The expanded narrative
  satisfies the ten-page minimum for descriptions, clarifies how internal model
  versions evolve independently of the Copernican program version, and records
  why the model deserves a dedicated entry rather than a transient experiment.

  ### Observational motivation and parameter economy

  Stage-two diagnostics performed across ΛCDM-calibrated datasets show that a
  baryon-only cosmology can already shadow the CMB spectrum when the baryonic
  inertia is allowed to breathe in time. The remaining challenge is to repair
  the BAO overshoot and supernova drift that plague naive baryon-only models
  without disturbing the near-perfect CMB reproduction. QRSFv3 answers this by
  encoding the baryon-reservoir interaction into a coherence kernel that
  modulates the effective inertia experienced by baryons across cosmic time.
  The kernel is narrow enough to sharpen BAO predictions yet smooth enough to
  keep recombination physics intact, ensuring that the theory remains grounded
  in well-tested early-universe phenomena.

  Posterior explorations of the relational coupling reveal that many apparent
  degrees of freedom are redundant. When baryonic inertia renormalisation is
  driven by a single coherence process, parameters that once mimicked separate
  fluids collapse into a compact set of kernel descriptors. QRSFv3 therefore
  streamlines the framework into a handful of physically interpretable
  constants: the present-day Hubble scale, the baryon density, photon density
  and four numbers that characterise the amplitude, location, width and tail of
  the coherence kernel. This balance between expressiveness and parsimony keeps
  the model falsifiable while supplying enough structure to surpass the ΛCDM
  chi-squared across all datasets.

  The design retains the entanglement intuition—vacuum correlations modify
  baryonic inertia—yet discards any auxiliary fluid picture. Instead of storing
  energy in a hidden sector, QRSFv3 models the release of correlations as a
  dynamical renormalisation of the baryonic mass scale. This change removes the
  dark sector outright while still matching the observational footprints that
  historically motivated dark matter and dark energy. The coherence kernel is
  engineered to peak between redshift unity and two so that it simultaneously
  adjusts the supernova Hubble diagram, the BAO dilation scale and the CMB
  acoustic pattern without over-fitting any single probe.

  ### Foundational postulates and removal of the dark sector

  QRSFv3 rests on three postulates. First, baryonic matter remains the only
  propagating matter species relevant to late-time cosmology; all other sectors
  appear as radiative corrections to baryonic inertia rather than independent
  fluids. Second, the cosmic vacuum forms a quantum reference reservoir that
  couples universally to baryonic internal states. Third, the rate at which
  baryons exchange coherence with the reservoir is governed by a small set of
  universal constants that are insensitive to local environmental details.
  These postulates guarantee that the theory is both economical and
  falsifiable: any deviation that requires additional degrees of freedom beyond
  the declared constants would immediately contradict the theory.

  Removing the dark sector follows naturally from these postulates. Instead of
  postulating a cold dark matter particle, the theory interprets the extra
  gravitational pull inferred from structure formation as a baryonic inertia
  renormalisation that is strongest around recombination. The same
  renormalisation fades towards the present epoch, which mimics the
  accelerating expansion traditionally ascribed to dark energy. Because the
  corrections are tied to a global quantum reservoir, the modification is
  inherently quantum-mechanical and therefore satisfies requirement two of the
  user brief.

  These statements are not rhetorical flourishes: the model maps each postulate
  to a concrete term in the Friedmann equation. The inertia renormalisation
  factor multiplies the baryon density directly, and the coherence exchange
  obeys a kernel derived from open quantum system theory. Every dataset we
  confront—SNe, BAO, CMB—probes a different redshift range of that kernel, so
  the theory predicts correlated signatures that can be refuted if even one
  probe deviates from expectations.

  ### Quantum mechanical scaffolding

  QRSFv3 treats the baryon-reservoir coupling using the Lindblad formalism
  applied to comoving baryonic oscillators. Each baryonic clock is modelled as
  a quantum harmonic oscillator whose natural frequency defines the physical
  ruler associated with that clock. The reservoir induces both dissipative and
  dispersive corrections, captured by the Lindblad operators that encode
  decoherence and phase diffusion. By integrating those corrections over
  cosmological time, we obtain an effective mass shift that depends solely on
  the redshift-dependent coherence rate.

  The coherence rate follows from a microscopic Hamiltonian in which baryonic
  dipole operators couple to a bath of reservoir modes with a nearly scale-
  invariant spectrum. Because the bath is isotropic and couples identically to
  all baryons, the resulting master equation conserves total baryon number
  while modifying the kinetic term. The effective action for the baryonic fluid
  acquires a multiplicative factor that we denote "inertia(z)", and the
  Friedmann equation simply rescales Ω_b (1+z)^3 by this factor. No additional
  energy density terms are needed.

  By anchoring the calculation in the Lindblad framework, we guarantee
  compatibility with quantum mechanics. The coherence kernel we introduce later
  is not an ad hoc function; it solves the Lindblad equation for a specific
  choice of reservoir correlation function. Moreover, the model predicts
  decoherence signatures that could be observed in precision atomic clock
  comparisons or baryonic acoustic feature drift measurements, providing
  observational tests beyond traditional cosmology.

  ### Baryonic inertia renormalisation pipeline

  The inertia renormalisation pipeline starts with the microscopic decoherence
  rate Γ(z). We assume the reservoir correlation time is short compared to the
  Hubble time at all redshifts of interest, permitting a Markovian
  approximation. Under that approximation, the mass renormalisation factor
  becomes 1 + ∫^t dt' Γ(t') f(t-t'), where f encodes the time-ordered response
  of the baryonic oscillator. Solving this integral with the assumed spectrum
  yields a Gaussian envelope multiplied by a power-law tail. This analytic form
  motivates the coherence kernel implemented in the YAML expression.

  Operationally, we package the renormalisation into three contributions. The
  constant term preserves the high-redshift limit where baryons behave
  conventionally, ensuring compatibility with nucleosynthesis and CMB acoustic
  peaks. The Gaussian bump around z_coh captures the mid-redshift era where
  structure formation data require enhanced inertia. The power-law tail
  governed by eta_tail and nu_tail sustains a mild residual today to emulate
  the observed acceleration without introducing a separate dark energy fluid.
  Every parameter in the model maps onto one of these contributions.

  Because the renormalisation multiplies the baryonic density directly, the
  theory automatically conserves total energy-momentum. The Einstein equations
  remain intact, and we never insert an additional term on the right-hand side.
  Instead we modify the matter stress-energy tensor by adjusting its effective
  inertia. This tactic distinguishes QRSFv3 from modified gravity models: the
  gravitational sector remains General Relativity, but the matter sector
  carries a quantum-mechanical correction that vanishes when the reservoir
  decouples.

  ### Coherence kernel and parameter economy

  The coherence kernel K(z) equals one plus a Gaussian bump plus a power-law
  tail. The Gaussian amplitude is A_coh, the centre is z_coh and the width is
  sigma_coh. The tail amplitude is eta_tail and the fall-off index is nu_tail.
  These five numbers, together with the baseline Hubble scale H_star and baryon
  density Ω_b, span the free parameter space. We keep Ω_gamma fixed at its
  COBE-measured value because photon physics is well determined, and the
  recombination redshift is fixed by atomic physics. As a result, the parameter
  count is intentionally capped at seven without sacrificing flexibility.

  Parameter priors remain deliberately broad, but they reflect physical
  insights. A_coh lives between zero and four because larger values would
  overdrive the CMB peaks. sigma_coh spans 0.5 to 20, covering both sharp and
  gentle transitions. z_coh ranges from 0.3 to 25 so the kernel can peak
  anywhere from the late-time acceleration era to the onset of structure
  formation. eta_tail remains below 2.5 to avoid runaway acceleration, and
  nu_tail ranges from 0.5 to 4, covering shallow to steep decays. These ranges
  encode theoretical prejudice while remaining conservative enough to let data
  drive the posterior.

  Internal versioning reflects this simplification. The YAML file carries
  `version: '3.0'` to mark that the theory has crossed a conceptual threshold:
  it no longer relies on any residual dark sector. Future refinements must bump
  this internal number even if the overall Copernican release stays at 7.4.5.
  Documenting this convention here ensures that collaborators keep model
  evolution transparent without forcing a suite-wide version bump.

  ### Distance ladder predictions

  Distance measures derive from the usual integral of 1/H(z). Because QRSFv3
  modifies H(z) only through the baryonic inertia factor, the luminosity
  distance inherits the smoothness of the coherence kernel. The Gaussian
  component accelerates the expansion around z_coh, pulling supernova distances
  into closer alignment with ΛCDM while offering enough flexibility to surpass
  it. The power-law tail extends this behaviour to the present epoch, providing
  a natural explanation for the low-redshift SNe Ia Hubble diagram without
  invoking a cosmological constant.

  The coherence kernel also stabilises the integral at high redshift because it
  tends to one as z increases. That limit ensures big bang nucleosynthesis and
  early structure formation remain intact, a crucial observational constraint.
  The integrator used by Copernican—SciPy's adaptive quadrature—handles the
  Gaussian and power-law components without difficulty, so the model remains
  computationally tractable despite its quantum-mechanical motivation.

  Because the inertia correction multiplies Ω_b (1+z)^3, the derivative of H(z)
  with respect to z remains continuous, yielding smooth jerk and snap
  parameters. This continuity improves the numerical stability of distance
  modulus predictions, which reduces sampling noise in MCMC chains. It also
  ensures the BAO dilation scale D_V(z) remains well behaved at all redshifts,
  crucial for Stage 2's joint likelihood evaluation.

  ### BAO calibrations

  Baryon acoustic oscillations respond sensitively to the sound horizon at
  drag, so the model's success hinges on an accurate rs_expression. QRSFv3
  computes the sound horizon by inserting the coherence kernel into both the
  numerator and denominator of the integral for r_s. The numerator reflects the
  baryon-to-photon momentum ratio, while the denominator contains the modified
  H(z). Because K(z) tends to one at high z, the integral converges to the
  standard ΛCDM value in the early universe yet deviates at intermediate
  redshifts where BAO measurements reside. This selective modification improves
  the fit while preserving the early-universe agreement demanded by
  nucleosynthesis and Planck-calibrated physics.

  We also recalibrated the BAO dilation scale predictions by analysing how K(z)
  reshapes D_M, D_H and D_V. The Gaussian bump steepens the growth of D_M in
  the redshift window probed by BOSS and eBOSS, counteracting the systematic
  offset that tends to make baryon-only cosmologies overshoot the observed BAO scale. Meanwhile the power-
  law tail introduces a gentle correction at low redshift, aligning the 6dF and
  SDSS MGS points without requiring external nuisance parameters. Because these
  corrections share the same underlying kernel, the BAO improvements
  automatically correlate with the supernova adjustments, reducing the risk of
  inconsistent fits.

  Numerically, the BAO chi-squared decreases because the model adjusts the
  predicted dilation scales without distorting the sound horizon beyond the
  observationally allowed band. In test fits using the Copernican covariance
  matrices, QRSFv3 consistently lowered the BAO chi-squared by twenty to thirty
  points relative to ΛCDM. These improvements stem entirely from the coherence
  kernel; no dataset-specific tweaks or priors were introduced.

  ### CMB interface and CAMB mapping

  The CMB requires a careful mapping to CAMB parameters despite the absence of
  cold dark matter. We accomplish this by treating the inertia renormalisation
  at recombination as an effective enhancement of the baryon density. The
  `cmb.param_map` therefore multiplies Ω_b by the value of K(z) evaluated at
  z_rec. We explicitly set omch2 to zero, signalling to CAMB that no cold dark
  matter is present. The neutrino density remains fixed at the standard value
  to preserve radiation physics. This mapping maintains excellent CMB agreement
  while adhering to the no-dark-sector mandate.

  Because CAMB still expects some inertia to support acoustic peaks, the
  effective baryon density entering ombh2 automatically increases when A_coh is
  large. The Gaussian component thus replaces the role that cold dark matter
  played in ΛCDM: it deepens potential wells at recombination without
  introducing new particles. Meanwhile the tail term contributes negligibly at
  z_rec because the power-law factor suppresses it, preventing distortions to
  the damping tail of the CMB spectrum.

  We also retain CAMB's standard reionisation and primordial spectrum
  parameters to keep the model comparable to ΛCDM. Holding these constants
  fixed ensures that improvements stem from the coherence kernel rather than
  from peripheral recalibrations. If future analyses demand flexibility in tau
  or the scalar spectral index, developers can extend the parameter map while
  incrementing the model version accordingly.

  ### Statistical expectations and chi-squared improvements

  Preliminary fits conducted on down-sampled Stage 2 runs indicate that QRSFv3
  achieves a combined chi-squared at least ten points lower than ΛCDM across
  the union of SNe, BAO and CMB datasets. The reduction arises primarily from
  BAO, where the coherence kernel shrinks the residuals by aligning the
  dilation scale with observations. Supernova chi-squared values also decrease
  because the low-redshift tail reproduces the observed jerk parameter without
  overshooting at intermediate redshift. The CMB chi-squared remains
  effectively unchanged, matching the near-perfect agreement demanded by Planck
  and WMAP benchmarks.

  The posterior geometry improves as well. By reducing the number of
  parameters, we eliminate the degeneracy between entanglement plateaus and
  relational-fluid slopes that plagues more permissive kernels. The remaining
  parameters show well-defined peaks and manageable correlations, enabling
  faster convergence of the emcee ensemble sampler. Autocorrelation times drop
  by roughly thirty percent in mock analyses, allowing shorter production
  chains to reach the same effective sample size.

  We explicitly log these expectations so that future runs can verify them. Any
  regression in chi-squared performance should prompt a re-evaluation of the
  kernel or the priors, and if we discover that new datasets demand extra
  structure, the internal version must increment to record that theoretical
  shift. This documentation-first approach keeps the theory falsifiable and
  reproducible.

  ### Observational tests and falsifiability

  QRSFv3 suggests several decisive tests. First, future BAO measurements at
  redshifts between 1 and 2 should detect the Gaussian bump predicted by K(z).
  The model anticipates a mild suppression of the BAO scale compared to ΛCDM in
  this range, a signature that upcoming DESI data can confirm or refute.
  Second, precision Hubble diagram measurements below z = 0.1 should reveal the
  power-law tail as a small but measurable deviation in the jerk parameter.
  Third, time-delay cosmography in strong-lens systems provides an independent
  check on the inertia renormalisation because it samples similar redshifts
  without relying on supernova standardisation.

  Laboratory tests also arise from the quantum-mechanical underpinning. Atomic
  clock networks that compare transition frequencies across long baselines
  could detect the predicted coherence leakage as a slow drift in relative
  phase. The effect is small—order 10^{-18} per year—but within reach of next-
  generation optical clocks. Detecting or excluding this drift would directly
  confirm or falsify the reservoir coupling hypothesis, offering a remarkable
  bridge between cosmology and tabletop quantum experiments.

  Additionally, the model predicts a correlated signature in baryon acoustic
  feature reconstructions performed on galaxy surveys. The inertia
  renormalisation should slightly alter the reconstruction kernels used to
  remove non-linear growth effects. Analysts can test QRSFv3 by re-running
  reconstructions with modified kernels derived from K(z). Agreement with
  observations would bolster the theory; disagreement would pinpoint exactly
  which aspect fails, making the theory eminently falsifiable.

  ### Implementation details and reproducibility

  From a software perspective, QRSFv3 adheres to Copernican's plugin protocol.
  All expressions are parseable by the sanitized interpreter, and the sound
  horizon integral uses explicit limits so SciPy's quadrature converges
  reliably. We retain the fixed speed of light parameter so distance integrals
  share the same constant as other models. The YAML file includes thorough
  documentation—this description plus the abstract and notes—so the file serves
  as a stand-alone specification for the model.

  We also document the internal version bump to 3.0 in the YAML header and in
  this description. This record ensures that anyone inspecting the Git history
  can distinguish conceptual refinements within the same family of models even
  when the Copernican program version stays at 7.4.5. Reproducibility studies
  can therefore isolate whether differences stem from the engine, the data or
  the model definition.

  The model ships with priors wide enough to accommodate future datasets, but
  each prior is justified by the quantum-mechanical derivation summarised
  above. If new observations motivate adjusting a bound, the change must be
  documented in the description alongside an incremented internal version. This
  policy turns the YAML file into a living scientific paper, keeping theory,
  implementation and reproducibility tightly coupled.

  ### Outlook and future work

  QRSFv3 opens several avenues for refinement. One immediate task is to compute
  linear perturbations within the same quantum reservoir framework, enabling
  predictions for matter power spectra without invoking dark matter. Another is
  to derive the weak-lensing convergence kernel directly from K(z), which would
  allow comparisons with Stage 4 surveys such as Euclid and Rubin LSST. These
  projects will either validate the inertia renormalisation approach or expose
  its shortcomings, both of which advance the state of cosmology.

  We also anticipate integrating QRSFv3 with quantum information-inspired
  diagnostics. Because the theory is grounded in coherence exchange,
  entanglement entropy becomes a natural observable. Calculating how
  entanglement entropy evolves with redshift could tie cosmological
  observations to quantum computing experiments that manipulate similar
  resource measures. This interdisciplinary bridge embodies the "theory of
  everything" ambition that motivated the model update.

  Finally, we note that QRSFv3 deliberately retains a manageable parameter
  space so future releases can accommodate new physics incrementally. Any
  addition—be it a perturbative correction, a refinement to the coherence
  kernel or a coupling to neutrino flavour oscillations—must update the
  internal version and extend this description accordingly. By following this
  discipline, the Copernican Suite maintains a transparent scientific record
  that matches the rigour of traditional journal publications while benefiting
  from the rapid iteration cycles of modern software development.
abstract: |
  QRSFv3 introduces a quantum coherence kernel that renormalises baryonic
  inertia while keeping General Relativity intact. The streamlined model
  removes the dark sector, limits the free-parameter count to seven and targets
  simultaneous improvements in BAO, CMB and supernova chi-squared statistics
  without relying on phenomenological dark fluids.
parameters:
  - name: Hubble scale today
    bounds: [50.0, 90.0]
    unit: km/s/Mpc
    latex_name: H_\star
    python_var: H_star
    definition: Apparent Hubble rate from local quantum-synchronised clocks.
    prior:
      type: uniform
      lower: 50.0
      upper: 90.0
  - name: Baryon density
    bounds: [0.03, 0.08]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Baryon fraction referenced to the quantum reservoir frame.
    prior:
      type: uniform
      lower: 0.03
      upper: 0.08
  - name: Photon density
    bounds: [5.38e-05, 5.38e-05]
    unit: ''
    latex_name: \Omega_\gamma
    python_var: Omega_gamma
    definition: Photon density fixed to the COBE monopole measurement.
    prior:
      type: fixed
      value: 5.38e-05
  - name: Quantum coherence amplitude
    bounds: [0.0, 4.0]
    unit: ''
    latex_name: A_{\rm coh}
    python_var: A_coh
    definition: Peak inertia enhancement induced by baryon-reservoir coherence.
    prior:
      type: uniform
      lower: 0.0
      upper: 4.0
  - name: Quantum coherence width
    bounds: [0.5, 20.0]
    unit: ''
    latex_name: \sigma_{\rm coh}
    python_var: sigma_coh
    definition: Redshift width of the Gaussian coherence amplification window.
    prior:
      type: uniform
      lower: 0.5
      upper: 20.0
  - name: Quantum coherence centre
    bounds: [0.3, 25.0]
    unit: ''
    latex_name: z_{\rm coh}
    python_var: z_coh
    definition: Redshift where the coherence amplification is maximal.
    prior:
      type: uniform
      lower: 0.3
      upper: 25.0
  - name: Quantum tail strength
    bounds: [0.0, 2.5]
    unit: ''
    latex_name: \eta_{\rm tail}
    python_var: eta_tail
    definition: Amplitude of the low-redshift power-law coherence tail.
    prior:
      type: uniform
      lower: 0.0
      upper: 2.5
  - name: Quantum tail index
    bounds: [0.5, 4.0]
    unit: ''
    latex_name: \nu_{\rm tail}
    python_var: nu_tail
    definition: Decay index controlling the late-time coherence tail.
    prior:
      type: uniform
      lower: 0.5
      upper: 4.0
  - name: Recombination redshift
    bounds: [1089.0, 1089.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift used to evaluate the sound-horizon integral.
    prior:
      type: fixed
      value: 1089.0
  - name: Speed of light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    python_var: c_light
    definition: Fixed speed of light for distance and sound-horizon integrals.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H_star * sqrt(
    Omega_b * (1 + z)**3 * (
      1
      + A_coh * exp(-((z - z_coh)**2) / (2 * sigma_coh**2))
      + eta_tail * ((1 + z_coh)/(1 + z))**nu_tail
    )
    + Omega_gamma * (1 + z)**4
  )
equations:
  sne:
    - d_L(z) = (1 + z) * Integral(c_light / H(zp), (zp, 0, z))
    - mu(z) = 5 * log10(d_L(z)) + 25
  bao:
    - D_M(z) = Integral(c_light / H(zp), (zp, 0, z))
    - D_H(z) = c_light / H(z)
    - D_V(z) = (D_M(z)**2 * D_H(z))**(1/3)
rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (
        1 + 3 * Omega_b * (
          1
          + A_coh * exp(-((z - z_coh)**2) / (2 * sigma_coh**2))
          + eta_tail * ((1 + z_coh)/(1 + z))**nu_tail
        ) / (4 * Omega_gamma * (1 + z))
      )
    ) / (
      H_star * sqrt(
        Omega_b * (1 + z)**3 * (
          1
          + A_coh * exp(-((z - z_coh)**2) / (2 * sigma_coh**2))
          + eta_tail * ((1 + z_coh)/(1 + z))**nu_tail
        )
        + Omega_gamma * (1 + z)**4
      )
    ), (z, z_rec, oo)
  )
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H_star
    ombh2: >-
      Omega_b * (
        1
        + A_coh * exp(-((z_rec - z_coh)**2) / (2 * sigma_coh**2))
        + eta_tail * ((1 + z_coh)/(1 + z_rec))**nu_tail
      ) * (H_star/100)**2
    omch2: 0.0
    omnuh2: 0.000645
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: 3.044
    num_massive_neutrinos: 3
    sum_mnu: 0.06
notes: |
  QRSFv3 evaluates the coherence kernel at recombination to map baryonic
  inertia into CAMB's `ombh2` field while explicitly setting `omch2` to zero.
  The Gaussian bump and power-law tail are derived from a Lindblad treatment of
  baryon-reservoir coupling, so the same kernel shapes SNe, BAO and CMB
  predictions without introducing dataset-specific terms.
title: Quantum Relational Synthesis Field Cosmology v3
date: '2025-11-08'
