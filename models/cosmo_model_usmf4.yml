model_name: USMFv4
version: '4.0'
description: >-
  USMF v4 introduces a logistic modulation that eases the shrink component into
  the matter era. The template highlights how to include smooth transitions and
  additional power-law drifts using clear YAML syntax.
abstract: >-
  A logistic switch controls when the shrinking-frame contribution hands off to
  an emergent matter density. A gentle power-law drift supplements the
  oscillation-free baseline so the model remains easy to extend.
parameters:
  - name: Hubble scale today
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Present-day Hubble parameter.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Shrink exponent
    bounds: [0.2, 1.5]
    unit: ''
    latex_name: p_{\alpha}
    python_var: p_alpha
    definition: Power-law index of the shrink term.
    prior:
      type: uniform
      lower: 0.2
      upper: 1.5
  - name: Logistic amplitude
    bounds: [-1.0, 1.0]
    unit: ''
    latex_name: k_{\rm log}
    python_var: k_log
    definition: Strength of the logistic modulation.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Logistic pivot
    bounds: [0.0, 5.0]
    unit: ''
    latex_name: z_{\rm pivot}
    python_var: z_pivot
    definition: Redshift where the logistic switch centres.
    prior:
      type: uniform
      lower: 0.0
      upper: 5.0
  - name: Logistic width
    bounds: [0.2, 2.0]
    unit: ''
    latex_name: \Delta_z
    python_var: delta_z
    definition: Width of the logistic transition.
    prior:
      type: uniform
      lower: 0.2
      upper: 2.0
  - name: Emergent matter density
    bounds: [0.0, 0.6]
    unit: ''
    latex_name: \Omega_{\rm eff}
    python_var: Omega_eff
    definition: Effective matter-like term.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.6
  - name: Drift amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: D_{\rm drift}
    python_var: D_drift
    definition: Coefficient of the additional drift term.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Drift exponent
    bounds: [0.0, 4.0]
    unit: ''
    latex_name: n_{\rm drift}
    python_var: n_drift
    definition: Power-law index of the drift term.
    prior:
      type: uniform
      lower: 0.0
      upper: 4.0
  - name: Baryon density
    bounds: [0.01, 0.1]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Baryon density for CMB mappings.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    bounds: [1.0e-05, 0.001]
    unit: ''
    latex_name: \Omega_{\gamma}
    python_var: Omega_gamma
    definition: Photon density entering r_s.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.001
  - name: Recombination redshift
    bounds: [900.0, 1200.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift for the sound horizon.
    prior:
      type: uniform
      lower: 900.0
      upper: 1200.0
Hz_expression: >-
  H(z) = H0 * sqrt(
    (1 + z)**(2*p_alpha) * (1 + k_log/(1 + exp(-(z - z_pivot)/delta_z)))
    + Omega_eff*(1 + z)**3
    + Omega_gamma*(1 + z)**4
    + D_drift*(1 + z)**n_drift
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_eff - Omega_b) * (H0/100)**2
    omnuh2: Omega_gamma * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
