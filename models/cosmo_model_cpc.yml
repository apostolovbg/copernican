# Last Updated: 2025-11-26
model_name: CPCfRGravityCosmology
version: '1.1'
description: >-
  The CP-coupled f(R) cosmology augments a simple R + alpha R^2 - beta R^{-n}
  action with a small CP-violating curvature interaction. The late-time
  acceleration is sourced by the inverse-power term while early-universe
  radiation and matter eras match General Relativity.
abstract: >-
  This toy model keeps the f(R) modifications symbolic by folding the main
  corrections into an effective Hubble rate. It retains explicit matter and
  radiation densities plus a phenomenological power-law driving term so the
  YAML example remains compact yet expressive.
parameters:
  - name: Hubble constant
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Present-day Hubble rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 80.0
  - name: Matter density
    bounds: [0.1, 0.5]
    unit: ''
    latex_name: \Omega_{m0}
    python_var: Omega_m0
    definition: Non-relativistic matter density parameter.
    prior:
      type: uniform
      lower: 0.1
      upper: 0.5
  - name: Radiation density
    bounds: [1.0e-05, 1.0e-04]
    unit: ''
    latex_name: \Omega_{r0}
    python_var: Omega_r0
    definition: Relativistic density today.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 1.0e-04
  - name: R-squared coefficient
    bounds: [0.0, 1000000.0]
    unit: ''
    latex_name: \alpha
    python_var: alpha
    definition: Strength of the R^2 correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 1000000.0
  - name: Inverse-power coefficient
    bounds: [0.0, 1.0]
    unit: ''
    latex_name: \beta
    python_var: beta
    definition: Coefficient of the R^{-n} driving term.
    prior:
      type: uniform
      lower: 0.0
      upper: 1.0
  - name: Inverse-power exponent
    bounds: [0.0, 2.0]
    unit: ''
    latex_name: n
    python_var: n
    definition: Exponent for the R^{-n} modification.
    prior:
      type: uniform
      lower: 0.0
      upper: 2.0
  - name: CP-coupling strength
    bounds: [0.0, 1.0]
    unit: ''
    latex_name: \xi
    python_var: xi
    definition: Effective CP-violating amplitude (unused placeholder).
    prior:
      type: uniform
      lower: 0.0
      upper: 1.0
  - name: Sound horizon base
    bounds: [140.0, 160.0]
    unit: Mpc
    latex_name: r_{s,0}
    python_var: rs0
    definition: Fiducial sound horizon scale.
    prior:
      type: uniform
      lower: 140.0
      upper: 160.0
  - name: Drag redshift
    bounds: [800.0, 1500.0]
    unit: ''
    latex_name: z_{\rm drag}
    python_var: z_drag
    definition: Phenomenological drag-epoch redshift.
    prior:
      type: uniform
      lower: 800.0
      upper: 1500.0
  - name: Speed of light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    python_var: c
    definition: Fixed speed of light.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0*(1 + z)**3 + Omega_r0*(1 + z)**4 + beta*(1 + z)**(-n)
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
rs_expression: r_s = rs0
predicts_bao: true
valid_for_bao: true
valid_for_cmb: false
