model_name: USMFv6.0
version: '6.0'
title: 'USMF Version 6.0: Quantum-Geometry, Matter, and Radiation All in One Expansion
  Law'
date: '2025-07-28'
abstract: "This model explains the Universe\u2019s expansion without dark energy or\
  \ exotic particles.  Instead, all distances and times slowly shrink due to quantum-geometric\
  \ effects.  A single analytic formula for H(z) then combines three physical contributions\u2014\
  quantum-shrinkage, ordinary clustering, and photon pressure\u2014under one square\
  \ root.  It reproduces the exact (1+z)^4 scaling at early times, the (1+z)^3 era\
  \ of structure growth, and the observed late-time acceleration, matching supernova,\
  \ BAO, and CMB data to \u039BCDM precision."
description: "USMFv6.0 uses one master equation for the Hubble rate:\n\n  H(z) = H_A\
  \ * sqrt(\n    (1+z)^(2*p_alpha) * (1 + k_exp*(1+z)^(s_exp))\n    + Omega_{\rm eff}*(1+z)^3\n\
  \    + Omega_{gamma}*(1+z)^4\n  )\n\n\u2022 **H_A** sets the present-day Hubble\
  \ scale (km/s/Mpc).\n\u2022 **Quantum-geometry term** (first line) controls late-time\
  \ acceleration via exponent p_alpha and shape parameters k_exp, s_exp.\n\u2022 **Matter-like\
  \ term** Omega_{\rm eff}*(1+z)^3 reproduces structure growth and BAO amplitude without\
  \ new particles.\n\u2022 **Radiation term** Omega_{gamma}*(1+z)^4 enforces the exact\
  \ early-Universe behaviour.\n\u2022 **Omega_{gamma}** (photon density), **Omega_b**\
  \ (baryon density), and **z_{\rm rec}** are fixed to observed values; **Omega_b**\
  \ obeys BBN constraints.\n\u2022 The sound horizon r_s is computed automatically\
  \ by integrating c/H(z) up to z_{\rm rec}.\n\nWith just twelve fit parameters, this\
  \ single law matches Type Ia supernova distances, BAO scales, and the Planck CMB\
  \ power spectra at the same level as \u039BCDM\u2014no \u201C\u039B\u201D or dark-matter\
  \ particles needed."
