model_name: USMFv5
version: '5.0'
description: >-
  USMF v5 experiments with a hyperbolic-tangent trigger that shifts the
  shrinking component at intermediate redshifts. An exponential envelope
  replaces oscillations so the example remains numerically stable.
abstract: >-
  The model keeps explicit baryon and photon densities for r_s integration and
  introduces a tanh transition that can mimic an intermediate "stiff" era. A
  gentle exponential envelope ensures late-time acceleration without oscillatory
  features.
  - name: Hubble scale today
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Present-day Hubble parameter.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Shrink exponent
    bounds: [0.2, 1.5]
    unit: ''
    latex_name: p_{\alpha}
    python_var: p_alpha
    definition: Baseline shrink exponent.
    prior:
      type: uniform
      lower: 0.2
      upper: 1.5
  - name: Tanh amplitude
    bounds: [-1.0, 1.0]
    unit: ''
    latex_name: k_{\rm tanh}
    python_var: k_tanh
    definition: Strength of the hyperbolic tangent modulation.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Tanh centre
    bounds: [0.0, 5.0]
    unit: ''
    latex_name: z_{\rm tanh}
    python_var: z_tanh
    definition: Redshift where the tanh transition occurs.
    prior:
      type: uniform
      lower: 0.0
      upper: 5.0
  - name: Tanh width
    bounds: [0.2, 3.0]
    unit: ''
    latex_name: w_{\rm tanh}
    python_var: w_tanh
    definition: Width of the tanh transition.
    prior:
      type: uniform
      lower: 0.2
      upper: 3.0
  - name: Emergent matter density
    bounds: [0.0, 0.6]
    unit: ''
    latex_name: \Omega_{\rm eff}
    python_var: Omega_eff
    definition: Effective matter-like density.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.6
  - name: Envelope amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: A_{\rm env}
    python_var: A_env
    definition: Amplitude of the late-time exponential envelope.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Envelope damping scale
    bounds: [0.5, 10.0]
    unit: ''
    latex_name: z_{\rm damp}
    python_var: z_damp
    definition: Damping scale for the exponential envelope.
    prior:
      type: uniform
      lower: 0.5
      upper: 10.0
  - name: Baryon density
    bounds: [0.01, 0.1]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Baryon density for CMB mappings.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    bounds: [1.0e-05, 0.001]
    unit: ''
    latex_name: \Omega_{\gamma}
    python_var: Omega_gamma
    definition: Photon density entering r_s.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.001
  - name: Recombination redshift
    bounds: [900.0, 1200.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift for the sound horizon.
    prior:
      type: uniform
      lower: 900.0
      upper: 1200.0
Hz_expression: >-
  H(z) = H0 * sqrt(
    (1 + z)**(2*p_alpha)
      * (1 + k_tanh*tanh((z - z_tanh)/w_tanh))
    + Omega_eff*(1 + z)**3
    + Omega_gamma*(1 + z)**4
    + A_env*exp(-z/z_damp)
  )
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_eff - Omega_b) * (H0/100)**2
    omnuh2: Omega_gamma * (H0/100)**2
    As: 2.1e-09
    ns: 0.965
    H0: H_A
    ombh2: Omega_b*(H_A/100)**2
    omch2: "Omega_{\rm eff}*(H_A/100)**2"
    omnuh2: Omega_{gamma}*(H_A/100)**2
    tau: 0.054
    As: A_s
    ns: n_s
notes: Added explicit '*' between every factor (e.g. 2*p_alpha), removed any 
  implicit multiplication.  Uses LaTeX sqrt for clarity.  Abstract/description 
  are fully self-contained for new readers.
