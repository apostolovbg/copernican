Hz_expression: "H(z) = H_A * sqrt{ (1+z)^{2*p_{alpha}}*(1 + k_{\rm exp}*(1+z)^{s_{\r\
  m exp}}) + Omega_{\rm eff}*(1+z)^3 + Omega_{gamma}*(1+z)^4 }"
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
equations:
  sne:
  - "d_L(z) = (1+z) int_0^z \frac{c,dz'}{H(z')}"
  - mu(z) = 5log_{10}[d_L(z)/mathrm{Mpc}] + 25
  bao:
  - "D_M(z) = int_0^z \frac{c,dz'}{H(z')}"
  - "D_H(z) = \frac{c}{H(z)}"
  - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
cmb:
  param_map:
    H0: H_A
    ombh2: Omega_b*(H_A/100)**2
    omch2: "Omega_{\rm eff}*(H_A/100)**2"
    omnuh2: Omega_{gamma}*(H_A/100)**2
    tau: 0.054
    As: A_s
    ns: n_s
notes: Added explicit '*' between every factor (e.g. 2*p_alpha), removed any implicit
  multiplication.  Uses LaTeX sqrt for clarity.  Abstract/description are fully self-contained
  for new readers.
