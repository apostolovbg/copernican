model_name: USMFv6
version: '6.0'
description: >-
  USMF v6 keeps the YAML concise while adding a polynomial correction that
  mimics clustering feedback at intermediate redshifts. A Lorentzian-shaped
  modulation softens the transition into acceleration.
abstract: >-
  The Hubble rate couples a shrink-driven baseline with an emergent matter term,
  radiation, and a rational modulation that boosts distances around a tunable
  scale. The structure is intentionally readable so future edits remain simple.
  - name: Hubble scale today
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Effective Hubble parameter today.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Shrink exponent
    bounds: [0.2, 1.5]
    unit: ''
    latex_name: p_{\alpha}
    python_var: p_alpha
    definition: Power-law index of the shrink term.
    prior:
      type: uniform
      lower: 0.2
      upper: 1.5
  - name: Polynomial amplitude
    bounds: [-1.0, 1.0]
    unit: ''
    latex_name: k_{\rm poly}
    python_var: k_poly
    definition: Amplitude of the polynomial correction.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Polynomial exponent
    bounds: [0.0, 4.0]
    unit: ''
    latex_name: m_{\rm poly}
    python_var: m_poly
    definition: Exponent of the polynomial correction.
    prior:
      type: uniform
      lower: 0.0
      upper: 4.0
  - name: Emergent matter density
    bounds: [0.0, 0.6]
    unit: ''
    latex_name: \Omega_{\rm eff}
    python_var: Omega_eff
    definition: Effective matter-like density.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.6
  - name: Lorentzian amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: A_{\rm mix}
    python_var: A_mix
    definition: Amplitude of the Lorentzian modulation.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Lorentzian scale
    bounds: [0.5, 10.0]
    unit: ''
    latex_name: z_{\rm mix}
    python_var: z_mix
    definition: Scale of the Lorentzian modulation.
    prior:
      type: uniform
      lower: 0.5
      upper: 10.0
  - name: Baryon density
    bounds: [0.01, 0.1]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Baryon density for CMB mappings.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    bounds: [1.0e-05, 0.001]
    unit: ''
    latex_name: \Omega_{\gamma}
    python_var: Omega_gamma
    definition: Photon density entering r_s.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.001
  - name: Recombination redshift
    bounds: [900.0, 1200.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift for the sound horizon.
    prior:
      type: uniform
      lower: 900.0
      upper: 1200.0
Hz_expression: >-
  H(z) = H0 * sqrt(
    (1 + z)**(2*p_alpha) * (1 + k_poly*(1 + z)**m_poly)
    + Omega_eff*(1 + z)**3
    + Omega_gamma*(1 + z)**4
    + A_mix/(1 + (z/z_mix)**2)
  )
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
predicts_bao: true
valid_for_bao: true
valid_for_cmb: true
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_eff - Omega_b) * (H0/100)**2
    omnuh2: Omega_gamma * (H0/100)**2
    As: 2.1e-09
    ns: 0.965
    H0: H_A
    ombh2: Omega_b*(H_A/100)**2
    omch2: "Omega_{\rm eff}*(H_A/100)**2"
    omnuh2: Omega_{gamma}*(H_A/100)**2
    tau: 0.054
    As: A_s
    ns: n_s
notes: Added explicit '*' between every factor (e.g. 2*p_alpha), removed any 
  implicit multiplication.  Uses LaTeX sqrt for clarity.  Abstract/description 
  are fully self-contained for new readers.
