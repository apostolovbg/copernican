name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Lint and Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Set up virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: runner.os != 'Windows' && steps.cache-venv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install . pre-commit

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows' && steps.cache-venv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.venv\Scripts\pip install --upgrade pip
          .\.venv\Scripts\pip install . pre-commit

      - name: Run pre-commit
        if: runner.os != 'Windows'
        shell: bash
        run: .venv/bin/pre-commit run --all-files

      - name: Run pre-commit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\pre-commit run --all-files

      - name: Run unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: .venv/bin/python copernican.py --run-tests

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python copernican.py --run-tests

