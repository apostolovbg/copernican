# Last Updated: 2025-10-30
name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up virtual environment
        if: runner.os != 'Windows'
        shell: bash
        run: python -m venv .venv

      - name: Set up virtual environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m venv .venv

      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          .venv/bin/python -m pip install pip==24.2
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps . pre-commit pip-tools

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\python -m pip install pip==24.2
          .\.venv\Scripts\python -m pip install -r requirements.lock
          .\.venv\Scripts\python -m pip install --no-deps . pre-commit pip-tools

      - name: Run unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: COPERNICAN_STRICT_WARNINGS=1 .venv/bin/python -m unittest discover -v

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:COPERNICAN_STRICT_WARNINGS = '1'
          .\.venv\Scripts\python -m unittest discover -v
