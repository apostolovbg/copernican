# Last Updated: 2025-11-26
# CI pipeline covering multiplatform and Python 3.11
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    # Execute the same validation flow on each supported OS for parity with
    # downstream user environments.
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        # Provision the requested interpreter and restore pip's wheel cache so
        # dependency installation benefits from reuse across workflow runs.
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache CAMB data directory
        # CAMB downloads are expensive; cache them per runner OS to avoid
        # repeated transfers when cosmology engines rely on CAMB tables.
        uses: actions/cache@v4
        with:
          path: |
            ~/.camb
            ~\AppData\Local\camb
          key: camb-${{ runner.os }}

      - name: Install dependencies
        # Install the locked dependencies, the editable package and the build
        # backend so the project under test matches developer environments.
        run: |
          python -m pip install pip==24.2
          python -m pip install -r requirements.lock
          python -m pip install -e .
          python -m pip install build

      - name: Run DriftGuard policy check
        # Enforce repository policy across the full tree so CI mirrors the
        # required staged fast checks with a comprehensive repository scan.
        run: >
          python -m driftguard.cli check --scope=repo --mode=full
          --repo-root .

      - name: Collect DriftGuard metrics
        # Preserve drift metrics so reviewers can correlate CI results with
        # repository health trends across runs.
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          from driftguard import load_engine

          repo_root = Path(".")
          engine = load_engine(repo_root)
          metrics = [
              {
                  "name": metric.name,
                  "value": metric.value,
                  "path": str(metric.path) if metric.path else None,
                  "threshold": metric.threshold,
              }
              for metric in engine.metrics(scope="repo", mode="full")
          ]
          output = Path("driftguard-metrics.json")
          output.write_text(json.dumps(metrics, indent=2))
          print(f"Wrote {output}")
          PY

      - name: Run unit tests
        # Execute the full pytest suite quietly to surface regressions while
        # keeping the log output concise.
        run: python -m pytest -q

      - name: Build distribution artifacts
        # Produce both the source distribution and universal wheel to confirm
        # packaging succeeds before publishing.
        run: python -m build

      - name: Upload build artifacts
        # Retain the generated distributions so reviewers can inspect the
        # packaging results from each operating system.
        uses: actions/upload-artifact@v4
        with:
          name: copernican-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist
            driftguard-metrics.json
          if-no-files-found: error
