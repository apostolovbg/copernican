[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copernican"
description = """
A Python toolkit for evaluating cosmological models \
against SNe Ia, BAO, and CMB observations."""
version = "12.0.26"
authors = [{name = "Copernican Developers"}]
license = {file = "LICENSE.md"}
requires-python = ">=3.11,<3.12"
dependencies = [
    # Keep runtime versions in sync with the packaged runtime lock.
    "numpy==1.26.4",
    "scipy==1.12.0",
    "matplotlib==3.8.2",
    "pandas==2.2.1",
    "sympy==1.13.0",
    "jsonschema==4.21.1",
    "packaging==26.2",
    "setuptools==82.0.1",
    "contourpy==1.3.2",
    "PyYAML==6.0.3",
    "astropy==6.0.0",
    "psutil==5.9.8",
    "semver==3.0.4",
    "emcee==3.1.4",
    "h5netcdf==1.3.0",
    "h5py==3.10.0",
    "xarray==2023.12.0",
    "xarray-einstats==0.6.0",
    "typing_extensions==4.10.0",
    "arviz==0.16.1",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = [
    "pip-tools==7.4.1",
]

[project.urls]
Homepage = "https://github.com/apostolovbg/copernican"
Repository = "https://github.com/apostolovbg/copernican"

[project.scripts]
copernican = "copernican.cli:main"

[tool.setuptools]
include-package-data = true
# Explicitly scope package discovery so legacy setuptools builds that ship
# with ensurepip never attempt to auto-discover every top-level directory.
# macOS still bundles setuptools 79.0.1, which raises a fatal "Multiple
# top-level packages discovered" error unless we teach it which namespaces
# to include. The include/exclude filters mirror the runtime modules while
# leaving data and archival folders untouched.

[tool.setuptools.packages.find]
include = [
    "copernican",
    "copernican.*",
]
exclude = [
    "archive",
    "data",
    "licenses",
    "tests",
]

[tool.setuptools.package-data]
# Package data keeps the runtime version file, bundled datasets, docs, and
# packaged mini-games together.
"copernican" = [
    "VERSION",
    "datasets/**/*",
    "docs/**/*",
    "img/**/*",
    "models/**/*",
    "runtime-requirements.lock",
    "rng_minigames/**/*",
    "validation/**/*",
]
"copernican.lib" = [
    "latex_mappings.yml",
    "config_schemas/**/*",
    "global_settings/**/*",
    "licenses/**/*",
    "vendor/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.py[cod]",
    "**/*.py[cod]",
    "__pycache__/*",
    "**/__pycache__/*",
]
