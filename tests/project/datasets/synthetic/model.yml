model_name: SyntheticFlat
version: "0.1"
description: >-
  Lightweight analytic model for deterministic integration tests.
abstract: >-
  Provides closed-form distance measures to keep integration tests fast.
parameters:
  - name: Hubble constant
    python_var: H0
    latex_name: H_0
    bounds: [60.0, 70.0]
    prior:
      type: uniform
      lower: 60.0
      upper: 70.0
  - name: Matter density
    python_var: Omega_m0
    latex_name: \Omega_{m0}
    bounds: [0.25, 0.35]
    prior:
      type: uniform
      lower: 0.25
      upper: 0.35
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: 0.022
    omch2: 0.12
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: 3.046
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    YHe: 0.245
  model_parameters:
    Tcmb_K: 2.7255
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 20
    ell_max: 40
    k_min: 1.0e-4
    k_max: 0.08
    k_sample_count: 3
    eta_sample_count: 32
    source_grid_multiplier: 1
    ode_rtol: 1.0e-5
    ode_atol: 1.0e-8
    tight_coupling_ratio: 50.0
    a_min: 1.0e-6
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: 0.0
      Tcmb: Tcmb_K
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: 2.469e-5 * ((Tcmb_K / 2.7255) ** 4) / (h * h)
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_m0: Omega_b0 + Omega_c0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: >-
        H0 * sqrt(
          Omega_r0 / (a ** 4)
          + Omega_m0 / (a ** 3)
          + Omega_k0 / (a ** 2)
          + Omega_de0
        )
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    variables:
      signal_mode:
        kind: photon_temperature_monopole
        tensor_character: scalar_like
    derived: {}
    equations:
      evolve_signal_mode:
        lhs:
          kind: derivative
          variable: signal_mode
          wrt: tau
          order: 1
        rhs: -0.02 * signal_mode
        role: continuity
    constraints: {}
    closures: {}
    sources:
      signal_source:
        expression: signal_mode
        role: signal
    observables:
      signal_transfer:
        kind: transfer_component
        projection: line_of_sight_signal
        source_terms:
          signal: signal_source
      TT:
        kind: angular_power_spectrum
        primary: signal_transfer
        secondary: signal_transfer
    initial_conditions:
      signal_seed:
        target:
          variable: signal_mode
          wrt: tau
          order: 0
        expression: seed
    boundary_conditions: {}
    validity:
      regimes:
        - synthetic_integration
    notes: >-
      Minimal declared signal graph for deterministic integration coverage.
likelihood:
  independent_sne_bao: true
equations:
  sne:
    - "$d_L = (1+z) c/H_0 z$"
  bao:
    - "$D_V = (c z/H_0)^2 (1+z)^{1/3}$"
