model_name: TemplateModel
version: "1.0"
description: |
  This template is the canonical source of truth for generative agents and
  reviewers. It documents every field that a valid `model_*.yml` may
  contain. The `parameters` list combines real physics knobs with instructive
  metadata so you can infer the required structure when composing a new model.
  * Define each parameter with `name`, `python_var` if the default identifier
    is too verbose, `latex_name`, `unit`, `definition` and a `prior`. The
    `prior` block must always declare `type` (`gaussian`, `uniform`,
    `loguniform` or `fixed`) along with the fields that type requires
    (`mean`/`sigma`, `lower`/`upper`, `value`). Log-uniform priors
    automatically add the `transform: log` metadata in the cached YAML.
  * Every physics observable that can appear in `H(z)` or the sound-horizon
    integrand must be a declared parameter or a fixed constant.
  * Model YAMLs are declarative mathematical files, not Python modules.
    Copernican validates the declared math and compiles it into executable
    callables elsewhere in the codebase.
  * Always pair the photon density `Omega_gamma` with a sampled `Neff`
    parameter (2.5–3.5) so the radiation term evaluates as `Omega_gamma *
    (1 + 0.2271 * Neff)` when constructing both `Hz_expression` and
    `rs_expression`. This keeps BAO plots, CSV exports, likelihood calls,
    and declared CMB backgrounds aligned while letting relativistic species
    float.
  * The `cmb` block is the structured declared execution contract. Keep scalar
    inputs in `param_map`, declare numerical grids in `grids`, put evaluated
    expressions in `values`, list reviewed graph calls in `calls`, and define
    the declared background and perturbation graph in the same block.
  * `cmb.numerical` declares declared runtime controls such as ell and k
    bounds,
    sampling counts, ODE tolerances, tight-coupling settings, and the initial
    redshift. Repeat the controls under `cmb.perturbations.numerics` when the
    hierarchy compiler must use them while materializing the graph.
  * `valid_for_cmb: true` requires a complete structured contract. A declared
    model uses `calls: []` unless it declares reviewed adapter metadata, and
    its perturbation contract must provide typed graph metadata, physical
    sources, projections, initial conditions, and validity metadata.
  * A metadata-generated scalar hierarchy materializes only the species and
    hierarchy families listed in `species` and `hierarchy_families`. It never
    adds CDM or neutrino states to complete a compiler requirement.
  * Theory-specific source closures belong in `perturbations.sources`. Use
    the `matter_density`, `matter_momentum`, and `baryon_euler` roles when a
    declared background changes the baryon-locked scalar source. Do not
    represent a relational or effective response as a synthetic species.
  * Set `valid_for_cmb: false` only when the theory explicitly defines no CMB
    observable. A theory that intends CMB output must declare its complete
    mathematics and use `valid_for_cmb: true`; a missing engine capability is
    CCMBS work and must not make the theory unavailable.
  * A specification-only model may remain outside executable model discovery
    until its equations are complete. Do not use `valid_for_cmb: false` to
    hide incomplete mathematics or a compiler/runtime capability gap.
  * Production contracts do not select a solver. Route keys such as
    `backend`, `standard`, and `backend_mapping` are invalid because every
    accepted CMB contract executes through the declared graph.
abstract: |
  A concise abstract describing the model. Mention the key parameters, the
  physical motivation and which datasets the model was designed to confront.
parameters:
  - name: Hubble constant
    python_var: H0
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    definition: Present expansion rate.
    prior:
      type: gaussian
      mean: 68.0
      sigma: 3.0
  - name: Matter density
    python_var: Omega_m0
    bounds: [0.05, 0.4]
    unit: ""
    latex_name: \Omega_{m0}
    definition: Cold matter fraction today.
    prior:
      type: uniform
      lower: 0.05
      upper: 0.4
  - name: Baryon density
    python_var: Omega_b
    bounds: [0.01, 0.07]
    unit: ""
    latex_name: \Omega_b
    definition: Baryonic mass fraction today.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.07
  - name: Photon density
    python_var: Omega_gamma
    bounds: [1.0e-05, 1.0e-04]
    unit: ""
    latex_name: \Omega_{\gamma}
    definition: Photon contribution used in the radiation term.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 1.0e-04
  - name: Recombination redshift
    python_var: z_rec
    bounds: [1089.92, 1089.92]
    unit: ""
    latex_name: z_{\rm rec}
    definition: Fixed photon-decoupling redshift used by the sound horizon.
    prior:
      type: fixed
      value: 1089.92
  - name: Effective number of relativistic neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    unit: ""
    latex_name: N_{\rm eff}
    definition: Sampled relativistic neutrino count used by the declared CMB
      background and independent reference fixtures.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5
  - name: Log-scale amplitude
    python_var: log_amp
    bounds: [0.01, 10.0]
    unit: ""
    latex_name: \log A
    definition: Example log-uniform scale parameter.
    prior:
      type: loguniform
      lower: 0.01
      upper: 10.0
  - name: Speed of light
    python_var: c_light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    definition: Fixed constant that appears inside distances and r_s.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0 * (1 + z)**3
    + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
    + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff)) *
      (1 + z)**(3 + log_amp)
  )
equations:
  sne:
    - d_L(z) = (1 + z) \int_0^z \frac{c_light\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c_light\,dz'}{H(z')}
    - D_H(z) = \frac{c_light}{H(z)}
    - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
        + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff))
          * (1 + z)**(3 + log_amp)
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_distance_metrics: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_m0 - Omega_b) * (H0/100)**2
    Neff: Neff
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    YHe: 0.245
  model_parameters:
    Tcmb_K: 2.7255
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 1.0e-4
    k_max: 0.3
    k_sample_count: 64
    eta_sample_count: 1024
    ode_rtol: 1.0e-6
    ode_atol: 1.0e-9
    tight_coupling_ratio: 80.0
    a_min: 1.0e-6
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      Omega_k0: 0.0
      Tcmb: Tcmb_K
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: 2.469e-5 * ((Tcmb_K / 2.7255)**4) / (h * h)
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_m0: Omega_b0 + Omega_c0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: >-
        H0 * sqrt(
          Omega_r0 / (a ** 4)
          + Omega_m0 / (a ** 3)
          + Omega_k0 / (a ** 2)
          + Omega_de0
        )
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: >-
          exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: >-
          exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: >-
          (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: >-
          hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: >-
          (10 ** reionization_log10_amplitude)
          * H_SI
          * hard_source
          * quasar_helium_hardness
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    variables:
      delta_x:
        kind: density_contrast
        description: Template evolved density perturbation.
        units: dimensionless
        tensor_character: scalar_like
        rank: 0
        spin: 0.0
      theta_x:
        kind: velocity_divergence
        description: Template evolved velocity perturbation.
        units: 1/Mpc
        tensor_character: scalar_like
        rank: 0
        spin: 0.0
      phi_aux:
        kind: metric_potential_phi
        description: Template curvature potential target.
        units: dimensionless
        gauge_role: curvature_potential
      psi_aux:
        kind: metric_potential_psi
        description: Template Newtonian potential target.
        units: dimensionless
        gauge_role: newtonian_potential
    derived:
      density_drive:
        expression: delta_x + phi_aux
        description: Template effective source combination.
        units: dimensionless
    equations:
      continuity_x:
        lhs:
          kind: derivative
          variable: delta_x
          wrt: tau
          order: 1
        rhs: -theta_x
        role: continuity
      euler_x:
        lhs:
          kind: derivative
          variable: theta_x
          wrt: tau
          order: 1
        rhs: -Hconf * theta_x + k * psi_aux
        role: euler
    constraints:
      poisson_phi_x:
        target: phi_aux
        expression: 0.25 * delta_x
        role: constraint
    closures:
      psi_equals_phi_x:
        target: psi_aux
        expression: phi_aux
        role: closure
    sources:
      monopole_x:
        expression: visibility * density_drive
        role: monopole
        units: 1/Mpc
      polarization_x:
        expression: visibility * theta_x
        role: polarization
        units: 1/Mpc
    observables:
      temperature:
        kind: transfer_component
        projection: line_of_sight_temperature
        units: dimensionless
        source_terms:
          monopole: monopole_x
      polarization_e:
        kind: transfer_component
        projection: line_of_sight_polarization_e
        units: dimensionless
        source_terms:
          polarization: polarization_x
      TT:
        kind: angular_power_spectrum
        primary: temperature
        secondary: temperature
        units: muK^2
      TE:
        kind: angular_power_spectrum
        primary: temperature
        secondary: polarization_e
        units: muK^2
    initial_conditions:
      delta_x_seed:
        target:
          variable: delta_x
          wrt: tau
          order: 0
        expression: seed
      theta_x_seed:
        target:
          variable: theta_x
          wrt: tau
          order: 0
        expression: 0.1 * seed
    boundary_conditions: {}
    numerics:
      ode_rtol: 1.0e-5
      ode_atol: 1.0e-8
    validity:
      regimes:
        - linear
        - scalar_like
      notes: Template declared-math perturbation graph.
    notes: >-
      This template demonstrates the forward-only declared-math graph
      contract executed by the declared CMB solver.
notes: |
  * Use the radiation term `Omega_gamma * (1 + 0.2271 * Neff)` whenever you
    need the relativistic energy density; doing so keeps BAO diagnostics, CSV
    exports, declared CMB backgrounds, and reference inputs in sync.
  * The template lists uniform, gaussian, loguniform and fixed priors so you
    can see all supported options. Always repeat the definition, unit and
    latex name to make the cached YAML readable.
  * The `Hz_expression` and `rs_expression` examples show how to reference
    every parameter you defined. If you need a new parameter, add it to the
    `parameters` list first and give it the same metadata everywhere else.
  * Use `units` on declared variables, derived symbols, source terms, and
    observables whenever the convention is fixed. The canonical declared CMB
    sign, gauge, source, and spectrum conventions live in
    `copernican/docs/cmb_solver.md`.
  * Review the compiled species and source names against the theory before
    enabling CMB output. A declared graph is valid only when every emitted
    state and source has an explicit physical origin.
  * Use `cmb_contract.audit_cmb_capabilities` after compilation to record the
    declared model matrix. The public `TT`, `TE`, `EE`, `BB`, `PP`, `TP`, and
    `EP` rows require their typed transfer roles; do not infer capabilities
    from a theory name, model filename, model family, or assumed species.
  * Declared perturbation expressions can use the declared variables, the
    background symbols `a`, `z`, `eta`, `H`, `Hconf`, `tau`, `tau_dot`,
    `visibility`, `k`, `seed`, `sound_horizon`, `sound_speed`,
    `sound_speed_sq`, `baryon_sound_speed_sq`, `collision_rate`,
    `free_streaming`,
    `tight_coupling_drag`, and `tight_coupling_ratio`, plus the safe math
    functions exposed by the validator. The default `seed` is a
    unit-normalized transfer seed unless the contract overrides it, and
    relation targets such as `Phi` or `Psi` only become available when the
    declared equations, constraints, or closures solve them.
  * Declared perturbation equations may mix `tau`, `eta`, `a`, `z`, or
    other monotonic declared background coordinates on their typed `lhs`.
    End boundary conditions are supported when they replace the missing
    start-state slots for the declared solver.
  * `cmb.perturbations.interactions`, `conservation_rules`, and
    `projection_extensions` define the theory-extension surface.
    Use interactions for compiled source/equation helpers, conservation
    rules for fail-loud residual checks, and projection extensions to name
    reviewed `custom_line_of_sight` kernels with explicit source-role
    contracts.
  * `cmb.background.derived` may expose expansion, density, pressure,
    equation-of-state, or curvature quantities directly. The declared solver
    consumes those declared outputs first and only derives required physical
    scalars when the contract makes that possible.
    `cmb.background.recombination.quantities` may also override the declared
    hydrogen recombination hook. Non-standard laws are admitted without
    LambdaCDM comparison, but when the mapping is present it must define
    `hydrogen_temperature_K`, `hydrogen_alpha_B`, `beta_continuum`, and
    `peebles_c`.
  * Transfer components bind named source terms through declared observable
    mappings. Match the source-term roles required by the chosen projection,
    for example `monopole` for `line_of_sight_temperature`,
    `polarization` for `line_of_sight_polarization_e`,
    `polarization_b` for `spin2_b_mode`, or `potential` for
    `line_of_sight_lensing_potential`. Use `custom_line_of_sight` when the
    model needs a reviewed kernel such as `spherical_bessel_window`,
    `spherical_bessel_derivative_window`, `spin2_e_window`,
    `spin2_b_window`, or `lensing_potential_window`, and declare any needed
    `required_projection_roles` explicitly.
  * `cmb.perturbations.accuracy_controls` can require minimum `ell`, `k`,
    `eta`, hierarchy, source-grid, and momentum-grid coverage. The
    `runtime_envelope` records deterministic work estimates and chunking;
    optional `maximum_*_work_units` entries are positive operator metadata,
    not machine-local ceilings that reject a valid physical request.
  * Generated-source diagnostics retain normalized and absolute residual
    bounds. Use `source_residual_audit` for reviewed per-source overrides;
    the runtime records whether each independent closure passed by its
    relative or absolute criterion and preserves the control provenance.
  * Angular power-spectrum observables only name their `primary` and
    `secondary` transfer components. Keep projection, kernel, and source-term
    declarations on the transfer components themselves so manifest provenance
    stays honest.
  * Run manifests record the declared graph summary plus background,
    recombination, and declared execution provenance. Treat those manifest
    blocks as the execution proof surface.
  * Mention which datasets the model targets, how the priors were chosen and
    any reproducibility instructions inside `description`/`notes` so the file
    remains the sole source of truth.
  * When advertising BAO support the baryon density should hover near 0.04
    (±0.01) so DM/rs predictions stay compatible with the BOSS DR12
    comparisons
    that powering the χ² residual regression. Adjust `Omega_b` intentionally
    and rerun the BAO test whenever you take the value outside this window.
  * Set `skip_bao: true` when you intentionally leave BAO disabled. Leaving the
    key absent (or setting it to `false`) keeps the declared expectation that
    `rs_expression` and reference-aligned BAO helpers remain active.
date: '2025-12-06'
