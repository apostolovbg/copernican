model_name: wCDM
version: '1.0'
description: >-
  ### wCDM overview

  The wCDM variation holds cold matter (baryons, photons and cold dark
  matter) exactly where ΛCDM places it but lets the dark-energy sector
  carry a constant equation-of-state parameter w_de that can deviate
  from -1. Deviating from the cosmological constant shifts both the
  distance ladder measured by supernovae and the background expansion
  that fixes the BAO feature without rewriting the microphysics of the
  acoustic peaks. Small curvature is also permitted, giving the model
  the freedom to test the longstanding Ω_k ≈ 0 assumption in the same
  inference run.

  Observational anchors appear through multiple datasets. SNe Ia
  constrain the late-time integral of 1/H(z), BAO samples measure the
  combination of angular and radial distances, and the CMB links
  early-universe densities to today’s expansion. The unified
  description below therefore layers the same variables across those
  probes so the covariance between w_de and Ω_k (or any H0 shift) is
  explicit and recoverable from the cached manifest; the manifest
  records the inferred w_de value and the derived curvature contribution.

  Parameter degeneracies remain transparent because the ΔΩ_k term
  appears in the H(z) expression alongside a (1+z)**3 matter term;
  that structure lets MCMC walkers see when curvature scans start to
  mimic running dark energy and when supernova residuals begin to tilt
  the same way BAO does.
abstract: >-
  The wCDM cosmology replaces Λ with a fluid whose pressure-to-density ratio
  stays constant but need not equal -1. This maintains the familiar cold-matter
  background while letting the dark sector slowly stiffen or soften. Allowing a
  nonzero Ω_k keeps the CMB and BAO responses consistent with that freedom and
  records how far data drift from the flat assumption.
parameters:
  - name: Hubble constant
    python_var: H0
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    definition: Present-day expansion rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Matter density
    python_var: Omega_m0
    bounds: [0.05, 0.7]
    latex_name: Omega_{m0}
    definition: Includes both baryons and cold dark matter.
    prior:
      type: uniform
      lower: 0.05
      upper: 0.7
  - name: Baryon density
    python_var: Omega_b
    bounds: [0.01, 0.1]
    latex_name: Omega_b
    definition: Physical baryon mass fraction today.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    python_var: Omega_gamma
    bounds: [1.0e-05, 0.0001]
    latex_name: Omega_{gamma}
    definition: Photon contribution that appears in r_s and the
      high-redshift H(z) tail.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.0001
  - name: Effective neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    latex_name: N_{\rm eff}
    definition: Effective number of relativistic species.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5
  - name: Curvature density
    python_var: Omega_k
    bounds: [-0.1, 0.1]
    latex_name: Omega_k
    definition: >-
      Spatial curvature contribution (positive=open, negative=closed).
    prior:
      type: uniform
      lower: -0.1
      upper: 0.1
  - name: Equation-of-state
    python_var: w_de
    bounds: [-1.5, -0.5]
    latex_name: w_{\rm de}
    definition: Constant dark-energy equation-of-state.
    prior:
      type: uniform
      lower: -1.5
      upper: -0.5
  - name: Recombination redshift
    python_var: z_rec
    bounds: [1000.0, 1200.0]
    latex_name: z_{\rm rec}
    definition: Upper limit for the sound-horizon integral.
    prior:
      type: uniform
      lower: 1000.0
      upper: 1200.0
  - name: Speed of light
    python_var: c_light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    definition: Used in distance and sound-horizon integrals.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0 * (1 + z)**3
    + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
    + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff) - Omega_k)
      * (1 + z)**(3 * (1 + w_de))
    + Omega_k * (1 + z)**2
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c_light\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c_light\,dz'}{H(z')}
    - D_H(z) = \frac{c_light}{H(z)}
    - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
        + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff) - Omega_k)
          * (1 + z)**(3 * (1 + w_de))
        + Omega_k * (1 + z)**2
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  backend: camb
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_m0 - Omega_b) * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    omk: Omega_k
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 0.0001
    k_max: 0.3
    k_sample_count: 18
    eta_sample_count: 192
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: omk
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      w0: w_de
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: H0 * sqrt(Omega_m0 / (a ** 3) + Omega_r0 / (a ** 4) + Omega_de0 * a ** (-3
        * (1 + w0)) + Omega_k0 / (a ** 2))
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    standard: false
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_massive_l
        momentum_grid: massive_neutrino_default
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      scalar_reference_ells:
      - 2
      - 2000
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 0.0001
      k_max: 0.3
      k_sample_count: 18
      eta_sample_count: 192
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 80.0
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
      massive_neutrino_hierarchy_l_max: 5
      momentum_grids:
        massive_neutrino_default:
          count: 8
          q_min: 0.05
          q_max: 18.0
          mass_parameter: sum_mnu
    validity:
      regimes:
      - linear
      - native_scalar_hierarchy
      notes: Production spectra use the Copernican native hierarchy.
    backend_mapping:
      camb:
        native_solver_required: true
        implemented: true
    notes: Native declared scalar hierarchy for wCDM; the model background remains
      theory-specific.
notes: >-
  The constant-w dark energy couples to the same densities that feed
  the BAO and CMB integrals; deviations from -1 show up both in the
  H(z) polynomial and in the native CMB solver dark-energy call. Curvature and w_de
  share the same redshift leverage, which exposes the degeneracy
  between curvature and running dark energy while keeping the matter
  density anchored to the baryon fraction. The radiation term
  multiplies Omega_gamma by (1 + 0.2271 * Neff) so BAO residuals map
  to the native CMB background that supplies the likelihood.
title: wCDM model for controlled curvature+DE
date: '2025-12-06'
