model_name: Planck 2018 Reference LambdaCDM
version: '1.0'
description: >-
  Reference base-ΛCDM parameter set pinned to the Planck 2018
  TT,TE,EE+lowE best-fit values reported in Planck Collaboration VI
  (2018, Table 2). All cosmological degrees of freedom are fixed for
  reproducible validation of the Copernican likelihood implementations.
abstract: >-
  Fixed-parameter ΛCDM calibrated to Planck 2018. This model anchors the
  validation manifests and is not intended for exploration; every parameter is
  held at the published best-fit value so golden manifests remain reproducible.
parameters:
- name: Hubble constant
  bounds:
  - 67.66
  - 67.66
  unit: km/s/Mpc
  latex_name: H_0
  definition: Hubble expansion rate today.
  prior:
    type: fixed
    value: 67.66
- name: Matter density
  bounds:
  - 0.3111
  - 0.3111
  latex_name: Omega_{m0}
  definition: Cold matter content today.
  prior:
    type: fixed
    value: 0.3111
- name: Baryon density
  bounds:
  - 0.04897
  - 0.04897
  latex_name: Omega_b
  definition: Baryonic matter density today.
  prior:
    type: fixed
    value: 0.04897
- name: Photon density
  bounds:
  - 5.38e-05
  - 5.38e-05
  latex_name: Omega_{\gamma}
  definition: Photon density parameter at z=0.
  prior:
    type: fixed
    value: 5.38e-05
- name: Effective neutrino species
  python_var: Neff
  bounds:
  - 3.044
  - 3.044
  latex_name: N_{\rm eff}
  definition: Planck’s inferred effective neutrino count.
  prior:
    type: fixed
    value: 3.044
- name: Recombination redshift
  bounds:
  - 1089.92
  - 1089.92
  latex_name: z_{\rm rec}
  definition: Redshift at photon decoupling.
  prior:
    type: fixed
    value: 1089.92
Hz_expression: >-
  H(z) = H_0 * sqrt(
    Omega_{m0}*(1 + z)**3
    + Omega_{\gamma}*(1 + 0.2271 * Neff)*(1 + z)**4
    + (1 - Omega_{m0} - Omega_{\gamma}*(1 + 0.2271 * Neff))
  )
equations:
  sne:
  - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
  - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
  - D_M(z) = \int_0^z \frac{c}{H(z')}
  - D_H(z) = \frac{c}{H(z)}
  - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
rs_expression: >-
  r_s = Integral(
    299792.458 / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_{\gamma}) / (1 + z))
    ) / (
      H_0 * sqrt(
        Omega_{m0} * (1 + z)**3
        + Omega_{\gamma} * (1 + 0.2271 * Neff) * (1 + z)**4
        + (1 - Omega_{m0} - Omega_{\gamma} * (1 + 0.2271 * Neff))
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H_0
    ombh2: Omega_b * (H_0/100)**2
    omnuh2: 0.06 / 93.14
    omch2: (Omega_{m0} - Omega_b) * (H_0/100)**2 - 0.06 / 93.14
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 0.0001
    k_max: 0.3
    k_sample_count: 64
    eta_sample_count: 192
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: '0.0'
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: H0 * sqrt(Omega_m0 / (a ** 3) + Omega_r0 / (a ** 4) + Omega_k0 / (a ** 2)
        + Omega_de0)
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_massive_l
        momentum_grid: massive_neutrino_default
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      accuracy_tier: final
      phase_aware_k_quadrature: true
      require_phase_resolution: false
      phase_points_per_cycle: 4.0
      minimum_k_sample_count: 64
      scalar_reference_ells:
      - 2
      - 2000
      scalar_constraint_anchors:
        early: 0.05
        recombination: 0.50
        late: 0.95
      scalar_constraint_normalization: sum_abs_declared_einstein_terms
      scalar_constraint_reference_eta_samples: 192
      scalar_constraint_tolerances:
        einstein_energy_residual: 3.0e-3
        einstein_momentum_residual: 1.0e-6
        einstein_shear_residual: 1.0e-6
      los_phase_quadrature:
        enabled: true
        minimum_nodes: 256
        maximum_nodes: 256
        phase_points_per_cycle: 4.0
      production_scalar_convergence:
        enabled: true
        k_refinement_factor: 2
        required_spectra:
        - TT
        - TE
        - EE
        relative_tolerances:
          TT: 1.0e-2
          TE: 2.0e-2
          EE: 1.0e-2
        fail_on_nonconvergence: true
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 0.0001
      k_max: 0.3
      k_sample_count: 64
      eta_sample_count: 192
      evolution_eta_sample_count: 192
      evolution_phase_step: 2.0
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 1600.0
      tight_coupling_exit_ratio: 0.1
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
      photon_hierarchy_l_max: 10
      photon_polarization_hierarchy_l_max: 10
      neutrino_hierarchy_l_max: 8
      massive_neutrino_hierarchy_l_max: 8
      lensing_sampling_factor: 1.4
      momentum_grids:
        massive_neutrino_default:
          count: 16
          q_min: 0.05
          q_max: 18.0
          mass_parameter: 0.06
    validity:
      regimes:
      - linear
      - declared_scalar_hierarchy
      notes: Reference spectra use the fixed Planck 2018 parameter values.
    notes: The scalar graph couples the fixed LambdaCDM species and regular
      adiabatic initial data to the Planck 2018 reference background.
notes: >-
  Every parameter is anchored to Planck Collaboration VI (2018) Table 2
  (TT,TE,EE+lowE) base-ΛCDM best-fit values. These priors are declared as
  fixed values so the samplers treat them like any other variable (which keeps
  the plots and trace lines visible) while remaining numerically locked for
  validation.
