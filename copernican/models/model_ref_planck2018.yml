model_name: Planck 2018 Reference LambdaCDM
version: '1.0'
description: >-
  Reference base-ΛCDM parameter set pinned to the Planck 2018
  TT,TE,EE+lowE best-fit values reported in Planck Collaboration VI
  (2018, Table 2). All cosmological degrees of freedom are fixed for
  reproducible validation of the Copernican likelihood implementations.
abstract: >-
  Fixed-parameter ΛCDM calibrated to Planck 2018. This model anchors the
  validation manifests and is not intended for exploration; every parameter is
  held at the published best-fit value so golden manifests remain reproducible.
parameters:
- name: Hubble constant
  bounds:
  - 67.66
  - 67.66
  unit: km/s/Mpc
  latex_name: H_0
  definition: Hubble expansion rate today.
  prior:
    type: fixed
    value: 67.66
- name: Matter density
  bounds:
  - 0.3111
  - 0.3111
  latex_name: Omega_{m0}
  definition: Cold matter content today.
  prior:
    type: fixed
    value: 0.3111
- name: Baryon density
  bounds:
  - 0.04897
  - 0.04897
  latex_name: Omega_b
  definition: Baryonic matter density today.
  prior:
    type: fixed
    value: 0.04897
- name: Effective neutrino species
  python_var: Neff
  bounds:
  - 3.044
  - 3.044
  latex_name: N_{\rm eff}
  definition: Planck’s inferred effective neutrino count.
  prior:
    type: fixed
    value: 3.044
- name: CMB temperature
  python_var: Tcmb_K
  bounds:
  - 2.7255
  - 2.7255
  unit: K
  latex_name: T_{\rm CMB}
  definition: Measured blackbody temperature fixing the photon density.
  prior:
    type: fixed
    value: 2.7255
geometry: cmb.background
equations:
  sne:
  - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
  - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
  - D_M(z) = \int_0^z \frac{c}{H(z')}
  - D_H(z) = \frac{c}{H(z)}
  - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H_0
    ombh2: Omega_b * (H_0/100)**2
    standard_neutrino_neff: 3.044
    omnuh2: >-
      0.06 / 94.06410581217612 * (Neff / 3.0)**0.75 * (Tcmb_K / 2.7255)**3
    omch2: >-
      (Omega_{m0} - Omega_b) * (H_0/100)**2
      - 0.06 / 94.06410581217612 * (Neff / 3.0)**0.75 * (Tcmb_K / 2.7255)**3
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: '0.0'
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: 2.472975328714087e-5 * (Tcmb_K / 2.7255)**4 / (h * h)
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      massive_neutrino_available_neff: >-
        num_massive_neutrinos * standard_neutrino_neff / 3.0
      effective_massive_neutrino_species: >-
        0.5 * (Neff + massive_neutrino_available_neff
        - abs(Neff - massive_neutrino_available_neff))
      Omega_nu_massless0: Omega_nu0 * (Neff
        - effective_massive_neutrino_species) / Neff
      massive_neutrino_mass_eV: sum_mnu / (num_massive_neutrinos + 1.0e-30)
      massive_neutrino_transition_a: (3.151 * ((4.0 / 11.0) ** (1.0 / 3.0))
        * 8.617333262145e-5 * Tcmb_K) / (massive_neutrino_mass_eV + 1.0e-30)
      Omega_nu_massive_rel0: Omega_nu0 * effective_massive_neutrino_species
        / Neff
      Omega_nu_massive_nr0: omnuh2 / (h * h)
        * effective_massive_neutrino_species
        / (massive_neutrino_available_neff + 1.0e-30)
      Omega_nu_massive0: Omega_nu_massive_nr0
        + (Omega_nu_massive_rel0 - Omega_nu_massive_nr0)
        * exp(-massive_neutrino_mass_eV / 1.0e-4)
      Omega_r0: Omega_gamma0 + Omega_nu_massless0
        + Omega_nu_massive_rel0
      Omega_de0: 1.0 - Omega_b0 - Omega_c0 - Omega_nu_massive0
        - Omega_gamma0 - Omega_nu_massless0 - Omega_k0
      H: H0 * sqrt((Omega_gamma0 + Omega_nu_massless0) / (a ** 4)
        + Omega_nu_massive0 * sqrt(a * a + massive_neutrino_transition_a
        * massive_neutrino_transition_a) / (sqrt(1.0
        + massive_neutrino_transition_a * massive_neutrino_transition_a)
        * (a ** 4)) + (Omega_b0 + Omega_c0) / (a ** 3)
        + Omega_k0 / (a ** 2) + Omega_de0)
    recombination:
      prescription: effective_three_level
    # Explicit phenomenological reference history; no solver model-name switch.
    reionization:
      calibration:
        symbol: reionization_midpoint_redshift
        target_optical_depth: tau
        lower: 0.0
        upper: 50.0
      quantities:
        hydrogen_width_redshift: 0.5
        helium_midpoint_redshift: 3.5
        helium_width_redshift: 0.4
        hydrogen_transition: >-
          0.5 * (1.0 + tanh(
            ((1.0 + reionization_midpoint_redshift)**1.5 - (1.0 + z)**1.5)
            / (1.5 * sqrt(1.0 + reionization_midpoint_redshift)
            * hydrogen_width_redshift)))
        helium_transition: >-
          0.5 * (1.0 + tanh(
            (helium_midpoint_redshift - z) / helium_width_redshift))
        electron_fraction: >-
          x_e_floor + (1.0 + helium_number_ratio - x_e_floor)
          * hydrogen_transition + helium_number_ratio * helium_transition
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        multipole_symbol: nu_massive_l
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    validity:
      regimes:
      - linear
      - declared_scalar_hierarchy
      notes: Reference spectra use the fixed Planck 2018 parameter values.
    notes: The scalar graph couples the fixed LambdaCDM species and regular
      adiabatic initial data to the Planck 2018 reference background.
notes: >-
  Every parameter is anchored to Planck Collaboration VI (2018) Table 2
  (TT,TE,EE+lowE) base-ΛCDM best-fit values. These priors are declared as
  fixed values so the samplers treat them like any other variable (which keeps
  the plots and trace lines visible) while remaining numerically locked for
  validation.
