model_name: Temporal Opposition Geometry
version: '1.0'
description: >-
  Temporal Opposition Geometry models cosmic acceleration as a
  volume-activated temporal-opposition contribution. The theory does
  not treat time as a fourth spatial axis. It treats the temporal
  contribution as Lorentz-opposed to spatial extension and activated
  by the growth of three-dimensional spatial volume.
abstract: >-
  TOG defines a flat FLRW background with standard matter and
  radiation plus a bounded temporal-opposition activation law. The
  temporal term is negligible at small scale factor, activates with
  spatial volume, and saturates toward the future. The parameter a_T
  controls the activation scale. LambdaCDM is recovered in the limit
  where the activation is already saturated over the observed range.

parameters:
  - name: Hubble constant
    python_var: H0
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    definition: Present-day Hubble expansion rate.
    prior:
      type: gaussian
      mean: 68.0
      sigma: 4.0

  - name: Matter density
    python_var: Omega_m0
    bounds: [0.05, 0.45]
    unit: ''
    latex_name: \Omega_{m0}
    definition: Present-day non-relativistic matter density fraction.
    prior:
      type: uniform
      lower: 0.05
      upper: 0.45

  - name: Baryon density
    python_var: Omega_b
    bounds: [0.03, 0.06]
    unit: ''
    latex_name: \Omega_b
    definition: Present-day baryonic matter density fraction.
    prior:
      type: uniform
      lower: 0.03
      upper: 0.06

  - name: Photon density
    python_var: Omega_gamma
    bounds: [5.38e-05, 5.38e-05]
    unit: ''
    latex_name: \Omega_{\gamma}
    definition: Fixed photon density parameter at z=0.
    prior:
      type: fixed
      value: 5.38e-05

  - name: Effective number of relativistic neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    unit: ''
    latex_name: N_{\rm eff}
    definition: Effective relativistic neutrino count.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5

  - name: Temporal activation scale
    python_var: a_T
    bounds: [0.05, 2.0]
    unit: ''
    latex_name: a_T
    definition: Scale factor where temporal opposition activates.
    prior:
      type: uniform
      lower: 0.05
      upper: 2.0

  - name: Recombination redshift
    python_var: z_rec
    bounds: [1089.92, 1089.92]
    unit: ''
    latex_name: z_{\rm rec}
    definition: Fixed photon-decoupling redshift.
    prior:
      type: fixed
      value: 1089.92

  - name: Speed of light
    python_var: c_light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    definition: Fixed speed of light.
    prior:
      type: fixed
      value: 299792.458

Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0 * (1 + z)**3
    + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
    + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff))
      * (
        1 - exp(-((1 / (1 + z)) / a_T)**3)
      ) / (
        1 - exp(-(1 / a_T)**3)
      )
  )

equations:
  sne:
    - d_L(z) = (1 + z) Integral(c_light / H(zp), (zp, 0, z))
    - mu(z) = 5 log10(d_L(z)) + 25
  bao:
    - D_M(z) = Integral(c_light / H(zp), (zp, 0, z))
    - D_H(z) = c_light / H(z)
    - D_V(z) = (D_M(z)**2 * D_H(z))**(1/3)

rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
        + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff))
          * (
            1 - exp(-((1 / (1 + z)) / a_T)**3)
          ) / (
            1 - exp(-(1 / a_T)**3)
          )
      )
    ), (z, z_rec, oo)
  )

skip_bao: false
valid_for_bao: true
valid_for_distance_metrics: true
valid_for_cmb: true

cmb:
  backend: camb
  param_map:
    H0: H0
    ombh2: Omega_b * (H0 / 100)**2
    omch2: (Omega_m0 - Omega_b) * (H0 / 100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
  grids:
    a_grid:
      symbol: a
      lower: 0.001
      upper: 1.0
      points: 256
      spacing: linear
  values:
    x_tog:
      grid: a_grid
      expression: (a / a_T)**3
    w_tog:
      grid: a_grid
      expression: -1 - x_tog * exp(-x_tog) / (1 - exp(-x_tog))
  calls:
    - method: set_dark_energy_w_a
      args:
        a: '@grid.a_grid'
        w: '@value.w_tog'
      kwargs:
        dark_energy_model: ppf
  perturbations:
    contract_version: 1
    standard: true
    gauge: unspecified
    variables: {}
    derived: {}
    equations: {}
    closures: {}
    sources: {}
    validity:
      regimes:
        - standard_camb_with_declared_background_adapter
      notes: Uses standard backend perturbations with the model's declared
        background adapter contract.
    backend_mapping:
      camb:
        uses_standard_perturbations: true
    notes: >-
      Native non-standard perturbation equations are not declared in this model
      file.
notes: >-
  This model uses the TOG volume-activation law. The background temporal
  factor is A(a) = [1 - exp(-(a / a_T)**3)] /
  [1 - exp(-(1 / a_T)**3)]. The CAMB contract evaluates the derived
  w(a) table on a scale-factor grid and forwards it to CAMB through
  set_dark_energy_w_a using PPF. The PPF setting is the CAMB adapter
  representation for the declared w(a) table; it is not a Copernican
  theory class.

date: '2026-05-25'
