None
model_name: LambdaCDM
version: '1.0'
description: Uses H(z)=H0*sqrt(Omega_m0(1+z)**3+Omega_Lambda0). Luminosity distance
  integrates c/H. BAO scale D_V uses angular distance and H(z).
abstract: LambdaCDM model describes a flat universe dominated by cold dark matter
  and a cosmological constant serving as the reference model.
parameters:
- name: Hubble constant
  bounds:
  - 50.0
  - 100.0
  unit: km/s/Mpc
  latex_name: H_0
  definition: N/A
  prior:
    type: uniform
    lower: 50.0
    upper: 100.0
  python_var: H_0
- name: Matter density
  bounds:
  - 0.05
  - 0.7
  latex_name: Omega_{m0}
  definition: N/A
  prior:
    type: uniform
    lower: 0.05
    upper: 0.7
  python_var: Omega_m0
- name: Baryon density
  bounds:
  - 0.01
  - 0.1
  latex_name: Omega_b
  definition: N/A
  prior:
    type: uniform
    lower: 0.01
    upper: 0.1
  python_var: Omega_b
- name: Photon density
  bounds:
  - 1.0e-05
  - 0.0001
  latex_name: Omega_{gamma}
  definition: N/A
  prior:
    type: uniform
    lower: 1.0e-05
    upper: 0.0001
  python_var: Omega_gamma
- name: Effective neutrino species
  python_var: Neff
  bounds:
  - 2.5
  - 3.5
  latex_name: N_{\rm eff}
  definition: Effective number of relativistic neutrinos.
  prior:
    type: uniform
    lower: 2.5
    upper: 3.5
- name: Recombination redshift
  bounds:
  - 1000
  - 1200
  latex_name: z_{rec}
  definition: N/A
  prior:
    type: uniform
    lower: 1000.0
    upper: 1200.0
  python_var: z_rec
Hz_expression: "$$H(z) = H_0 * sqrt(\n  Omega_{m0}*(1 + z)**3\n  + Omega_{\\gamma}*(1\
  \ + 0.2271 * Neff)*(1 + z)**4\n  + (1 - Omega_{m0} - Omega_{\\gamma}*(1 + 0.2271\
  \ * Neff))\n)$$"
equations:
  sne:
  - $$d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}$$
  - $$\mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25$$
  bao:
  - $$D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}$$
  - $$D_H(z) = \frac{c}{H(z)}$$
  - $$D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)$$
rs_expression: "$$r_s = Integral(\n  299792.458 / sqrt(\n    3 * (1 + 3 * Omega_b\
  \ / (4 * Omega_{\\gamma}) / (1 + z))\n  ) / (\n    H_0 * sqrt(\n      Omega_{m0}\
  \ * (1 + z)**3\n      + Omega_{\\gamma} * (1 + 0.2271 * Neff) * (1 + z)**4\n   \
  \   + (1 - Omega_{m0} - Omega_{\\gamma} * (1 + 0.2271 * Neff))\n    )\n  ), (z,\
  \ z_rec, oo)\n)$$"
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  backend: camb
  param_map:
    H0: H_0
    ombh2: Omega_b * (H_0/100)**2
    omch2: (Omega_{m0} - Omega_b) * (H_0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
  grids: {}
  values: {}
  calls: []
  perturbations:
    contract_version: 1
    standard: true
    gauge: unspecified
    variables: {}
    derived: {}
    equations: {}
    closures: {}
    sources: {}
    validity:
      regimes:
      - standard_camb
      notes: Uses the backend standard perturbation machinery.
    backend_mapping:
      camb:
        uses_standard_perturbations: true
    notes: This model declares that its CMB perturbations are represented by the selected
      backend's standard perturbation system.
  model_parameters: {}
  value_definitions: {}
notes: The radiation term multiplies Omega_gamma by (1 + 0.2271 * Neff) so BAO ratios
  and CAMB backgrounds now use the same effective relativistic density.
valid_for_distance_metrics: true
generated_code:
  get_Hz_per_Mpc: H_0*sqrt(Omega_gamma*(0.2271*Neff + 1)*(z + 1)**4 - Omega_gamma*(0.2271*Neff
    + 1) + Omega_m0*(z + 1)**3 - Omega_m0 + 1)
  get_comoving_distance_Mpc: integral(c/H(z))
  get_luminosity_distance_Mpc: (1+z)*DC
  get_angular_diameter_distance_Mpc: DC/(1+z)
  get_DV_Mpc: ((DC^2 * c*z/H)^1/3)
  get_sound_horizon_rs_Mpc: Integral(299792.458/(H_0*sqrt(9*Omega_b/(4*Omega_gamma*(z
    + 1)) + 3)*sqrt(Omega_gamma*(0.2271*Neff + 1)*(z + 1)**4 - Omega_gamma*(0.2271*Neff
    + 1) + Omega_m0*(z + 1)**3 - Omega_m0 + 1)), (z, z_rec, oo))
  distance_modulus_model: 5*log10(DL_Mpc)+25
