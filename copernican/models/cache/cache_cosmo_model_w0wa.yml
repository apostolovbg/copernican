None
model_name: w0waCDM
version: '1.0'
description: '### w₀wₐCDM overview

  The w₀wₐCDM catalog entry elevates the CPL parametrisation to a full sample model.
  A time-varying dark-energy equation of state tracks the present-day value w₀ plus
  a linear run rate wₐ that multiplies the scale factor. Complementary BAO, CMB and
  supernova constraints now share this unpacked freedom so operators can inspect whether
  the early universe already hints at evolving dark energy or if the late-time acceleration
  remains indistinguishable from a cosmological constant.

  The Hubble expansion used by the likelihoods incorporates curvature, baryon density
  and radiation support while the CPL factors enter only through the dark-energy density.
  High-redshift physics stays intact thanks to the standard photon term, and the H(z)
  expression below keeps Omega_de coupled explicitly to w₀ and wₐ so the manifest
  documents the exact functional form the pipelines use during bootstrapping.

  This sample keeps the inference knobs transparent. The w₀ constraint comes from
  the position of the acoustic scale, wₐ influences how smoothly the H(z) curve transitions
  between z≈0 and z≈2, and curvature remains a separate slider that the chains may
  push negative or positive without altering the CPL behaviour.'
abstract: The CPL (Chevallier-Polarski-Linder) expansion governs the dark-energy density
  while flat or mildly curved geometries keep the matter and radiation terms standard.
  Including both w₀ and wₐ lets the sampler match the subtle tilt seen in the latest
  joint SNe+BAO data without losing contact with the CAMB-run CMB predictions.
parameters:
- name: Hubble constant
  python_var: H0
  bounds:
  - 50.0
  - 100.0
  unit: km/s/Mpc
  latex_name: H_0
  definition: Present-day expansion rate.
  prior:
    type: uniform
    lower: 50.0
    upper: 100.0
- name: Matter density
  python_var: Omega_m0
  bounds:
  - 0.05
  - 0.7
  latex_name: Omega_{m0}
  definition: Includes both baryons and cold dark matter.
  prior:
    type: uniform
    lower: 0.05
    upper: 0.7
- name: Baryon density
  python_var: Omega_b
  bounds:
  - 0.01
  - 0.1
  latex_name: Omega_b
  definition: Physical baryon mass fraction today.
  prior:
    type: uniform
    lower: 0.01
    upper: 0.1
- name: Photon density
  python_var: Omega_gamma
  bounds:
  - 1.0e-05
  - 0.0001
  latex_name: Omega_{gamma}
  definition: Photon contribution to the acoustic physics.
  prior:
    type: uniform
    lower: 1.0e-05
    upper: 0.0001
- name: Effective neutrino species
  python_var: Neff
  bounds:
  - 2.5
  - 3.5
  latex_name: N_{\rm eff}
  definition: Effective number of relativistic degrees of freedom.
  prior:
    type: uniform
    lower: 2.5
    upper: 3.5
- name: Curvature density
  python_var: Omega_k
  bounds:
  - -0.1
  - 0.1
  latex_name: Omega_k
  definition: Spatial curvature contribution.
  prior:
    type: uniform
    lower: -0.1
    upper: 0.1
- name: w0
  python_var: w0
  bounds:
  - -1.5
  - -0.5
  latex_name: w_0
  definition: Present-day dark-energy equation-of-state.
  prior:
    type: uniform
    lower: -1.5
    upper: -0.5
- name: wa
  python_var: wa
  bounds:
  - -1.0
  - 1.0
  latex_name: w_a
  definition: CPL run rate for the equation-of-state.
  prior:
    type: uniform
    lower: -1.0
    upper: 1.0
- name: Recombination redshift
  python_var: z_rec
  bounds:
  - 1000.0
  - 1200.0
  latex_name: z_{\rm rec}
  definition: Upper limit for the sound-horizon integral.
  prior:
    type: uniform
    lower: 1000.0
    upper: 1200.0
- name: Speed of light
  python_var: c_light
  bounds:
  - 299792.458
  - 299792.458
  unit: km/s
  latex_name: c
  definition: Used in distance and sound-horizon integrals.
  prior:
    type: fixed
    value: 299792.458
Hz_expression: "$$H(z) = H0 * sqrt(\n  Omega_m0 * (1 + z)**3\n  + Omega_gamma * (1\
  \ + 0.2271 * Neff) * (1 + z)**4\n  + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 *\
  \ Neff) - Omega_k)\n      * (1 + z)**(3 * (1 + w0 + wa)) * exp(-3 * wa * z / (1\
  \ + z))\n  + Omega_k * (1 + z)**2\n)$$"
equations:
  sne:
  - $$d_L(z) = (1+z) \int_0^z \frac{c_light\,dz'}{H(z')}$$
  - $$\mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25$$
  bao:
  - $$D_M(z) = \int_0^z \frac{c_light\,dz'}{H(z')}$$
  - $$D_H(z) = \frac{c_light}{H(z)}$$
  - $$D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)$$
rs_expression: "$$r_s = Integral(\n  c_light / sqrt(\n    3 * (1 + 3 * Omega_b / (4\
  \ * Omega_gamma) / (1 + z))\n  ) / (\n    H0 * sqrt(\n      Omega_m0 * (1 + z)**3\n\
  \      + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4\n      + (\n        1\n\
  \        - Omega_m0\n        - Omega_gamma * (1 + 0.2271 * Neff)\n        - Omega_k\n\
  \      ) * (1 + z)**(3 * (1 + w0 + wa)) * exp(-3 * wa * z / (1 + z))\n      + Omega_k\
  \ * (1 + z)**2\n    )\n  ), (z, z_rec, oo)\n)$$"
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  backend: camb
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_m0 - Omega_b) * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    omk: Omega_k
  grids: {}
  values:
    w0_cmb:
      expression: w0
    wa_cmb:
      expression: wa
  calls:
  - method: set_dark_energy
    kwargs:
      w0: '@value.w0_cmb'
      wa: '@value.wa_cmb'
      dark_energy_model: ppf
  perturbations:
    contract_version: 1
    standard: true
    gauge: unspecified
    variables: {}
    derived: {}
    equations: {}
    closures: {}
    sources: {}
    validity:
      regimes:
      - standard_camb_with_declared_background_adapter
      notes: Uses standard backend perturbations with the model's declared background
        adapter contract.
    backend_mapping:
      camb:
        uses_standard_perturbations: true
    notes: Native non-standard perturbation equations are not declared in this model
      file.
  model_parameters: {}
  value_definitions: {}
notes: The CPL dark-energy density multiplies the derived dark-energy density so the
  manifest records the evaluated CPL values along with curvature. When wa → 0 the
  expression collapses to wCDM, making this sample useful for continuity tests in
  the sampler pipeline. Radiation now multiplies Omega_gamma by (1 + 0.2271 * Neff)
  so the BAO integrals share the same relativistic density as the CAMB likelihood.
title: CPL dark energy variation
date: '2025-12-06'
valid_for_distance_metrics: true
generated_code:
  get_Hz_per_Mpc: H0*sqrt(Omega_gamma*(0.2271*Neff + 1)*(z + 1)**4 + Omega_k*(z +
    1)**2 + Omega_m0*(z + 1)**3 + (z + 1)**(3*w0 + 3*wa + 3)*(-Omega_gamma*(0.2271*Neff
    + 1) - Omega_k - Omega_m0 + 1)*exp(-3*wa*z/(z + 1)))
  get_comoving_distance_Mpc: integral(c/H(z))
  get_luminosity_distance_Mpc: (1+z)*DC
  get_angular_diameter_distance_Mpc: DC/(1+z)
  get_DV_Mpc: ((DC^2 * c*z/H)^1/3)
  get_sound_horizon_rs_Mpc: Integral(c_light/(H0*sqrt(9*Omega_b/(4*Omega_gamma*(z
    + 1)) + 3)*sqrt(Omega_gamma*(0.2271*Neff + 1)*(z + 1)**4 + Omega_k*(z + 1)**2
    + Omega_m0*(z + 1)**3 + (z + 1)**(3*w0 + 3*wa + 3)*(-Omega_gamma*(0.2271*Neff
    + 1) - Omega_k - Omega_m0 + 1)*exp(-3*wa*z/(z + 1)))), (z, z_rec, oo))
  distance_modulus_model: 5*log10(DL_Mpc)+25
