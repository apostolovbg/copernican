model_name: QuantumAttractorUnifiedCosmology
version: '1.1'
description: >-
  Quantum Attractor Unified Cosmology (QAUC) extends \LambdaCDM with a dark
  energy sector that oscillates around an exponential attractor. The ansatz is
  lightweight yet demonstrates how YAML models can combine damped waves and
  declared density scalings.
abstract: >-
  The model keeps matter and radiation terms explicit while an attractor
  envelope modulates the dark-energy contribution. Adjustable amplitude,
  frequency, and phase parameters allow the template to mimic a broad range of
  late-time behaviours for experimentation.
parameters:
  - name: Hubble constant
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    python_var: H0
    definition: Present-day Hubble rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 80.0
  - name: Matter density
    bounds: [0.1, 0.5]
    unit: ''
    latex_name: \Omega_{m0}
    python_var: Omega_m0
    definition: Matter density parameter today.
    prior:
      type: uniform
      lower: 0.1
      upper: 0.5
  - name: Radiation density
    bounds: [1.0e-06, 1.0e-03]
    unit: ''
    latex_name: \Omega_{r0}
    python_var: Omega_r0
    definition: Photon and relativistic neutrino density.
    prior:
      type: uniform
      lower: 1.0e-06
      upper: 0.001
  - name: Baryon density
    bounds: [0.01, 0.1]
    unit: ''
    latex_name: \Omega_{b0}
    python_var: Omega_b
    definition: Baryon density parameter.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    bounds: [1.0e-06, 1.0e-04]
    unit: ''
    latex_name: \Omega_{\gamma0}
    python_var: Omega_gamma
    definition: Photon density used by the declared sound-horizon integral.
    prior:
      type: uniform
      lower: 1.0e-06
      upper: 0.0001
  - name: Effective neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    unit: ''
    latex_name: N_{\rm eff}
    definition: Sampled relativistic neutrino count built into Omega_r0.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5
  - name: Recombination redshift
    bounds: [800.0, 1500.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Effective recombination redshift for the sound horizon.
    prior:
      type: uniform
      lower: 800.0
      upper: 1500.0
  - name: Envelope amplitude
    bounds: [0.0, 0.5]
    unit: ''
    latex_name: A
    python_var: A
    definition: Fractional amplitude of the oscillatory attractor.
    prior:
      type: uniform
      lower: 0.0
      upper: 0.5
  - name: Envelope decay scale
    bounds: [0.1, 10.0]
    unit: ''
    latex_name: \alpha
    python_var: alpha
    definition: Exponential damping scale for the oscillatory envelope.
    prior:
      type: uniform
      lower: 0.1
      upper: 10.0
  - name: Oscillation frequency
    bounds: [0.0, 20.0]
    unit: ''
    latex_name: \omega
    python_var: omega
    definition: Angular frequency of the oscillation.
    prior:
      type: uniform
      lower: 0.0
      upper: 20.0
  - name: Phase offset
    bounds: [0.0, 6.283]
    unit: rad
    latex_name: \varphi_0
    python_var: phi0
    definition: Phase offset for the oscillatory component.
    prior:
      type: uniform
      lower: 0.0
      upper: 6.283
Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0*(1 + z)**3 + Omega_r0*(1 + z)**4
    + (1 - Omega_m0 - Omega_r0)
      * (1 + A*exp(-alpha*z)*cos(omega*z + phi0))
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
    - D_H(z) = \frac{c}{H(z)}
    - D_V(z) = [D_M(z)^2 D_H(z)]^{1/3}
rs_expression: >-
  r_s = Integral(
    299792.458 / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_r0 * (1 + z)**4
        + (1 - Omega_m0 - Omega_r0)
          * (1 + A*exp(-alpha*z)*cos(omega*z + phi0))
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_m0 - Omega_b) * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.1
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 0.0001
    k_max: 0.3
    k_sample_count: 64
    eta_sample_count: 192
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: '0.0'
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: H0 * sqrt(Omega_m0 / (a ** 3) + Omega_r0 / (a ** 4) + Omega_de0 * (1 + A
        * exp(-alpha * ((1 / a) - 1)) * cos(omega * ((1 / a) - 1) + phi0)))
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_massive_l
        momentum_grid: massive_neutrino_default
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      minimum_k_sample_count: 64
      scalar_reference_ells:
      - 2
      - 2000
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 0.0001
      k_max: 0.3
      k_sample_count: 64
      eta_sample_count: 192
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 80.0
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
      massive_neutrino_hierarchy_l_max: 5
      momentum_grids:
        massive_neutrino_default:
          count: 8
          q_min: 0.05
          q_max: 18.0
          mass_parameter: sum_mnu
    validity:
      regimes:
      - linear
      - declared_scalar_hierarchy
      notes: QAUC spectra use the declared attractor background and scalar hierarchy.
    notes: The scalar graph couples the declared matter and radiation species
      to the oscillatory attractor background.
notes: >-
  Provide explicit sound-horizon integrals so BAO fits remain physically
  consistent with the Quasi-Accelerating Unified Cosmology background. The
  radiation density Omega_r0 includes the neutrino contribution
  (Omega_gamma * (1 + 0.2271 * Neff)) so BAO ratios align with the declared CMB solver
  background without reinterpreting Omega_r0.
  Neff ranges between 2.5 and 3.5 so the BAO integrals and declared CMB inputs
  share the same effective relativistic density even when the sampler explores
  departures from the classic 3.044 value.
  The declared CMB contract evaluates the oscillatory dark-energy envelope on a
  scale-factor grid and forwards the generated w(a) table into declared CMB solver directly.
