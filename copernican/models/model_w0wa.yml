model_name: w0waCDM
version: '1.0'
description: >-
  ### w₀wₐCDM overview

  The w₀wₐCDM catalog entry elevates the CPL parametrisation to a full
  sample model. A time-varying dark-energy equation of state tracks the
  present-day value w₀ plus a linear run rate wₐ that multiplies the
  scale factor. Complementary BAO, CMB and supernova constraints
  share this unpacked freedom so operators can inspect whether the
  early universe hints at evolving dark energy or if the
  late-time acceleration remains indistinguishable from a cosmological
  constant.

  The Hubble expansion used by the likelihoods incorporates curvature,
  baryon density and radiation support while the CPL factors enter only
  through the dark-energy density. High-redshift physics stays intact
  through the declared photon term, and the H(z) expression below
  keeps Omega_de coupled explicitly to w₀ and wₐ so the manifest
  documents the exact functional form the pipelines use during
  bootstrapping.

  This sample keeps the inference knobs transparent. The w₀ constraint
  comes from the position of the acoustic scale, wₐ influences how
  smoothly the H(z) curve transitions between z≈0 and z≈2, and
  curvature remains a separate slider that the chains may push negative
  or positive without altering the CPL behaviour.
abstract: >-
  The CPL (Chevallier-Polarski-Linder) expansion governs the dark-energy
  density while flat or mildly curved geometries keep the matter and
  radiation terms explicit. Including both w₀ and wₐ lets the sampler
  match joint SNe+BAO data while retaining native CMB predictions.
parameters:
  - name: Hubble constant
    python_var: H0
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    definition: Present-day expansion rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Matter density
    python_var: Omega_m0
    bounds: [0.05, 0.7]
    latex_name: Omega_{m0}
    definition: Includes both baryons and cold dark matter.
    prior:
      type: uniform
      lower: 0.05
      upper: 0.7
  - name: Baryon density
    python_var: Omega_b
    bounds: [0.01, 0.1]
    latex_name: Omega_b
    definition: Physical baryon mass fraction today.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    python_var: Omega_gamma
    bounds: [1.0e-05, 0.0001]
    latex_name: Omega_{gamma}
    definition: Photon contribution to the acoustic physics.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.0001
  - name: Effective neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    latex_name: N_{\rm eff}
    definition: Effective number of relativistic degrees of freedom.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5
  - name: Curvature density
    python_var: Omega_k
    bounds: [-0.1, 0.1]
    latex_name: Omega_k
    definition: Spatial curvature contribution.
    prior:
      type: uniform
      lower: -0.1
      upper: 0.1
  - name: w0
    python_var: w0
    bounds: [-1.5, -0.5]
    latex_name: w_0
    definition: Present-day dark-energy equation-of-state.
    prior:
      type: uniform
      lower: -1.5
      upper: -0.5
  - name: wa
    python_var: wa
    bounds: [-1.0, 1.0]
    latex_name: w_a
    definition: CPL run rate for the equation-of-state.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Recombination redshift
    python_var: z_rec
    bounds: [1000.0, 1200.0]
    latex_name: z_{\rm rec}
    definition: Upper limit for the sound-horizon integral.
    prior:
      type: uniform
      lower: 1000.0
      upper: 1200.0
  - name: Speed of light
    python_var: c_light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    definition: Used in distance and sound-horizon integrals.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0 * (1 + z)**3
    + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
    + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff) - Omega_k)
        * (1 + z)**(3 * (1 + w0 + wa)) * exp(-3 * wa * z / (1 + z))
    + Omega_k * (1 + z)**2
  )
equations:
  sne:
    - d_L(z) = (1+z) \int_0^z \frac{c_light\,dz'}{H(z')}
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = \int_0^z \frac{c_light\,dz'}{H(z')}
    - D_H(z) = \frac{c_light}{H(z)}
    - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
        + (
          1
          - Omega_m0
          - Omega_gamma * (1 + 0.2271 * Neff)
          - Omega_k
        ) * (1 + z)**(3 * (1 + w0 + wa)) * exp(-3 * wa * z / (1 + z))
        + Omega_k * (1 + z)**2
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    omch2: (Omega_m0 - Omega_b) * (H0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    omk: Omega_k
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 0.0001
    k_max: 0.3
    k_sample_count: 64
    eta_sample_count: 192
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: omk
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: H0 * sqrt(Omega_m0 / (a ** 3) + Omega_r0 / (a ** 4) + Omega_de0 * a ** (-3
        * (1 + w0 + wa)) * exp(-3 * wa * (1 - a)) + Omega_k0 / (a ** 2))
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_massive_l
        momentum_grid: massive_neutrino_default
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      minimum_k_sample_count: 64
      scalar_reference_ells:
      - 2
      - 2000
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 0.0001
      k_max: 0.3
      k_sample_count: 64
      eta_sample_count: 192
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 80.0
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
      massive_neutrino_hierarchy_l_max: 5
      momentum_grids:
        massive_neutrino_default:
          count: 8
          q_min: 0.05
          q_max: 18.0
          mass_parameter: sum_mnu
    validity:
      regimes:
      - linear
      - native_scalar_hierarchy
      notes: w0waCDM spectra use the declared CPL background.
    notes: The scalar graph couples declared matter and radiation species to
      the time-dependent CPL dark-energy expansion law.
notes: >-
  The CPL dark-energy density multiplies the derived dark-energy
  density so the manifest records the evaluated CPL values along with
  curvature. When wa → 0 the expression collapses to wCDM, making
  this sample useful for continuity tests in the sampler pipeline.
  Radiation multiplies Omega_gamma by (1 + 0.2271 * Neff) so the
  BAO integrals share the same relativistic density as the native CMB solver
  likelihood.
title: CPL dark energy variation
date: '2025-12-06'
