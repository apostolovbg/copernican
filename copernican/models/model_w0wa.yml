model_name: w0waCDM
version: '1.0'
description: >-
  ### w₀wₐCDM overview

  The w₀wₐCDM catalog entry elevates the CPL parametrisation to a full
  sample model. A time-varying dark-energy equation of state tracks the
  present-day value w₀ plus a linear run rate wₐ that multiplies the
  scale factor. Complementary BAO, CMB and supernova constraints
  share this unpacked freedom so operators can inspect whether the
  early universe hints at evolving dark energy or if the
  late-time acceleration remains indistinguishable from a cosmological
  constant.

  The Hubble expansion used by the likelihoods incorporates curvature,
  baryon density and radiation support while the CPL factors enter only
  through the dark-energy density. High-redshift physics stays intact
  through the declared photon and neutrino terms, and the shared H(z) law
  keeps Omega_de coupled explicitly to w₀ and wₐ so the manifest
  documents the exact functional form the pipelines use during
  bootstrapping.

  This sample keeps the inference knobs transparent. The w₀ constraint
  comes from the position of the acoustic scale, wₐ influences how
  smoothly the H(z) curve transitions between z≈0 and z≈2, and
  curvature remains a separate slider that the chains may push negative
  or positive without altering the CPL behaviour.
abstract: >-
  The CPL (Chevallier-Polarski-Linder) expansion governs the dark-energy
  density while flat or mildly curved geometries keep the matter and
  radiation terms explicit. Including both w₀ and wₐ lets the sampler
  match joint SNe+BAO data while retaining declared CMB predictions.
parameters:
  - name: Hubble constant
    python_var: H0
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_0
    definition: Present-day expansion rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Matter density
    python_var: Omega_m0
    bounds: [0.05, 0.7]
    latex_name: Omega_{m0}
    definition: Includes both baryons and cold dark matter.
    prior:
      type: uniform
      lower: 0.05
      upper: 0.7
  - name: Baryon density
    python_var: Omega_b
    bounds: [0.01, 0.1]
    latex_name: Omega_b
    definition: Physical baryon mass fraction today.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.1
  - name: Photon density
    python_var: Omega_gamma
    bounds: [1.0e-05, 0.0001]
    latex_name: Omega_{gamma}
    definition: Photon contribution to the acoustic physics.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.0001
  - name: Effective neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    latex_name: N_{\rm eff}
    definition: Effective number of relativistic degrees of freedom.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5
  - name: Curvature density
    python_var: Omega_k
    bounds: [-0.1, 0.1]
    latex_name: Omega_k
    definition: Spatial curvature contribution.
    prior:
      type: uniform
      lower: -0.1
      upper: 0.1
  - name: w0
    python_var: w0
    bounds: [-1.5, -0.5]
    latex_name: w_0
    definition: Present-day dark-energy equation-of-state.
    prior:
      type: uniform
      lower: -1.5
      upper: -0.5
  - name: wa
    python_var: wa
    bounds: [-1.0, 1.0]
    latex_name: w_a
    definition: CPL run rate for the equation-of-state.
    prior:
      type: uniform
      lower: -1.0
      upper: 1.0
  - name: Recombination redshift
    python_var: z_rec
    bounds: [1000.0, 1200.0]
    latex_name: z_{\rm rec}
    definition: Lower redshift limit for the recombination sound-horizon integral.
    prior:
      type: uniform
      lower: 1000.0
      upper: 1200.0
  - name: Speed of light
    python_var: c_light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    definition: Used in distance and sound-horizon integrals.
    prior:
      type: fixed
      value: 299792.458
transverse_geometry:
  kind: flrw
  curvature: Omega_k
  hubble: H0
geometry: cmb.background
sound_horizon_redshift: z_rec
equations:
  sne:
    - d_L(z) = (1+z) D_M(z)
    - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
    - D_M(z) = S_k(\int_0^z \frac{c_light\,dz'}{H(z')})
    - D_H(z) = \frac{c_light}{H(z)}
    - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  param_map:
    H0: H0
    ombh2: Omega_b * (H0/100)**2
    # The relativistic amplitude and temperature determine the rest density.
    # 0.3173218672360423 is the Fermi-Dirac q^2/q^3 moment ratio.
    omnuh2: >-
      0.22710731766 * Omega_gamma * 0.5 * (Neff + 3 - abs(Neff - 3))
      * (0.06 / 3) * 0.3173218672360423
      / (8.617333262145e-5 * 2.7255 * (4.0 / 11.0)**(1.0 / 3.0))
      * (H0 / 100)**2
    omch2: >-
      (Omega_m0 - Omega_b - 0.22710731766 * Omega_gamma
      * 0.5 * (Neff + 3 - abs(Neff - 3)) * (0.06 / 3)
      * 0.3173218672360423 / (8.617333262145e-5 * 2.7255
      * (4.0 / 11.0)**(1.0 / 3.0))) * (H0 / 100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    omk: Omega_k
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: omk
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      effective_massive_neutrino_species: 0.5 * (Neff
        + num_massive_neutrinos - abs(Neff - num_massive_neutrinos))
      Omega_nu_massless0: Omega_nu0 * (Neff
        - effective_massive_neutrino_species) / Neff
      massive_neutrino_mass_eV: sum_mnu / (num_massive_neutrinos + 1.0e-30)
      massive_neutrino_transition_a: (3.151 * ((4.0 / 11.0) ** (1.0 / 3.0))
        * 8.617333262145e-5 * Tcmb_K) / (massive_neutrino_mass_eV + 1.0e-30)
      Omega_nu_massive_rel0: Omega_nu0 * effective_massive_neutrino_species
        / Neff
      Omega_nu_massive_nr0: omnuh2 / (h * h)
      Omega_nu_massive0: Omega_nu_massive_nr0
        + (Omega_nu_massive_rel0 - Omega_nu_massive_nr0)
        * exp(-massive_neutrino_mass_eV / 1.0e-4)
      Omega_r0: Omega_gamma0 + Omega_nu_massless0
        + Omega_nu_massive_rel0
      Omega_de0: 1.0 - Omega_b0 - Omega_c0 - Omega_nu_massive0
        - Omega_gamma0 - Omega_nu_massless0 - Omega_k0
      massive_neutrino_energy_factor: sqrt(a * a
        + massive_neutrino_transition_a * massive_neutrino_transition_a)
        / (sqrt(1.0 + massive_neutrino_transition_a
        * massive_neutrino_transition_a) * (a ** 4))
      massive_neutrino_density_a4: Omega_nu_massive0
        * massive_neutrino_energy_factor
      dark_energy_density_factor: a ** (-3 * (1 + w0 + wa))
        * exp(-3 * wa * (1 - a))
      dark_energy_eos_a: w0 + wa * (1 - a)
      dark_energy_pressure_factor: dark_energy_eos_a
        * dark_energy_density_factor
      dark_energy_sound_speed_sq: 1.0
      H: H0 * sqrt((Omega_gamma0 + Omega_nu_massless0) / (a ** 4)
        + massive_neutrino_density_a4 + (Omega_b0 + Omega_c0)
        / (a ** 3) + Omega_de0 * dark_energy_density_factor
        + Omega_k0 / (a ** 2))
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        - massive_neutrino
        - dark_energy
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      dark_energy:
        sector: scalar
        equation_of_state: w0 + wa * (1 - a)
        sound_speed: '1.0'
        anisotropic_stress: zero
        background_reference: Omega_de0
        scalar_closure:
          kind: ppf
          density_fraction: Omega_de0 * dark_energy_density_factor
          other_enthalpy: >-
            (Omega_b0 + Omega_c0) / a
            + (4.0 / 3.0) * (Omega_gamma0 + massless_neutrino_fraction)
              / (a * a)
            + a * a * (massive_neutrino_density_fraction
              + massive_neutrino_pressure_fraction)
          transition: '0.4'
          initial: '0.0'
        description: Conserved PPF dark-energy scalar closure.
    hierarchy_families:
      photon_temperature:
        physical_role: photon_temperature
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        physical_role: photon_polarization
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        multipole_symbol: e_gamma_l
      massless_neutrino:
        physical_role: massless_neutrino
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        multipole_symbol: nu_l
      massive_neutrino:
        physical_role: massive_neutrino
        phase_space:
          distribution: fermi_dirac
          mass_parameter: sum_mnu
          multiplicity_parameter: num_massive_neutrinos
          relativistic_density: >-
            0.22710731766 * Omega_gamma * 0.5 * (Neff + 3 - abs(Neff - 3))
          temperature_ratio: >-
            (4.0 / 11.0)**(1.0 / 3.0)
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        multipole_symbol: nu_massive_l
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    validity:
      regimes:
      - linear
      - declared_scalar_hierarchy
      notes: w0waCDM spectra use the declared CPL background.
    notes: The scalar graph couples declared matter and radiation species to
      the time-dependent CPL dark-energy expansion law.
notes: >-
  Distance and CMB calculations share the declared expansion and kinetic
  neutrino densities. The recombination sound horizon uses the sampled
  z_rec endpoint; BAO uses the independently resolved baryon-drag endpoint.
title: CPL dark energy variation
date: '2025-12-06'
