model_name: LambdaCDM
version: '1.0'
description: >-
  Flat LambdaCDM model executed by Copernican's native declared-graph CMB
  solver. The background, recombination inputs, scalar hierarchy, sources,
  projections, and numerical controls are declared in this file.
abstract: >-
  LambdaCDM with a standard adiabatic scalar perturbation sector. This native
  migration artifact supplies the production CCMBS graph while preserving the
  cosmological parameter convention of the reference model.
parameters:
- name: Hubble constant
  bounds:
  - 50.0
  - 100.0
  unit: km/s/Mpc
  latex_name: H_0
  definition: Present expansion rate.
  prior:
    type: uniform
    lower: 50.0
    upper: 100.0
- name: Matter density
  bounds:
  - 0.05
  - 0.7
  latex_name: Omega_{m0}
  definition: Total cold matter fraction today.
  prior:
    type: uniform
    lower: 0.05
    upper: 0.7
- name: Baryon density
  bounds:
  - 0.01
  - 0.1
  latex_name: Omega_b
  definition: Baryon fraction of the total matter density today.
  prior:
    type: uniform
    lower: 0.01
    upper: 0.1
- name: Photon density
  bounds:
  - 1.0e-05
  - 0.0001
  latex_name: Omega_{gamma}
  definition: Photon density used by the distance and sound-horizon model.
  prior:
    type: uniform
    lower: 1.0e-05
    upper: 0.0001
- name: Effective neutrino species
  python_var: Neff
  bounds:
  - 2.5
  - 3.5
  latex_name: N_{\rm eff}
  definition: Effective number of relativistic neutrino species.
  prior:
    type: uniform
    lower: 2.5
    upper: 3.5
- name: Recombination redshift
  bounds:
  - 1000.0
  - 1200.0
  latex_name: z_{rec}
  definition: Redshift used by the distance-model sound-horizon integral.
  prior:
    type: uniform
    lower: 1000.0
    upper: 1200.0
- name: CMB temperature
  python_var: Tcmb_K
  bounds:
  - 2.7255
  - 2.7255
  unit: K
  latex_name: T_{\rm CMB}
  definition: Present CMB temperature used by the native background.
  prior:
    type: fixed
    value: 2.7255
Hz_expression: >-
  H(z) = H_0 * sqrt(
    Omega_{m0}*(1 + z)**3
    + Omega_{gamma}*(1 + 0.2271 * Neff)*(1 + z)**4
    + (1 - Omega_{m0} - Omega_{gamma}*(1 + 0.2271 * Neff))
  )
equations:
  sne:
  - d_L(z) = (1+z) \int_0^z \frac{c\,dz'}{H(z')}
  - \mu(z) = 5\log_{10}[d_L(z)/{\rm Mpc}] + 25
  bao:
  - D_M(z) = \int_0^z \frac{c\,dz'}{H(z')}
  - D_H(z) = \frac{c}{H(z)}
  - D_V(z) = [D_M(z)**2 * D_H(z)]**(1/3)
rs_expression: >-
  r_s = Integral(
    299792.458 / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_{gamma}) / (1 + z))
    ) / (
      H_0 * sqrt(
        Omega_{m0} * (1 + z)**3
        + Omega_{gamma} * (1 + 0.2271 * Neff) * (1 + z)**4
        + (1 - Omega_{m0} - Omega_{gamma} * (1 + 0.2271 * Neff))
      )
    ), (z, z_{rec}, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_distance_metrics: true
valid_for_cmb: true
cmb:
  backend: camb
  param_map:
    H0: H_0
    ombh2: Omega_b * (H_0/100)**2
    omch2: (Omega_{m0} - Omega_b) * (H_0/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    YHe: 0.245
    sum_mnu: 0.0
    num_massive_neutrinos: 3
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 1.0e-4
    k_max: 0.3
    k_sample_count: 18
    eta_sample_count: 192
    ode_rtol: 1.0e-5
    ode_atol: 1.0e-8
    tight_coupling_ratio: 80.0
    a_min: 1.0e-6
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: 0.0
      Tcmb: Tcmb_K
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: 2.469e-5 * ((Tcmb_K / 2.7255)**4) / (h * h)
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_m0: Omega_b0 + Omega_c0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: >-
        H0 * sqrt(
          Omega_r0 / (a ** 4)
          + Omega_m0 / (a ** 3)
          + Omega_k0 / (a ** 2)
          + Omega_de0
        )
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: >-
          exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: >-
          exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: >-
          (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: >-
          hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: >-
          (10 ** reionization_log10_amplitude)
          * H_SI
          * hard_source
          * quasar_helium_hardness
  perturbations:
    contract_version: 2
    standard: false
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: >-
          collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: >-
          3.0 * acoustic_k * photon_baryon_momentum_ratio
          * thomson_drag + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      scalar_reference_ells:
      - 2
      - 2000
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 1.0e-4
      k_max: 0.3
      k_sample_count: 18
      eta_sample_count: 192
      ode_rtol: 1.0e-5
      ode_atol: 1.0e-8
      tight_coupling_ratio: 80.0
      a_min: 1.0e-6
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
    validity:
      regimes:
      - linear
      - native_scalar_hierarchy
      notes: Native LambdaCDM scalar graph with regular adiabatic initial data.
    backend_mapping:
      camb:
        native_solver_required: true
        implemented: true
    notes: >-
      This is the native CCMBS production graph. The backend key identifies
      the historical contract vocabulary; native_solver_required keeps
      execution in Copernican's declared hierarchy solver.
notes: >-
  The native artifact keeps the reference cosmology mapping used by the
  independent scientific tests while making the scalar hierarchy explicit
  through its declared species, hierarchy families, collision operator,
  initial-mode family, projection typing, and bounded numerical controls.
