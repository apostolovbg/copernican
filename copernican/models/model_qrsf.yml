model_name: QRSF
version: '2.0'
description: >-
  ### Quantum Relational Scale Field (QRSF)

  The Quantum Relational Scale Field model treats cosmic expansion as the
  response of baryonic rulers and clocks to an entangled vacuum reservoir.
  Baryons acquire additional inertial weight when they remain correlated with
  the reservoir, while late-time decoherence releases stored relational energy
  that pushes the universe into accelerated expansion. The framework keeps
  early-universe physics intact by sourcing every correction from the baryon
  and photon sectors rather than importing a particulate dark component.

  Two ingredients control the expansion history. A scale-locking channel boosts
  baryon inertia by a factor that transitions smoothly between a high-redshift
  plateau and a low-redshift residual, ensuring the cosmic microwave background
  and baryon acoustic oscillations see the matter support they require while
  supernova distances follow a ΛCDM-like ladder today. A relational release
  channel stores vacuum correlations as an effective fluid with a flexible
  equation of state, letting the model emulate dark-energy behaviour without
  abandoning its quantum-relational origin. Both channels share the same
  microscopic motivation: the entanglement phase of baryons with the vacuum
  reservoir evolves with redshift, and observables measure how that evolution
  reshapes inertia and pressure.
abstract: >-
  Quantum Relational Scale Field cosmology links baryonic entanglement with the
  vacuum to cosmic acceleration. A smooth transition between high- and low-
  redshift inertia plateaus supplies the matter support demanded by BAO and CMB
  data. A relational fluid with a tunable equation of state captures late-time
  acceleration. The construction keeps early-universe physics intact and
  frames cosmic dynamics as a response to changing vacuum correlations.
parameters:
  - name: Hubble scale today
    bounds: [50.0, 100.0]
    unit: km/s/Mpc
    latex_name: H_\star
    python_var: H_star
    definition: Apparent Hubble rate measured by local shrinking clocks.
    prior:
      type: uniform
      lower: 50.0
      upper: 100.0
  - name: Baryon density
    bounds: [0.01, 0.12]
    unit: ''
    latex_name: \Omega_b
    python_var: Omega_b
    definition: Physical baryon fraction referenced to the universal frame.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.12
  - name: Photon density
    bounds: [1.0e-05, 0.001]
    unit: ''
    latex_name: \Omega_\gamma
    python_var: Omega_gamma
    definition: Photon contribution for the sound horizon integrand.
    prior:
      type: uniform
      lower: 1.0e-05
      upper: 0.001
  - name: Effective neutrino species
    bounds: [2.5, 3.5]
    unit: ''
    latex_name: N_{\rm eff}
    python_var: Neff
    definition: Sampled relativistic neutrino count aligned with native CMB inputs.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5
  - name: Recombination redshift
    bounds: [900.0, 1200.0]
    unit: ''
    latex_name: z_{\rm rec}
    python_var: z_rec
    definition: Reference redshift used in the sound-horizon integral.
    prior:
      type: uniform
      lower: 900.0
      upper: 1200.0
  - name: High-redshift entanglement boost
    bounds: [0.0, 10.0]
    unit: ''
    latex_name: \xi_{\rm hi}
    python_var: xi_high
    definition: Plateau value of the baryon inertia enhancement at early times.
    prior:
      type: uniform
      lower: 0.0
      upper: 10.0
  - name: Low-redshift entanglement residual
    bounds: [0.0, 5.0]
    unit: ''
    latex_name: \xi_{\rm lo}
    python_var: xi_low
    definition: Residual baryon inertia enhancement measured today.
    prior:
      type: uniform
      lower: 0.0
      upper: 5.0
  - name: Entanglement transition redshift
    bounds: [0.3, 20.0]
    unit: ''
    latex_name: z_{\rm trans}
    python_var: z_trans
    definition: Redshift where the inertia enhancement shifts between plateaus.
    prior:
      type: uniform
      lower: 0.3
      upper: 20.0
  - name: Entanglement transition slope
    bounds: [1.0, 8.0]
    unit: ''
    latex_name: n_{\rm trans}
    python_var: n_trans
    definition: Controls how quickly the enhancement crosses plateaus.
    prior:
      type: uniform
      lower: 1.0
      upper: 8.0
  - name: Relational density today
    bounds: [0.0, 1.2]
    unit: ''
    latex_name: \Omega_{\rm rel0}
    python_var: Omega_rel0
    definition: Present-day energy density of the relational release fluid.
    prior:
      type: uniform
      lower: 0.0
      upper: 1.2
  - name: Relational equation-of-state today
    bounds: [-2.0, -0.1]
    unit: ''
    latex_name: w_{\rm rel0}
    python_var: w_rel0
    definition: Equation-of-state parameter of the relational fluid at z=0.
    prior:
      type: uniform
      lower: -2.0
      upper: -0.1
  - name: Relational evolution slope
    bounds: [-2.0, 2.0]
    unit: ''
    latex_name: w_{\rm rel,a}
    python_var: w_rel_a
    definition: CPL-like slope for the relational equation-of-state drift.
    prior:
      type: uniform
      lower: -2.0
      upper: 2.0
  - name: Speed of light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    python_var: c_light
    definition: Fixed speed of light for distance and sound-horizon integrals.
    prior:
      type: fixed
      value: 299792.458
Hz_expression: >-
  H(z) = H_star * sqrt(
    Omega_b * (1 + z)**3 * (
      1 + xi_low
      + (xi_high - xi_low) * (
        ((1 + z)/(1 + z_trans))**n_trans
        / (1 + ((1 + z)/(1 + z_trans))**n_trans)
      )
    )
    + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
    + Omega_rel0 * (1 + z)**(3 * (1 + w_rel0 + w_rel_a))
        * exp(-3 * w_rel_a * z / (1 + z))
  )
equations:
  sne:
    - d_L(z) = (1 + z) * Integral(c_light / H(zp), (zp, 0, z))
    - mu(z) = 5 * log10(d_L(z)) + 25
  bao:
    - D_M(z) = Integral(c_light / H(zp), (zp, 0, z))
    - D_H(z) = c_light / H(z)
    - D_V(z) = (D_M(z)**2 * D_H(z))**(1/3)
rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (
        1 + 3 * Omega_b * (
          1 + xi_low
          + (xi_high - xi_low) * (
            ((1 + z)/(1 + z_trans))**n_trans
            / (1 + ((1 + z)/(1 + z_trans))**n_trans)
          )
        ) / (4 * Omega_gamma * (1 + z))
      )
    ) / (
      H_star * sqrt(
        Omega_b * (1 + z)**3 * (
          1 + xi_low
          + (xi_high - xi_low) * (
            ((1 + z)/(1 + z_trans))**n_trans
            / (1 + ((1 + z)/(1 + z_trans))**n_trans)
          )
        )
        + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
        + Omega_rel0 * (1 + z)**(3 * (1 + w_rel0 + w_rel_a))
            * exp(-3 * w_rel_a * z / (1 + z))
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_cmb: true
cmb:
  backend: camb
  param_map:
    H0: H_star
    ombh2: Omega_b * (H_star/100)**2
    omch2: Omega_b * xi_high * (H_star/100)**2
    omnuh2: Omega_gamma * (1 + 0.2271 * Neff) * (H_star/100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 0.0001
    k_max: 0.3
    k_sample_count: 18
    eta_sample_count: 192
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: '0.0'
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_m0: Omega_b0 + Omega_c0
      w0: w_rel0
      wa: w_rel_a
      qrsf_transition_ratio: ((1 / a) / (1 + z_trans)) ** n_trans
      qrsf_matter_factor: 1 + xi_low + (xi_high - xi_low) * qrsf_transition_ratio
        / (1 + qrsf_transition_ratio)
      qrsf_rel_factor: (1 / a) ** (3 * (1 + w_rel0 + w_rel_a)) * exp(-3 * w_rel_a
        * (1 - a))
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: H0 * sqrt(Omega_b * (1 / a) ** 3 * qrsf_matter_factor + Omega_gamma * (1
        + 0.2271 * Neff) * (1 / a) ** 4 + Omega_rel0 * qrsf_rel_factor)
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    standard: false
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_massive_l
        momentum_grid: massive_neutrino_default
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      scalar_reference_ells:
      - 2
      - 2000
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources:
      qrsf_matter_density:
        expression: >-
          Omega_b0 * qrsf_matter_factor * observable_delta_b
        role: matter_density
        description: QRSF baryon-locked density source with relational inertia.
      qrsf_matter_momentum:
        expression: >-
          Omega_b0 * qrsf_matter_factor * observable_theta_b
        role: matter_momentum
        description: QRSF baryon-locked momentum source with relational inertia.
      qrsf_baryon_euler:
        expression: >-
          -Hconf * theta_b + acoustic_k_sq * baryon_sound_speed_sq * delta_b
          + baryon_thomson_drag / qrsf_matter_factor + acoustic_k_sq * Psi
        role: baryon_euler
        description: QRSF inertial baryon Euler closure.
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 0.0001
      k_max: 0.3
      k_sample_count: 18
      eta_sample_count: 192
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 80.0
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
      massive_neutrino_hierarchy_l_max: 5
      momentum_grids:
        massive_neutrino_default:
          count: 8
          q_min: 0.05
          q_max: 18.0
          mass_parameter: sum_mnu
    validity:
      regimes:
      - linear
      - native_scalar_hierarchy
      notes: Production spectra use the Copernican native hierarchy.
    backend_mapping:
      camb:
        native_solver_required: true
        implemented: true
    notes: Native declared scalar hierarchy for QRSF; the model background remains
      theory-specific.
notes: >-
  The entanglement enhancement saturates to xi_high at early times and relaxes
  toward xi_low today, so CMB-era inertia matches a cold-matter analogue while
  late-time distances preserve Supernova calibration. The relational release
  fluid behaves like a CPL parameterisation with density Omega_rel0 and slopes
  w_rel0, w_rel_a. The relativistic species count Neff floats between 2.5 and
  3.5 so reported BAO ratios and native CMB inputs always share the same effective
  radiation density. The native CMB graph applies the declared baryon-locked
  relational inertia source rather than introducing a particulate dark sector.
  The BAO radiation term multiplies Omega_gamma by (1 + 0.2271 * Neff) so the
  sonic scale shares the same relativistic density as the native CMB background.
  The native CMB contract declares the relational fluid and its perturbation
  source closure instead of flattening the parameters into a scalar-only map.
title: Quantum Relational Scale Field Cosmology
date: '2025-11-08'
