model_name: USMFv2
version: '2.0'
description: '### 1. Introduction

  Modern cosmology, while remarkably successful, faces fundamental
  challenges centered around the concepts of dark energy and dark
  matter, hypothetical entities comprising ~95% of the Universe''s
  energy density. The observed accelerated expansion of the
  Universe [1, 2] and anomalous galactic and cluster dynamics [3, 4]
  are the primary evidence for their existence. The Unified Shrinking
  Matter Framework (USMF) offers an alternative perspective,
  positing that these phenomena are not due to new fundamental
  entities but are rather illusions. These illusions arise from a
  continuous, inhomogeneous shrinking of matter and physical scales
  within dense regions of the Universe, when observations are made
  with locally shrinking instruments and interpreted against a
  presumed static background.

  This framework aims to explain the apparent cosmic acceleration and
  the effects attributed to dark matter by re-evaluating the nature of
  our reference frames and the evolution of physical scales over
  cosmic time. This updated document (Version 2) incorporates further
  elaborations on the model''s theoretical underpinnings, early
  universe compatibility, and more detailed unique predictions.

  ### 2. Core Concepts of the Unified Shrinking Matter Framework

  USMF is built upon several foundational ideas that distinguish it
  from standard cosmological models.

  #### 2.1. Dual Reference Frames

  A central tenet of USMF is the existence of two distinct types of
  reference frames:

  * A **Universal Coordinate System** ($X, Y, Z, T_{univ}$): This is
    a static, non-shrinking, four-dimensional Cartesian framework
    representing the Universe at its largest scales. Universal time
    is denoted as $t_{univ}$ or simply $t$.

  * **Local Coordinate Systems** ($x, y, z, t_{local}$): These are
    tied to dense regions of matter, such as galaxies and galaxy
    clusters. Within these local frames, spacetime itself, along with
    all matter, energy, and measuring instruments, undergoes a process
    of shrinking over cosmic time relative to the universal
    coordinates.

  Observations made from Earth are inherently from within such a local,
  shrinking frame.

  #### 2.2. Inhomogeneous Shrinking and its Quantification

  The process of shrinking is not uniform throughout the Universe. It is
  posited to occur primarily within regions of significant matter density.
  Cosmic voids, being largely devoid of matter, are assumed to retain their
  original scales (established at a "Universal Creation Event" or UDE) in the
  universal coordinate system. As dense regions contract, voids effectively
  appear to expand or "empty out" relative to these shrinking zones. This
  inhomogeneity is crucial for explaining the apparent distribution of "dark
  matter" effects.

  **Quantifying Inhomogeneous Shrinking**: The Universal Scaling Factor
  $\alpha_U$ becomes a function of local environment:

  $\alpha_U(\rho, t_{\text{univ}}, \mathbf{x}) = \alpha_{U,bg}(t_{\text{univ}})
  \cdot f(\rho_{local}(\mathbf{x}, t_{\text{univ}}), \text{history})$.

  Here, $\alpha_{U,bg}(t_{\text{univ}})$ is the background cosmological
  shrinking factor, and $f$ describes the modulation due to local density
  $\rho_{local}$ and potentially its history.

  #### 2.3. The Metric in Dense Regions

  Within a local, dense, shrinking region, the spacetime metric is proposed
  to take the form:

  ds**2 = -c**2 dt_{local}**2 + alpha_U(t_{univ}, env)**2 delta_{ij} dx^i
  dx^j

  where $c$ is the speed of light, $dt_{local}$ is the local time interval,
  $dx^i$ are local Cartesian spatial coordinate intervals, $delta_{ij}$ is the
  Kronecker delta, and $alpha_U(t_{univ}, env)$ is the Universal Scaling
  Factor. This factor $alpha_U$ describes the magnitude of spatial shrinking
  as a function of universal time $t_{univ}$ and potentially local
  environmental factors ($env$) such as density $\rho$. For the background
  cosmological model, we primarily consider its temporal evolution
  $alpha_U(t_{univ})$. The shrinking implies that $alpha_U(t_{univ})$ is a
  decreasing function of cosmic time.

  *(... The rest of the theoretical sections from the JSON would follow
  here, formatted with Markdown headings ...)*'
abstract: >-
  The Unified Shrinking Matter Framework (USMF) is a cosmological model
  proposing that the observed accelerated expansion of the Universe and
  phenomena attributed to dark energy and dark matter are apparent
  effects. These arise from observations made from within dense cosmic
  structures (like galaxies) that are themselves shrinking over cosmic
  time relative to a static universal coordinate system. This paper
  details the core concepts of USMF, its refined mathematical
  formulation including considerations for early universe evolution,
  the mechanisms for inhomogeneous shrinking, and its implications for
  key cosmological observations such as Type Ia supernovae, Big Bang
  Nucleosynthesis, Baryon Acoustic Oscillations, and the matter-antimatter
  asymmetry. The framework suggests a dynamic evolution of fundamental
  scales and the effective gravitational constant ($G_{univ}(t)$),
  proposing specific modifications to gravitational field equations and
  offering novel explanations and unique testable predictions for cosmic
  puzzles without invoking new undiscovered particles or energy fields.
