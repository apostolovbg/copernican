Hz_expression: >-
  H(z) = H_A * (1 + z)**(1 + p_{alpha}) * exp(
    k_{exp} * (atan((1 + z)**s_{exp}) - pi / 4)
  )
equations:
  sne:
  - "1+z = \frac{alpha(t_e)}{alpha(t_0)}"
  - "r = int_{t_e}**{t_0} \frac{c}{alpha(t')} dt'"
  - "d_L(z) = |r| cdot (1+z)**2 cdot \frac{70.0}{H_A}"
  - mu = 5 log_{10}(d_L) + 25
  bao:
  - "D_A(z) = |r| cdot \frac{70.0}{H_A}"
  - >-
    H_{USMF}(z) = - \frac{1}{alpha(t_e)}
    left. \frac{dalpha}{dt} \right|_{t_e}
  - "D_V(z) = left[ (1+z)**2 D_A(z)**2 \frac{cz}{H(z)} \right]**{1/3}"
rs_expression: >-
  r_s = Integral(
    299792.458 / sqrt(
      3 * (1 + 3 * \Omega_b / (4 * \Omega_{\gamma}) / (1 + z))
    ) / (
      H_A * (1 + z)**(1 + p_{alpha}) * exp(
        k_{exp} * (atan((1 + z)**s_{exp}) - pi / 4)
      )
    ), (z, z_rec, oo)
  )
skip_bao: false
valid_for_bao: true
valid_for_cmb: false
cmb:
  backend: camb
  param_map:
    H0: H_A
    ombh2: \Omega_b*(H_A/100)**2
    omch2: 0.0
    omnuh2: \Omega_{\gamma}*(1 + 0.2271 * Neff)*(H_A/100)**2
    Neff: Neff
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    YHe: 0.245
    sum_mnu: 0.0
    num_massive_neutrinos: 3
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 0.0001
    k_max: 0.3
    k_sample_count: 18
    eta_sample_count: 192
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: '0.0'
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_m0: Omega_b0 + Omega_c0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: H0 * (1 / a) ** (1 + p_alpha) * exp(k_exp * (atan((1 / a) ** s_exp) - pi
        / 4))
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    standard: false
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - massless_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      scalar_reference_ells:
      - 2
      - 2000
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 0.0001
      k_max: 0.3
      k_sample_count: 18
      eta_sample_count: 192
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 80.0
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
    validity:
      regimes:
      - linear
      - native_scalar_hierarchy
      notes: CMB output is unavailable without a declared perturbation closure.
    backend_mapping:
      camb:
        native_solver_required: true
        implemented: true
    notes: >-
      The model declares no defensible linear perturbation closure for the
      shrinking-matter mechanism. CMB output is unavailable until that
      closure is specified; the native solver does not substitute a
      particulate matter sector.
notes: >-
  Detailed model behaviour embedded in this JSON. The BAO radiation mapping
  multiplies
  Omega_gamma by (1 + 0.2271 * Neff) inside omnuh2 so the neutrino content
  matches the native CMB background, and letting Neff float between 2.5 and 3.5 keeps
  the sampled radiation density aligned with the analytic integrals without
  hard-coding the Planck default.
  The native CMB contract evaluates the shrinking-matter background on a
  scale-factor grid and forwards an effective w(a) table into native CMB solver directly.
title: The Unified Shrinking Matter Framework (USMF) Version 2
date: '2025-05-26'
