model_name: Temporal Opposition Geometry
version: '1.0'
description: >-
  Temporal Opposition Geometry models cosmic acceleration as a
  volume-activated temporal-opposition contribution. The theory does
  not treat time as a fourth spatial axis. It treats the temporal
  contribution as Lorentz-opposed to spatial extension and activated
  by the growth of three-dimensional spatial volume.
abstract: >-
  TOG defines a flat FLRW background with standard matter and
  radiation plus a bounded temporal-opposition activation law. The
  temporal term is negligible at small scale factor, activates with
  spatial volume, and saturates toward the future. The parameter a_T
  controls the activation scale. LambdaCDM is recovered in the limit
  where the activation is saturated over the observed range.

parameters:
  - name: Hubble constant
    python_var: H0
    bounds: [50.0, 80.0]
    unit: km/s/Mpc
    latex_name: H_0
    definition: Present-day Hubble expansion rate.
    prior:
      type: gaussian
      mean: 68.0
      sigma: 4.0

  - name: Matter density
    python_var: Omega_m0
    bounds: [0.05, 0.45]
    unit: ''
    latex_name: \Omega_{m0}
    definition: Present-day non-relativistic matter density fraction.
    prior:
      type: uniform
      lower: 0.05
      upper: 0.45

  - name: Baryon density
    python_var: Omega_b
    bounds: [0.03, 0.06]
    unit: ''
    latex_name: \Omega_b
    definition: Present-day baryonic matter density fraction.
    prior:
      type: uniform
      lower: 0.03
      upper: 0.06

  - name: Photon density
    python_var: Omega_gamma
    bounds: [5.38e-05, 5.38e-05]
    unit: ''
    latex_name: \Omega_{\gamma}
    definition: Fixed photon density parameter at z=0.
    prior:
      type: fixed
      value: 5.38e-05

  - name: Effective number of relativistic neutrino species
    python_var: Neff
    bounds: [2.5, 3.5]
    unit: ''
    latex_name: N_{\rm eff}
    definition: Effective relativistic neutrino count.
    prior:
      type: uniform
      lower: 2.5
      upper: 3.5

  - name: Temporal activation scale
    python_var: a_T
    bounds: [0.05, 2.0]
    unit: ''
    latex_name: a_T
    definition: Scale factor where temporal opposition activates.
    prior:
      type: uniform
      lower: 0.05
      upper: 2.0

  - name: Recombination redshift
    python_var: z_rec
    bounds: [1089.92, 1089.92]
    unit: ''
    latex_name: z_{\rm rec}
    definition: Fixed photon-decoupling redshift.
    prior:
      type: fixed
      value: 1089.92

  - name: Speed of light
    python_var: c_light
    bounds: [299792.458, 299792.458]
    unit: km/s
    latex_name: c
    definition: Fixed speed of light.
    prior:
      type: fixed
      value: 299792.458

Hz_expression: >-
  H(z) = H0 * sqrt(
    Omega_m0 * (1 + z)**3
    + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
    + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff))
      * (
        1 - exp(-((1 / (1 + z)) / a_T)**3)
      ) / (
        1 - exp(-(1 / a_T)**3)
      )
  )

equations:
  sne:
    - d_L(z) = (1 + z) Integral(c_light / H(zp), (zp, 0, z))
    - mu(z) = 5 log10(d_L(z)) + 25
  bao:
    - D_M(z) = Integral(c_light / H(zp), (zp, 0, z))
    - D_H(z) = c_light / H(z)
    - D_V(z) = (D_M(z)**2 * D_H(z))**(1/3)

rs_expression: >-
  r_s = Integral(
    c_light / sqrt(
      3 * (1 + 3 * Omega_b / (4 * Omega_gamma) / (1 + z))
    ) / (
      H0 * sqrt(
        Omega_m0 * (1 + z)**3
        + Omega_gamma * (1 + 0.2271 * Neff) * (1 + z)**4
        + (1 - Omega_m0 - Omega_gamma * (1 + 0.2271 * Neff))
          * (
            1 - exp(-((1 / (1 + z)) / a_T)**3)
          ) / (
            1 - exp(-(1 / a_T)**3)
          )
      )
    ), (z, z_rec, oo)
  )

skip_bao: false
valid_for_bao: true
valid_for_distance_metrics: true
valid_for_cmb: true

cmb:
  backend: camb
  param_map:
    H0: H0
    ombh2: Omega_b * (H0 / 100)**2
    omch2: (Omega_m0 - Omega_b) * (H0 / 100)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: Neff
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2000
    k_min: 0.0001
    k_max: 0.3
    k_sample_count: 18
    eta_sample_count: 192
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: '0.0'
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_c0: omch2 / (h * h)
      Omega_gamma0: Omega_gamma
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      Omega_r0: Omega_gamma0 + Omega_nu0
      Omega_de0: 1.0 - Omega_m0 - Omega_r0 - Omega_k0
      H: H0 * sqrt(Omega_m0 / (a ** 3) + Omega_r0 / (a ** 4) + Omega_de0 * (1 - exp(-((a
        / a_T) ** 3))) / (1 - exp(-((1 / a_T) ** 3))))
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    standard: false
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - cdm
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      cdm:
        sector: scalar
        background_reference: Omega_c0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_massive_l
        momentum_grid: massive_neutrino_default
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      scalar_reference_ells:
      - 2
      - 2000
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources: {}
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2000
      k_min: 0.0001
      k_max: 0.3
      k_sample_count: 18
      eta_sample_count: 192
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 80.0
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
      massive_neutrino_hierarchy_l_max: 5
      momentum_grids:
        massive_neutrino_default:
          count: 8
          q_min: 0.05
          q_max: 18.0
          mass_parameter: sum_mnu
    validity:
      regimes:
      - linear
      - native_scalar_hierarchy
      notes: Production spectra use the Copernican native hierarchy.
    backend_mapping:
      camb:
        native_solver_required: true
        implemented: true
    notes: Native declared scalar hierarchy for Temporal Opposition Geometry; the
      model background remains theory-specific.
notes: >-
  This model uses the TOG volume-activation law. The background temporal
  factor is A(a) = [1 - exp(-(a / a_T)**3)] /
  [1 - exp(-(1 / a_T)**3)]. The native CMB solver contract evaluates the derived
  w(a) table on a scale-factor grid and forwards it to native CMB solver through
  set_dark_energy_w_a using the declared native background and perturbation graph.
  representation for the declared w(a) table; it is not a Copernican
  theory class.

date: '2026-05-25'
