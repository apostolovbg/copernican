model_name: Temporal Opposing Relational Geometry
short_name: TORG
version: "1.0"
authors:
  - Iávor Moreno
valid_for_sne: true
valid_for_bao: true
valid_for_cmb: true
abstract: >-
  Temporal Opposing Relational Geometry is a cosmological theory in
  which the apparent dark sector is interpreted as a large-scale
  geometric response of spacetime rather than as hidden particle
  matter, vacuum energy, or an arbitrary cosmological constant. The
  theory keeps ordinary baryonic matter, radiation, neutrinos, and
  spacetime geometry as the physical inventory, and introduces a
  relational temporal response that makes baryonic matter gravitate
  with enhanced cosmological inertia on coherent large scales while
  remaining screened in local bound systems. At background level the
  response is encoded by the relational-inertia factor X_r(a). At
  perturbation level it is represented as baryon-locked relational
  inertia, enhanced gravitational source, and diluted photon drag,
  providing a declared route toward CMB structure without fundamental
  cold dark matter.
description: |-
  Temporal Opposing Relational Geometry

  TORG says that the large-scale behavior attributed to dark matter and
  dark energy is not caused by invisible substances. It is caused by a
  geometric response of spacetime to the relational opposition between
  expanding spatial volume and temporal actualization.

  The universe does not merely contain matter inside space and time.
  Matter, space, and time form a coupled relational system. When the
  spatial universe expands, the temporal side of the geometry does not
  passively ride along as a fourth coordinate. It contributes an
  opposing geometric response. That response changes the effective
  gravitational weight of baryonic matter at cosmological scale and
  changes the expansion history without introducing Lambda, particle
  cold dark matter, dark-energy fluids, scalar-field filler, hidden
  dust, or arbitrary constants whose only role is to close
  observational gaps.

  The central object of the theory is the relational temporal response,
  represented in background cosmology by the dimensionless factor X_r(a).

      X_r(a)

  This is not a dark-matter density. It is not a particle species. It is
  the amount by which baryonic matter sources large-scale geometry
  through relational inertia.

  At background level:

      rho_grav(a) = rho_b(a) [1 + X_r(a)]

  where rho_b is ordinary baryonic matter.

  That equation is the heart of TORG. It says that the universe contains
  baryons, but baryons do not gravitate cosmologically as isolated local
  masses. They gravitate through a relational geometry whose temporal
  opposition increases their effective large-scale inertia.

  Ontology

  TORG accepts as fundamental:

      g_{mu nu}

  the spacetime metric,

      T^{(b)}_{mu nu}

  ordinary baryonic matter,

      T^{(gamma)}_{mu nu}

  radiation,

      T^{(nu)}_{mu nu}

  neutrinos, when included as known standard radiation or massive
  species, and

      R_{mu nu}

  the relational-temporal geometric response.

  TORG rejects as fundamental:

      Lambda

  as a primitive cosmological constant,

      T^{(c)}_{mu nu}

  as particle cold dark matter, and

      T^{(de)}_{mu nu}

  as a dark-energy substance.

  The theory does not say that dark matter exists but is made of
  something else. It says the inferred dark component is a projection of
  baryonic matter through relational geometry.

  The theory does not say that dark energy exists but has another
  equation of state. It says late-time acceleration emerges from the
  changing temporal-opposition response of spacetime itself.

  Fundamental field-equation form

  The clean field-equation skeleton is:

      G_{mu nu}
      =
      8 pi G (
        T^{(b)}_{mu nu}
        + T^{(gamma)}_{mu nu}
        + T^{(nu)}_{mu nu}
      )
      + R_{mu nu}

  Here R_{mu nu} is not an extra matter tensor. It is a geometric
  response tensor. It belongs conceptually to the left-hand side, but
  writing it on the right-hand side makes comparison with observations
  easier.

  The stricter form is:

      G_{mu nu} - R_{mu nu}
      =
      8 pi G T^{(known)}_{mu nu}

  where:

      T^{(known)}_{mu nu}
      =
      T^{(b)}_{mu nu}
      + T^{(gamma)}_{mu nu}
      + T^{(nu)}_{mu nu}

  This is the preferred theoretical form, because it makes clear that
  TORG modifies geometry, not inventory.

  The conservation law is:

      nabla^mu [
        8 pi G T^{(known)}_{mu nu}
        + R_{mu nu}
      ] = 0

  Known matter can remain locally conserved:

      nabla^mu T^{(b)}_{mu nu} = 0

  in local systems, while the cosmological relational response obeys the
  global Bianchi constraint through R_{mu nu}.

  TORG does not violate conservation. It relocates the missing
  cosmological bookkeeping from invisible matter into the geometric
  response required by covariance.

  FLRW reduction

  In a homogeneous and isotropic universe, the relational response
  reduces to one effective background function:

      X_r(a)

  The effective Friedmann equation becomes:

      H^2(a)
      =
      (8 pi G / 3) [
        rho_r(a)
        + rho_b(a) [1 + X_r(a)]
        + rho_nu(a)
      ]
      - k c^2 / a^2

  For the spatially flat case:

      H^2(a)
      =
      (8 pi G / 3) [
        rho_r(a)
        + rho_b(a) [1 + X_r(a)]
        + rho_nu(a)
      ]

  This is the background replacement for the LambdaCDM expression:

      rho_b + rho_c + rho_Lambda

  TORG replaces that with:

      rho_b [1 + X_r(a)]

  No independent CDM density appears. No constant vacuum density appears.
  The apparent dark sector is compressed into one geometric response
  function tied to baryons.

  Relational pressure of the response

  Define the effective relational density:

      rho_R(a) = X_r(a) rho_b(a)

  Since baryons scale as:

      rho_b(a) = rho_{b0} a^{-3}

  the relational density is:

      rho_R(a) = X_r(a) rho_{b0} a^{-3}

  If the relational response is written as an effective conserved
  component for background comparison, its pressure is fixed by
  conservation:

      dot{rho}_R + 3 H (rho_R + p_R) = 0

  This gives:

      p_R(a)
      =
      - rho_b(a) / 3
        dX_r / d ln a

  The effective equation of state of the relational response is:

      w_R(a)
      =
      p_R / rho_R
      =
      - (1 / 3) d ln X_r / d ln a

  TORG does not insert a dark-energy equation of state. The pressure-like
  behavior follows from how relational inertia evolves. If X_r grows with
  cosmic expansion, the response naturally develops negative effective
  pressure.

  Late-time acceleration comes from:

      dX_r / d ln a > 0

  large enough to produce accelerated expansion.

  This is not Lambda. It is temporal opposition becoming cosmologically
  active as the universe grows.

  Temporal opposition

  The core physical principle is:

      spatial expansion <-> temporal opposition

  As spatial volume grows, the universe does not simply dilute into
  emptiness. The relation between spatial extension and temporal
  actualization changes. The larger the spatial separation structure
  becomes, the more the temporal side of the geometry contributes to
  global inertia.

  This is why TORG uses relational rather than local inertia.

  Local inertia is the resistance of a body to acceleration in a local
  frame.

  Relational inertia is the resistance of the cosmic matter-geometry
  system to changes in the global expansion and perturbation structure.

  TORG's claim is that cosmology has been interpreting relational inertia
  as missing matter.

  What X_r means

  X_r(a) is the relational inertia ratio.

  It measures how much additional large-scale gravitational source
  appears per unit baryonic matter due to temporal-oppositional geometry.

  If:

      X_r(a) = 0

  then baryons gravitate only as bare baryons.

  If:

      X_r(a) > 0

  then baryons gravitate cosmologically as:

      rho_b (1 + X_r)

  This does not mean every proton becomes heavier locally. It means the
  baryonic distribution sources cosmic geometry through a relational
  response.

  Therefore X_r is cosmological, coherent, relational, and
  scale-dependent in the full theory.

  At background level it depends on a. At perturbation level it can
  depend on a and k:

      X_r = X_r(a, k)

  At local bound-system scale, the effective response is screened:

      X_r(a, k_local) -> 0

  That is how TORG avoids breaking Solar-System physics.

  Local screening

  TORG must recover known local mechanics.

  The screening principle is:

      S(a, k, Phi_local) -> 0

  inside strongly bound, locally coherent systems, and:

      S(a, k, Phi_cosmic) -> 1

  on cosmological linear scales.

  The full relational response becomes:

      X_r(a, k, Phi)
      =
      X_{r,0}(a) S(a, k, Phi)

  For cosmological background:

      S = 1

  For local Newtonian systems:

      S = 0

  Thus local gravity is not enhanced by 1 + X_r. The enhancement appears
  only where matter participates in the coherent cosmological geometry.

  This is not a convenience patch. It is required by the ontology.
  Relational inertia is a property of the global matter-geometry
  relation, not a local particle mass.

  Newtonian recovery

  In the weak-field, low-velocity, local screened limit:

      g_{00} ~= - (1 + 2 Phi / c^2)

  and:

      S -> 0

  The field equation reduces to:

      nabla^2 Phi = 4 pi G rho_b

  So Newtonian mechanics is recovered.

  The nonrelativistic equation of motion remains:

      d^2 x / dt^2 = - nabla Phi

  This means laboratory dynamics, planetary motion, local binary
  dynamics, and ordinary baryonic gravity remain standard in the
  screened local limit.

  The cosmological Poisson equation is different:

      k^2 Phi
      =
      4 pi G a^2 rho_b [1 + X_r(a, k)] delta_b

  in the simplest scalar perturbation closure.

  That is the key distinction:

      local Poisson equation:
      nabla^2 Phi = 4 pi G rho_b

      cosmological Poisson equation:
      k^2 Phi =
      4 pi G a^2 rho_b (1 + X_r) delta_b

  Perturbation ontology

  TORG perturbations do not introduce a dark-matter density contrast.
  There is no fundamental particle-CDM perturbation delta_c. There is no
  independent CDM velocity divergence theta_c.

  Instead, the perturbation variables are:

      delta_b

  baryon density contrast,

      theta_b

  baryon velocity divergence,

      Phi, Psi

  metric potentials,

      delta_X_r

  relational response perturbation, and derived effective quantities.

  The declared scalar closure is baryon-locked relational inertia:

      delta_R = delta_b + delta_X_r / X_r

  The declared TORG closure sets the relational response perturbation
  to track baryonic perturbations at linear order by taking:

      delta_X_r = 0

  under the baryon-locked relation, giving:

      delta rho_R = X_r rho_b delta_b

  Then:

      delta rho_eff = rho_b (1 + X_r) delta_b

  This is the declared TORG perturbation ansatz.

  It says that the relational component has no independent particle
  perturbation. It is locked to baryonic structure because it is a
  geometric response to baryonic matter.

  Continuity equation

  The baryon density contrast obeys:

      delta_b'
      =
      - theta_b + 3 Phi'

  where prime denotes conformal-time derivative.

  This remains the standard baryonic continuity equation in conformal
  Newtonian gauge.

  The relational response does not get a separate continuity equation under
  this closure. Its perturbation is algebraically tied to the baryonic
  perturbation:

      delta rho_R = X_r rho_b delta_b

  A higher-order extension may make delta_X_r dynamic; this contract keeps
  it constrained.

  Euler equation and photon-drag dilution

  Before recombination, baryons are coupled to photons. In standard
  cosmology, this photon drag prevents baryons from behaving like
  collisionless matter.

  TORG cannot say baryons ignore photons. They do not.

  The TORG mechanism is different: baryons still couple
  electromagnetically to photons through ordinary electron density, but
  their cosmological inertial loading is enhanced by relational inertia.

  Thus the photon drag term is diluted by:

      1 / [1 + X_r(a, k)]

  The declared Euler equation is:

      theta_b'
      =
      - Hconf theta_b
      + k^2 Psi
      + R_gamma / (1 + X_r) (theta_gamma - theta_b)

  where R_gamma represents the usual photon-baryon coupling strength in
  the chosen convention.

  The declared CMB solver expresses this term through its declared optical-depth
  factor and baryon-photon inertia ratio. The physical rule is:

      photon drag acceleration proportional to 1 / (1 + X_r)

  This is the crucial CMB mechanism.

  LambdaCDM says that dark matter clusters because photons do not drag
  it. TORG says that baryons are still photon-coupled, but their
  cosmological relational inertia reduces the acceleration caused by
  photon drag.

  This lets baryonic structure behave more matter-like before
  recombination without inventing collisionless dark matter.

  Modified Poisson source

  The scalar gravitational source becomes:

      delta rho_grav
      =
      rho_b (1 + X_r) delta_b
      + delta rho_gamma
      + delta rho_nu

  The Poisson equation becomes:

      k^2 Phi
      =
      4 pi G a^2 [
        rho_b (1 + X_r) delta_b
        + rho_gamma delta_gamma
        + rho_nu delta_nu
      ]

  No rho_c delta_c term appears.

  The role played by CDM in LambdaCDM is replaced by:

      rho_b X_r delta_b

  But this is not CDM. It has baryon-locked perturbations and modified
  photon-drag behavior.

  Slip and anisotropic stress

  Under the declared closure, TORG introduces no new anisotropic stress:

      sigma_R = 0

  Then the metric slip remains controlled by standard radiation and
  neutrino anisotropic stress:

      Phi - Psi = standard radiation/neutrino contribution

  This minimal declared closure avoids inventing unnecessary tensor structure.

  If data demand a geometric slip term, it must be derived from
  R_{mu nu}, not inserted as a phenomenological patch.

  Declared perturbation contract

  The TORG declared perturbation contract contains these declarations:

      variables:
        delta_b, theta_b, delta_gamma, theta_gamma, Phi, Psi

      derived relational variables:
        delta rho_R = X_r rho_b delta_b
        delta rho_eff = rho_b (1 + X_r) delta_b
        theta_R = theta_b
        sigma_R = 0

      equations:
        delta_b' = - theta_b + 3 Phi'

        theta_b'
        =
        - Hconf theta_b
        + k^2 Psi
        + R_gamma / (1 + X_r) (theta_gamma - theta_b)

        k^2 Phi
        =
        4 pi G a^2 [
          rho_b (1 + X_r) delta_b
          + rho_gamma delta_gamma
          + rho_nu delta_nu
        ]

      closures:
        theta_R - theta_b = 0
        sigma_R = 0
        delta_X_r = 0

      sources:
        S_Poisson = rho_b (1 + X_r) delta_b

      validity:
        linear scalar perturbations
        cosmological scales
        screened local systems excluded
        first-order relational closure

  This is the declared CMB story.

  Sound horizon

  The sound horizon must be handled carefully.

  Photon opacity depends on ordinary electrons and therefore on ordinary
  baryon density. So the opacity side remains tied to:

      rho_b

  But acoustic inertia in the declared perturbation picture is influenced
  by:

      1 + X_r

  That means TORG's exact CMB theory has two distinct baryonic roles:

      microphysical photon coupling: rho_b
      cosmological inertial loading: rho_b (1 + X_r)

  This is not a contradiction. It is the theory's defining distinction.

  The declared TORG perturbation solver must separate electron opacity from
  relational inertial mass.

  Field equation for relational response

  The response tensor R_{mu nu} must reduce to X_r rho_b in FLRW.

  A suitable skeleton is:

      R_{mu nu}
      =
      8 pi G X_{mu nu}
      [g_{alpha beta}, u^alpha, rho_b, Theta, tau]

  where u^mu is the cosmological matter frame,

      Theta = nabla_mu u^mu

  is the expansion scalar, and tau is the temporal actualization
  parameter.

  In FLRW:

      X_{00} = rho_b X_r(a)

      X_{ij} = p_R(a) g_{ij}

  with:

      p_R
      =
      - rho_b / 3 dX_r / d ln a

  This guarantees the background equations match the relational-inertia
  formulation.

  The next derivation step is to write an action whose variation produces
  this response tensor. The current field-equation skeleton is valid as
  an effective covariant theory. The action is the deeper completion.

  Action principle candidate

  The action should have the form:

      S
      =
      int d^4x sqrt(-g) [
        R / (16 pi G)
        + L_b
        + L_gamma
        + L_nu
        + L_rel
      ]

  The relational term is not a free dark field. It must depend on
  baryonic matter and expansion geometry:

      L_rel = F(rho_b, Theta, nabla_mu u^mu, tau)

  The simplest effective choice is a coupling:

      L_rel = - rho_b X(Theta, tau)

  In FLRW:

      X(Theta, tau) -> X_r(a)

  The crucial theoretical constraint is:

      L_rel -> 0

  in the local screened limit.

  So the action must contain a coherence/screening factor:

      L_rel = - rho_b X_r(a) S(a, k, Phi)

  In real-space covariant form, S must be expressed through local
  curvature, expansion, and binding structure rather than Fourier k. The
  Fourier version is the cosmological perturbation representation.

  Quantum and decoherence bridge

  TORG naturally suggests a bridge to quantum measurement.

  The future is not yet actualized geometry. It is structured
  possibility.

  The present is the boundary at which possibility becomes actual
  geometry.

  The past is not a still-existing block of equal ontological status. It
  is a decohered record encoded in present correlations.

  Temporal opposition means the universe consumes possibility into
  actualized spacetime. We experience this as the flow of time.

  In this view:

      future -> present actualization -> past record

  The past does not keep existing as a live physical domain. It persists
  as record, correlation, memory, radiation, gravitational structure, and
  causal trace.

  This aligns with the TORG cosmological picture because the temporal
  side of geometry is active. Time is not only a coordinate labeling
  events. It is the process by which relational structure becomes
  definite.

  This is not yet the quantum theory of TORG. It is the correct
  philosophical and mathematical direction:

      decoherence = local actualization of relational geometry

  The bridge to quantum gravity should be built by treating actualization
  as the temporal boundary condition on relational geometry.

  Predictions

  TORG makes clear predictions distinct from LambdaCDM.

  First, the inferred matter density from background cosmology should not
  match the baryon density, but the excess should track a baryonic
  relational function:

      Omega_grav(a) = Omega_b [1 + X_r(a)]

  Second, the CMB should be explainable without independent CDM
  perturbations, through baryon-locked relational inertia and photon-drag
  dilution.

  Third, local systems should not show the full cosmological enhancement
  because X_r is screened in bound systems.

  Fourth, datasets with different SNe calibration conventions should
  shift apparent tension when intercept handling is wrong.

  Fifth, growth data should prefer a relation between baryonic
  distribution and inferred missing gravitational source, not a fully
  independent collisionless component.

  Sixth, the theory should produce scale-dependent deviations from
  LambdaCDM in structure growth where screening transitions from local to
  cosmological coherence.

  What must be proven next

  The full theory has a coherent structure, but several pieces still
  need derivation.

  The action must be written.

  The variation must produce R_{mu nu}.

  The FLRW reduction must exactly recover the current TORG background
  equations.

  The Newtonian limit must explicitly show S -> 0.

  The perturbation equations must be implemented declaredly in Copernican.

  The CMB solver must distinguish photon opacity from relational inertia.

  The theory must be tested on JLA2014, Pantheon+SH0ES, Union3, BAO, CMB,
  and growth.

  Compact statement

  TORG is a covariant cosmological theory in which ordinary matter,
  radiation, and spacetime geometry are coupled through a
  temporal-opposition response. This response makes baryonic matter
  gravitate with enhanced relational inertia at cosmological scale, while
  remaining screened in local bound systems. The apparent dark sector is
  therefore not a hidden inventory of particles and vacuum energy, but
  the large-scale geometric effect of time opposing spatial expansion. At
  background level this is encoded by X_r(a); at perturbation level it
  appears as baryon-locked relational inertia, enhanced gravitational
  source, and diluted photon drag. The theory recovers Newtonian gravity
  locally through screening and aims to recover CMB structure without
  independent cold dark matter.
notes: |-
  This model file is the formal TORG model carrier.

  The prose description intentionally carries the complete theory text.
  It is not merely metadata. It is intended to preserve the ontology,
  physical interpretation, field-equation skeleton, perturbation ansatz,
  Newtonian recovery logic, CMB mechanism, and future derivation path in
  the model file itself.

  The background expressions below provide the executable Copernican
  representation of TORG's homogeneous expansion sector.

  The CMB perturbation block declares the perturbation mathematics
  directly. Copernican compiles those equations into its generic
  declarative perturbation executor, which does not supply undeclared
  perturbations.

parameters:
  - name: Hubble constant
    python_var: H0
    latex_name: H_0
    unit: km s^-1 Mpc^-1
    bounds: [50.0, 90.0]
    initial: 70.0
    definition: Present-day Hubble expansion rate.
    prior:
      type: uniform
      lower: 50.0
      upper: 90.0

  - name: Baryon density
    python_var: Ob0
    latex_name: \Omega_{b0}
    unit: ""
    bounds: [0.01, 0.12]
    initial: 0.049
    definition: Present-day baryonic matter density fraction.
    prior:
      type: uniform
      lower: 0.01
      upper: 0.12

  - name: Radiation density
    python_var: Or0
    latex_name: \Omega_{r0}
    unit: ""
    bounds: [0.00001, 0.0002]
    initial: 0.00009
    definition: Present-day radiation density fraction.
    prior:
      type: uniform
      lower: 0.00001
      upper: 0.0002

  - name: Relational inertia amplitude
    python_var: Xr0
    latex_name: X_{r0}
    unit: ""
    bounds: [0.0, 7.0]
    initial: 5.0
    definition: Present-day amplitude of cosmological relational inertia.
    prior:
      type: uniform
      lower: 0.0
      upper: 7.0

  - name: Relational activation redshift
    python_var: zt
    latex_name: z_t
    unit: ""
    bounds: [0.01, 10.0]
    initial: 1.0
    definition: Redshift scale at which temporal opposition activates.
    prior:
      type: uniform
      lower: 0.01
      upper: 10.0

  - name: Relational activation sharpness
    python_var: beta
    latex_name: \beta
    unit: ""
    bounds: [0.1, 10.0]
    initial: 2.0
    definition: Sharpness of the relational-inertia activation transition.
    prior:
      type: uniform
      lower: 0.1
      upper: 10.0

  - name: Relational growth index
    python_var: gamma_r
    latex_name: \gamma_r
    unit: ""
    bounds: [0.0, 6.0]
    initial: 1.0
    definition: Growth index controlling late-time relational response.
    prior:
      type: uniform
      lower: 0.0
      upper: 6.0

  - name: Absolute magnitude nuisance
    python_var: M_abs
    latex_name: M
    unit: mag
    bounds: [-21.0, -17.0]
    initial: -19.3
    definition: Supernova absolute-magnitude nuisance intercept.
    prior:
      type: uniform
      lower: -21.0
      upper: -17.0

  - name: Recombination redshift
    python_var: z_rec
    latex_name: z_{\rm rec}
    unit: ""
    bounds: [1089.92, 1089.92]
    initial: 1089.92
    definition: Fixed photon-decoupling redshift for sound-horizon integrals.
    prior:
      type: fixed
      value: 1089.92

Hz_expression: >-
  H(z) = H0 * sqrt(
    Or0 * (1 + z)**4
    + Ob0 * (1 + z)**3 * (
      1 + Xr0
        * (
          1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)
        )
        * (1.0 / (1.0 + z))**gamma_r
        / (
          1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)
        )
    )
    + (1.0 - Or0 - Ob0 * (1.0 + Xr0))
      * (
        1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)
      )
      * (1.0 / (1.0 + z))**gamma_r
      / (
        1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)
      )
  )

equations: {}

rs_expression: >-
  r_s = Integral(
    299792.458 / sqrt(
      3 * (1 + 3 * Ob0 / (4 * Or0 * (1 + z)))
    ) / (
      H0 * sqrt(
        Or0 * (1 + z)**4
        + Ob0 * (1 + z)**3 * (
          1 + Xr0
            * (
              1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)
            )
            * (1.0 / (1.0 + z))**gamma_r
            / (
              1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)
            )
        )
        + (1.0 - Or0 - Ob0 * (1.0 + Xr0))
          * (
            1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)
          )
          * (1.0 / (1.0 + z))**gamma_r
          / (
            1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)
          )
      )
    ),
    (z, z_rec, oo)
  )

constants:
  c_km_s: 299792.458
  T_cmb_K: 2.7255
  Neff: 3.046

expressions:
  a_z: "1.0 / (1.0 + z)"
  activation_0: "1.0 / (1.0 + (1.0 / (1.0 + zt))**beta)"
  activation_z: "1.0 / (1.0 + ((1.0 + z) / (1.0 + zt))**beta)"
  temporal_growth_z: "(1.0 / (1.0 + z))**gamma_r"
  Tau_z: "activation_z * temporal_growth_z / activation_0"
  Xr_z: "Xr0 * Tau_z"
  Ob_eff_z: "Ob0 * (1.0 + Xr_z)"
  matter_rel_z: "Or0*(1.0 + z)**4 + Ob0*(1.0 + z)**3*(1.0 + Xr_z)"
  Omega_tau0: "1.0 - Or0 - Ob0*(1.0 + Xr0)"
  temporal_closure_z: "Omega_tau0 * Tau_z"
  E2_z: "matter_rel_z + temporal_closure_z"
  E_z: "sqrt(E2_z)"
  H_z: "H0 * E_z"
  inv_E_z: "1.0 / E_z"
  dH_Mpc_z: "c_km_s / H_z"

observables:
  luminosity_distance_Mpc:
    expression: "(1.0 + z) * c_km_s / H0 * integral(inv_E_z, z, 0.0, z)"
    unit: Mpc
    description: Luminosity distance for SNe likelihood evaluation.

  distance_modulus:
    expression: "5.0 * log10(luminosity_distance_Mpc) + 25.0"
    unit: mag
    description: Theoretical distance modulus.

  angular_diameter_distance_Mpc:
    expression: "luminosity_distance_Mpc / (1.0 + z)**2"
    unit: Mpc
    description: Angular-diameter distance.

  comoving_distance_Mpc:
    expression: "luminosity_distance_Mpc / (1.0 + z)"
    unit: Mpc
    description: Line-of-sight comoving distance.

  Hubble_rate:
    expression: "H_z"
    unit: km s^-1 Mpc^-1
    description: Hubble expansion rate.

  sound_horizon_Mpc:
    expression: >-
      c_km_s / sqrt(3.0) / H0
      * integral(
          1.0 / (
            E_z * sqrt(
              1.0
              + 3.0 * Ob0 / (4.0 * Or0 * (1.0 + z))
            )
          ),
          z,
          z_rec,
          1.0e7
        )
    unit: Mpc
    description: >-
      Background sound-horizon representation. Photon opacity is tied to
      bare baryons; declared perturbations separately declare relational
      inertial loading.

derived:
  relational_density_factor:
    expression: "Xr_z"
    description: Relational inertia ratio.

  effective_gravitating_baryon_density:
    expression: "Ob0 * (1.0 + Xr_z)"
    description: Effective baryonic gravitational source fraction.

  relational_density:
    expression: "Ob0 * Xr_z"
    description: Effective relational response density fraction.

  flatness_residual:
    expression: "1.0 - Or0 - Ob0 * (1.0 + Xr0)"
    description: Present-day closure amplitude used by E2_z.

likelihood:
  sne:
    observable: distance_modulus
    nuisance:
      absolute_magnitude: M_abs
  bao:
    H_z: Hubble_rate
    D_M: comoving_distance_Mpc
    D_A: angular_diameter_distance_Mpc
    D_V: "((c_km_s * z * comoving_distance_Mpc**2 / H_z))**(1.0 / 3.0)"
    r_s: sound_horizon_Mpc
cmb:
  param_map:
    H0: H0
    ombh2: Ob0 * (H0 / 100.0)**2
    tau: 0.054
    As: 2.1e-09
    ns: 0.965
    Neff: 3.046
    num_massive_neutrinos: 3
    sum_mnu: 0.06
    YHe: 0.245
  model_parameters: {}
  grids: {}
  values: {}
  calls: []
  numerical:
    ell_min: 2
    ell_max: 2500
    k_min: 0.0001
    k_max: 1.0
    k_sample_count: 64
    eta_sample_count: 192
    evolution_eta_sample_count: 192
    evolution_phase_step: 2.0
    ode_rtol: 1.0e-05
    ode_atol: 1.0e-08
    tight_coupling_ratio: 80.0
    a_min: 1.0e-06
    source_grid_multiplier: 2
    initial_redshift: 2.0e4
  background:
    derived:
      h: H0 / 100.0
      H0_over_c_Mpc_inv: H0 / 299792.458
      Omega_k0: '0.0'
      Tcmb_K: 2.7255
      Tcmb: Tcmb_K
      YHe: 0.245
      Omega_b0: ombh2 / (h * h)
      Omega_gamma0: 2.469e-5 * ((Tcmb_K / 2.7255) ** 4) / (h * h)
      Omega_nu0: 0.22710731766 * Neff * Omega_gamma0
      effective_massive_neutrino_species: 0.5 * (Neff
        + num_massive_neutrinos - abs(Neff - num_massive_neutrinos))
      Omega_nu_massless0: Omega_nu0 * (Neff
        - effective_massive_neutrino_species) / Neff
      massive_neutrino_mass_eV: sum_mnu / (num_massive_neutrinos + 1.0e-30)
      massive_neutrino_transition_a: (3.151 * ((4.0 / 11.0) ** (1.0 / 3.0))
        * 8.617333262145e-5 * Tcmb_K) / (massive_neutrino_mass_eV + 1.0e-30)
      Omega_nu_massive_rel0: Omega_nu0 * effective_massive_neutrino_species
        / Neff
      Omega_nu_massive_nr0: sum_mnu / (93.14 * h * h)
        * effective_massive_neutrino_species
        / (num_massive_neutrinos + 1.0e-30)
      Omega_nu_massive0: Omega_nu_massive_nr0
        + (Omega_nu_massive_rel0 - Omega_nu_massive_nr0)
        * exp(-massive_neutrino_mass_eV / 1.0e-4)
      Omega_rel0: 0.5 * (Or0 - Omega_gamma0 - Omega_nu0
        + abs(Or0 - Omega_gamma0 - Omega_nu0))
      Omega_r0: Omega_gamma0 + Omega_rel0 + Omega_nu_massless0
        + Omega_nu_massive_rel0
      Omega_m0: Omega_b0 * torg_matter_factor_today + Omega_nu_massive0
      torg_z_a: 1.0 / a
      torg_transition: 1.0 / (1.0 + (torg_z_a / (1.0 + zt)) ** beta)
      torg_transition_today: 1.0 / (1.0 + (1.0 / (1.0 + zt)) ** beta)
      torg_matter_factor: 1.0 + Xr0 * torg_transition * a ** gamma_r / torg_transition_today
      torg_dark_factor: torg_transition * a ** gamma_r / torg_transition_today
      torg_matter_factor_today: 1.0 + Xr0
      torg_radiation_factor: Omega_gamma0 + Omega_rel0 + Omega_nu_massless0
      torg_massive_neutrino_ratio: sqrt(a * a
        + massive_neutrino_transition_a * massive_neutrino_transition_a)
        / (sqrt(1.0 + massive_neutrino_transition_a
        * massive_neutrino_transition_a) * (a ** 4))
      torg_baryon_density: Omega_b0 * torg_matter_factor
      Omega_de0: 1.0 - Omega_gamma0 - Omega_rel0 - Omega_nu_massless0
        - Omega_nu_massive0 - Omega_b0 * torg_matter_factor_today
        - Omega_k0
      H: H0 * sqrt(torg_radiation_factor / (a ** 4)
        + Omega_nu_massive0 * torg_massive_neutrino_ratio
        + torg_baryon_density / (a ** 3)
        + Omega_k0 / (a ** 2) + Omega_de0 * torg_dark_factor)
    reionization:
      calibration:
        symbol: reionization_log10_amplitude
        target_optical_depth: tau
        lower: -24.0
        upper: 32.0
      quantities:
        stellar_temperature_K: 5.0e4
        quasar_temperature_K: 1.5e5
        hydrogen_temperature_K: 1.0e4
        helium_temperature_K: 1.0e4
        helium_double_temperature_K: 2.0e4
        collapse_threshold: 1.686
        collapse_source: exp(-collapse_threshold / (a + 1.0e-6))
        hard_source: collapse_source * collapse_source
        stellar_helium_hardness: exp(-((24.587387 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * stellar_temperature_K))
        quasar_helium_hardness: exp(-((54.417763 - 13.605693122994) * 1.602176634e-19)
          / (1.380649e-23 * quasar_temperature_K))
        hydrogen_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI * collapse_source
        helium_ionization_rate: hydrogen_ionization_rate * stellar_helium_hardness
        helium_double_ionization_rate: (10 ** reionization_log10_amplitude) * H_SI
          * hard_source * quasar_helium_hardness
  perturbations:
    contract_version: 2
    gauge: conformal_newtonian
    sectors:
      scalar:
        description: >-
          Scalar Einstein-Boltzmann hierarchy for the declared model
          background.
        species:
        - photon
        - baryon
        - massless_neutrino
        - massive_neutrino
        hierarchy_families:
        - photon_temperature
        - photon_polarization_e
        - massless_neutrino
        - massive_neutrino
        supported_gauges:
        - conformal_newtonian
        - synchronous
        tensor_character: scalar_like
    species:
      photon:
        sector: scalar
        hierarchy_family: photon_temperature
        collision_operators:
        - thomson_drag
        background_reference: Omega_gamma0
      baryon:
        sector: scalar
        collision_operators:
        - thomson_drag
        background_reference: Omega_b0
      massless_neutrino:
        sector: scalar
        hierarchy_family: massless_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
      massive_neutrino:
        sector: scalar
        hierarchy_family: massive_neutrino
        background_reference: Omega_nu0
        anisotropic_stress: supported
    hierarchy_families:
      photon_temperature:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: theta_gamma_l
      photon_polarization_e:
        sector: scalar
        species:
        - photon
        closure: free_streaming_scalar
        default_l_max: 8
        multipole_symbol: e_gamma_l
      massless_neutrino:
        sector: scalar
        species:
        - massless_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_l
      massive_neutrino:
        sector: scalar
        species:
        - massive_neutrino
        closure: free_streaming_scalar
        default_l_max: 5
        multipole_symbol: nu_massive_l
        momentum_grid: massive_neutrino_default
    collision_operators:
      thomson_drag:
        sector: scalar
        species:
        - photon
        - baryon
        expression: collision_rate * ((theta_b / acoustic_k) / 3.0 - theta_gamma1)
        counterpart: baryon_thomson_drag
    conservation_rules:
      thomson_drag_balance:
        kind: absolute_max
        expression: 3.0 * acoustic_k * photon_baryon_momentum_ratio * thomson_drag
          + baryon_thomson_drag
        tolerance: 1.0e-12
        domain: scalar
    initial_condition_families:
      adiabatic_scalar:
        sector: scalar
        description: Regular adiabatic growing scalar mode.
        members: []
    projection_typing:
      temperature_line_of_sight:
        sector: scalar
        kernel: temperature_mixed_window
        source_roles:
        - monopole
        - doppler
        - isw
        observable_kinds:
        - transfer_component
        parity: even
        spin: 0.0
    accuracy_controls:
      minimum_k_sample_count: 64
      scalar_reference_ells:
      - 2
      - 2000
      scalar_constraint_anchors:
        early: 0.05
        recombination: 0.50
        late: 0.95
      scalar_constraint_normalization: sum_abs_declared_einstein_terms
      scalar_constraint_reference_eta_samples: 192
      scalar_constraint_tolerances:
        einstein_energy_residual: 3.0e-3
        einstein_momentum_residual: 1.0e-6
        einstein_shear_residual: 1.0e-6
      runtime_envelope: bounded
    variables: {}
    derived: {}
    equations: {}
    constraints: {}
    closures: {}
    sources:
      torg_matter_density:
        expression: >-
          Omega_b0 * torg_matter_factor * observable_delta_b
        role: matter_density
        description: TORG baryon-locked relational density source.
      torg_matter_momentum:
        expression: >-
          Omega_b0 * torg_matter_factor * observable_theta_b
        role: matter_momentum
        description: TORG baryon-locked relational momentum source.
      torg_baryon_euler:
        expression: >-
          -Hconf * theta_b + acoustic_k_sq * baryon_sound_speed_sq * delta_b
          + baryon_thomson_drag / torg_matter_factor + acoustic_k_sq * Psi
        role: baryon_euler
        description: TORG diluted-photon-drag baryon Euler closure.
    observables: {}
    initial_conditions: {}
    boundary_conditions: {}
    numerics:
      ell_min: 2
      ell_max: 2500
      k_min: 0.0001
      k_max: 1.0
      k_sample_count: 64
      eta_sample_count: 192
      evolution_eta_sample_count: 192
      evolution_phase_step: 2.0
      ode_rtol: 1.0e-05
      ode_atol: 1.0e-08
      tight_coupling_ratio: 80.0
      a_min: 1.0e-06
      source_grid_multiplier: 2
      initial_redshift: 2.0e4
      massive_neutrino_hierarchy_l_max: 5
      momentum_grids:
        massive_neutrino_default:
          count: 8
          q_min: 0.05
          q_max: 18.0
          mass_parameter: sum_mnu
    validity:
      regimes:
      - linear
      - declared_scalar_hierarchy
      notes: TORG spectra use baryon-locked relational inertia sources.
    notes: The scalar graph contains photons, baryons, and neutrinos; the
      torg_matter_factor source closures replace an independent CDM species.
validation:
  expected_limits:
    local_newtonian:
      condition: "screening -> 0"
      poisson: "nabla2_Phi = 4*pi*G*rho_b"
    cosmological_linear:
      condition: "screening -> 1"
      poisson: "k**2*Phi = 4*pi*G*a**2*rho_b*(1+Xr)*delta_b"
  falsifiability:
    - >-
      If no fitted X_r(a) can simultaneously support SNe, BAO, and CMB
      observables without an independent dark sector, the background theory
      fails.
    - >-
      If a declared perturbation solver cannot reproduce CMB structure without
      independent CDM perturbations, the first-order perturbation ansatz fails.
    - >-
      If local screened systems require the unscreened cosmological X_r
      enhancement, the recovery limit fails.
