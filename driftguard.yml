# Last Updated: 2025-11-25
# DriftGuard policy spec derived from PLAN.json driftguard_yaml_spec.
# Comments map historical AGENTS rules to the new rule surfaces for clarity.
version: 1
project: Copernican Suite
rulesets:
  core-metadata: hard # Mirrors AGENTS rules on metadata and date hygiene.
  docs-drift: warn # Tracks doc freshness per AGENTS guidance on currency.
  python-quality: hard # Replaces AGENTS safeguards on print usage and tests.
  bugfix-coverage: warn # Soft reminder aligned with AGENTS testing emphasis.
surfaces:
  docs:
    description: >-
      Documentation and license files that require Last Updated headers and
      strict date validation.
    include:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - docs/**/*.md
      - CITATION.cff
      - LICENSE.md
      - THIRD_PARTY_LICENSES.md
    exclude: []
    rules:
      - last-updated-header
      - no-future-dates
  interfaces:
    description: >-
      User-facing entrypoints and configuration files that must remain aligned
      with recorded versions and dates.
    include:
      - copernican.py
      - start.sh
      - start.command
      - start.bat
      - copernican_lib/config_schemas/**/*.yml
      - models/**/*.yml
    exclude: []
    rules:
      - last-updated-header
      - no-future-dates
  metadata:
    description: >-
      Release metadata files that must remain synchronised across the suite.
    include:
      - README.md
      - CITATION.cff
      - copernican_lib/VERSION
      - pyproject.toml
    exclude: []
    rules:
      - version-sync
      - citation-yaml
      - no-future-dates
      - changelog-entry
  python-lib:
    description: >-
      Core Python library code that should avoid prints and pair new modules
      with tests, matching prior AGENTS quality guards.
    include:
      - copernican_lib/**/*.py
      - engines/**/*.py
    exclude:
      - tests/**/*.py
      - tools/**/*.py
      - driftguard/**/*.py
    rules:
      - no-print
      - new-modules-need-tests
  python-tests:
    description: >-
      Test suite surface kept for future rules; currently inherits no
      additional checks beyond baseline linters.
    include:
      - tests/**/*.py
    exclude: []
    rules: []
  tools:
    description: >-
      Helper scripts reserved for bespoke tooling rules; tracked here to keep
      parity with legacy AGENTS coverage.
    include:
      - tools/**/*.py
    exclude: []
    rules: []
drift:
  metrics:
    - name: todo-count
      description: >-
        Total count of TODO/FIXME/XXX markers found in core library and engine
        code.
      max_warning: 50
    - name: test-coupling-ratio
      description: >-
        Approximate fraction of core modules that appear to have corresponding
        tests. Below this threshold emits a warning.
      min_warning: 0.8
    - name: doc-age-days
      description: >-
        Maximum age in days of key docs (README, AGENTS, CONTRIBUTING,
        docs/*). If any exceeds this, emit a drift warning.
      max_warning: 365
