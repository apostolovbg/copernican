<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copernican Suite 1.12.7</title>
    <link rel="stylesheet" href="web/style.css">
</head>
<body>
    <header>
        <h1>Copernican Suite 1.12.7</h1>
    </header>
    <main>
        <section id="config">
            <h2>Configuration</h2>
            <div class="field">
                <p>Select alternative cosmological theory definition file:</p>
                <label><input type="radio" id="uploadRadio" name="modelSource" value="upload" checked> Upload Model JSON:</label>
                <input type="file" id="modelFile" accept="application/json">
            </div>
            <div class="field">
                <label><input type="radio" id="serverRadio" name="modelSource" value="server"> Select JSON from models/ folder:</label>
                <select id="modelSelect"></select>
                <button id="confirmModelBtn">Confirm Model</button>
            </div>
            <div class="field">
                <label for="sneSelect">Select SNe Ia Dataset:</label>
                <select id="sneSelect"></select>
                <button id="confirmSneBtn">Confirm SNe</button>
            </div>
            <div class="field">
                <label for="baoSelect">Select BAO Dataset:</label>
                <select id="baoSelect"></select>
                <button id="confirmBaoBtn">Confirm BAO</button>
            </div>
            <div class="field">
                <label for="cmbSelect">Select CMB Dataset:</label>
                <select id="cmbSelect"></select>
                <button id="confirmCmbBtn">Confirm CMB</button>
            </div>
            <button id="runBtn">Run Evaluation</button>
        </section>
        <section id="results" class="hidden">
            <div class="tabs">
                <button class="tab active" data-tab="console">Console</button>
                <button class="tab" data-tab="plots">Plots</button>
                <button class="tab" data-tab="tables">Tables</button>
                <button class="tab" data-tab="logFile">Log File</button>
            </div>
            <div id="console" class="tabContent"></div>
            <div id="plots" class="tabContent hidden">
                <div class="viewer">
                    <button id="prevPlot">Previous</button>
                    <span id="plotName"></span>
                    <button id="nextPlot">Next</button>
                    <div><img id="plotImg" src="" alt="plot" /></div>
                    <a id="downloadPlot" href="#" download>Download</a>
                </div>
            </div>
            <div id="tables" class="tabContent hidden">
                <div class="viewer">
                    <button id="prevTable">Previous</button>
                    <span id="tableName"></span>
                    <button id="nextTable">Next</button>
                    <pre id="tableText"></pre>
                    <a id="downloadTable" href="#" download>Download</a>
                </div>
            </div>
            <div id="logFile" class="tabContent hidden">
                <pre id="logText"></pre>
                <a id="downloadLog" href="#" download>Download Log</a>
            </div>
            <a id="downloadZip" href="#" download>Download All Results</a>
        </section>
    </main>
    <script src="web/app.js"></script>
</body>
</html>
