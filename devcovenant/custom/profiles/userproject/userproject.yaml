version: 1
profile: userproject
category: application
suffixes: []
ignore_dirs:
  - models/cache
  - cache
  - .matplotlib-cache
  - vendor
  - third_party
  - node_modules
assets: []
pre_commit:
  exclude: >-
    (?x)^data/(?!.*(?:cosmo_parser_|metadata_)).*
doc_assets:
  user:
    - devcovenant/README.md
project-governance:
  project_name: Copernican Suite
  project_description: A Python toolkit for evaluating cosmological models
    against SNe Ia, BAO, and CMB observations.
  copyright_notice: 2025 Apostol Apostolov and Black Epsilon Ltd.,
    Republic of Bulgaria
  stage: stable
  maintenance_stance: active
  compatibility_policy: forward-only
  versioning_mode: versioned
  changelog_file: CHANGELOG.md
policy_overlays:
  documentation-growth-tracking:
    user_facing_exclude_globs:
      - models/**
  read-only-directories:
    include_prefixes:
      - data
    exclude_globs:
      - data/**/cosmo_parser_*.py
      - data/**/metadata_*.yml
      - data/**/metadata_*.yaml
  dependency-management:
    surfaces:
      - id: root_workspace
        lock_file: requirements.lock
        direct_dependency_files:
          - requirements.in
          - copernican_lib/runtime-requirements.lock
        dependency_files:
          - requirements.in
          - devcovenant/runtime-requirements.lock
          - copernican_lib/runtime-requirements.lock
        third_party_file: licenses/THIRD_PARTY_LICENSES.md
        licenses_dir: licenses
        required_paths:
          - requirements.in
          - devcovenant/runtime-requirements.lock
          - copernican_lib/runtime-requirements.lock
      - id: package_runtime
        lock_file: copernican_lib/runtime-requirements.lock
        third_party_file: copernican_lib/licenses/THIRD_PARTY_LICENSES.md
        licenses_dir: copernican_lib/licenses
        required_paths:
          - pyproject.toml
          - copernican_lib
  version-governance:
    scheme: semver
    version_file: copernican_lib/VERSION
    changelog_file: CHANGELOG.md
    changelog_header_prefix: '## Version'
    canonical_versions_required: true
    enforce_bumping: true
    semver_scope_tags_required: true
    ignored_prefixes:
      - devcovenant
      - models
  version-sync:
    version_file: copernican_lib/VERSION
    changelog_file: CHANGELOG.md
    changelog_header_prefix: '## Version'
    target_roles:
      - docs
      - changelog
      - package_manifest
    role_extractors:
      - docs=>project_version_line
      - changelog=>changelog_header_version
      - package_manifest=>manifest_project_version
    role_legality_schemes:
      - package_manifest=>pep440
    target_role_files:
      - docs=>README.md
      - docs=>AGENTS.md
      - docs=>CONTRIBUTING.md
      - changelog=>CHANGELOG.md
      - package_manifest=>pyproject.toml
  line-length-limit:
    exclude_globs:
      - .matplotlib-cache/**
      - rng_minigames/registry.json
      - validation/manifests/**
      - licenses/THIRD_PARTY_LICENSES.md
      - copernican_lib/licenses/*.txt
    force_include_globs:
      - devcovenant/custom/**
      - tests/**/*.py
      - tests/**/*.md
  pre_commit:
    overlays:
      exclude: >-
        (?x)^data/(?!.*(?:cosmo_parser_|metadata_)).*
  changelog-coverage:
    skipped_globs:
      - .matplotlib-cache/**
  name-clarity:
    force_include_globs:
      - devcovenant/custom/**/*.py
      - tests/**/*.py
  docstring-and-comment-coverage:
    exclude_prefixes:
      - tests
    force_include_globs:
      - devcovenant/custom/**/*.py
  security-scanner:
    force_include_globs:
      - devcovenant/custom/**/*.py
      - tests/**/*.py
  no-raw-errors:
    exclude_prefixes:
      - tests
    force_include_globs:
      - devcovenant/custom/**/*.py
  modules-need-tests:
    exclude_prefixes:
      - build
      - dist
      - node_modules
      - tests
      - devcovenant
    force_include_globs:
      - devcovenant/custom/**/*.py
    watch_dirs:
      - tests
    tests_watch_dirs:
      - tests
    mirror_roots:
      - data/bao=>tests/data/bao
      - data/cmb=>tests/data/cmb
      - data/gw=>tests/data/gw
      - data/sne=>tests/data/sne
      - devcovenant/custom=>tests/devcovenant/custom
