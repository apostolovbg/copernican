version: 1
profile: userproject
category: application
suffixes: []
ignore_dirs:
  - copernican/models/cache
  - cache
  - .matplotlib-cache
  - vendor
  - third_party
  - node_modules
gitignore_fragments:
  - '*.pyc'
  - validation/output/
  - VALIDATION.md
  - copernican/models/cache/
assets: []
doc_assets:
  user:
    - devcovenant/README.md
project-governance:
  project_name: copernican
  project_description: A Python toolkit for evaluating cosmological models
    against SNe Ia, BAO, and CMB observations.
  copyright_notice: 2025 Apostol Apostolov and Black Epsilon Ltd.,
    Republic of Bulgaria
  stage: stable
  maintenance_stance: active
  compatibility_policy: forward-only
  versioning_mode: versioned
  changelog_file: CHANGELOG.md
policy_overlays:
  documentation-growth-tracking:
    doc_quality_files:
      - README.md
      - ABOUT.md
      - SECURITY.md
      - SUPPORT.md
      - AGENTS.md
      - CONTRIBUTING.md
      - SPEC.md
      - PLAN.md
    user_visible_files:
      - README.md
      - ABOUT.md
      - SECURITY.md
      - SUPPORT.md
      - CITATION.cff
      - AGENTS.md
      - CONTRIBUTING.md
      - SPEC.md
      - PLAN.md
    user_facing_exclude_globs:
      - copernican/models/**
      - copernican/validation/**
      - copernican/validation/manifests/**
      - copernican/datasets/**
    doc_routes:
      - copernican/lib/gui/app.py => README.md, ABOUT.md, SUPPORT.md
      - copernican/lib/likelihoods/** => README.md, ABOUT.md
      - copernican/lib/likelihoods/**/* => README.md, ABOUT.md
      - copernican/lib/likelihoods/cmb/__init__.py => README.md, ABOUT.md
      - copernican/lib/likelihoods/cmb/camb_solver.py => README.md, ABOUT.md
      - copernican/lib/likelihoods/cmb/cmb.py => README.md, ABOUT.md
      - copernican/lib/likelihoods/cmb/copcmb_solver.py => README.md, ABOUT.md
      - copernican/workflow.py => README.md, ABOUT.md, SUPPORT.md
      - copernican/lib/global_settings/defaults.yml => README.md,
        ABOUT.md, SUPPORT.md
      - pyproject.toml => ABOUT.md, SECURITY.md, CITATION.cff
      - copernican/engines/** => README.md, ABOUT.md
      - copernican/models/** => README.md, ABOUT.md
      - copernican/validation/** => README.md, ABOUT.md, SUPPORT.md
      - copernican/validation/__init__.py => README.md, ABOUT.md, SUPPORT.md
      - copernican/validation/runner.py => README.md, ABOUT.md, SUPPORT.md
  read-only-directories:
    include_prefixes:
      - copernican/datasets
    exclude_globs:
      - copernican/datasets/**/cosmo_parser_*.py
      - copernican/datasets/**/metadata_*.yml
      - copernican/datasets/**/metadata_*.yaml
  dependency-management:
    surfaces:
      - id: root_workspace
        lock_file: requirements.lock
        direct_dependency_files:
          - requirements.in
          - copernican/runtime-requirements.lock
        dependency_files:
          - requirements.in
          - devcovenant/runtime-requirements.lock
          - copernican/runtime-requirements.lock
        third_party_file: licenses/THIRD_PARTY_LICENSES.md
        licenses_dir: licenses
        report_heading: '## License Report'
        manage_licenses_readme: true
        generate_hashes: true
        audit_service: pypi
        required_paths:
          - requirements.in
          - devcovenant/runtime-requirements.lock
          - copernican/runtime-requirements.lock
        hash_targets:
          - id: linux-py311
            marker: sys_platform == "linux" and python_version == "3.11"
            pip:
              platform: manylinux2014_x86_64
              implementation: cp
              python_version: '3.11'
              abi: cp311
          - id: windows-py311
            marker: sys_platform == "win32" and python_version == "3.11"
            pip:
              platform: win_amd64
              implementation: cp
              python_version: '3.11'
              abi: cp311
          - id: macos-py311
            marker: sys_platform == "darwin" and python_version == "3.11"
            pip:
              platform: macosx_13_0_x86_64
              implementation: cp
              python_version: '3.11'
              abi: cp311
          - id: macos-py311-arm64
            marker: sys_platform == "darwin" and python_version == "3.11"
            pip:
              platform: macosx_13_0_arm64
              implementation: cp
              python_version: '3.11'
              abi: cp311
      - id: package_runtime
        lock_file: copernican/runtime-requirements.lock
        direct_dependency_files:
          - pyproject.toml
        dependency_files:
          - pyproject.toml
        third_party_file: copernican/lib/licenses/THIRD_PARTY_LICENSES.md
        licenses_dir: copernican/lib/licenses
        report_heading: '## License Report'
        manage_licenses_readme: true
        generate_hashes: true
        audit_service: pypi
        required_paths:
          - pyproject.toml
          - copernican
        hash_targets:
          - id: linux-py311
            marker: sys_platform == "linux" and python_version == "3.11"
            pip:
              platform: manylinux2014_x86_64
              implementation: cp
              python_version: '3.11'
              abi: cp311
          - id: windows-py311
            marker: sys_platform == "win32" and python_version == "3.11"
            pip:
              platform: win_amd64
              implementation: cp
              python_version: '3.11'
              abi: cp311
          - id: macos-py311
            marker: sys_platform == "darwin" and python_version == "3.11"
            pip:
              platform: macosx_13_0_x86_64
              implementation: cp
              python_version: '3.11'
              abi: cp311
          - id: macos-py311-arm64
            marker: sys_platform == "darwin" and python_version == "3.11"
            pip:
              platform: macosx_13_0_arm64
              implementation: cp
              python_version: '3.11'
              abi: cp311
  version-governance:
    scheme: semver
    version_file: copernican/VERSION
    changelog_file: CHANGELOG.md
    changelog_header_prefix: '## Version'
    canonical_versions_required: true
    enforce_bumping: true
    semver_scope_tags_required: true
    ignored_prefixes:
      - devcovenant
      - models
  version-sync:
    version_file: copernican/VERSION
    changelog_file: CHANGELOG.md
    changelog_header_prefix: '## Version'
    target_roles:
      - docs
      - changelog
      - package_manifest
    role_extractors:
      - docs=>project_version_line
      - changelog=>changelog_header_version
      - package_manifest=>manifest_project_version
    role_legality_schemes:
      - package_manifest=>pep440
    target_role_files:
      - docs=>README.md
      - docs=>AGENTS.md
      - docs=>CONTRIBUTING.md
      - docs=>ABOUT.md
      - docs=>SECURITY.md
      - docs=>SUPPORT.md
      - changelog=>CHANGELOG.md
      - package_manifest=>pyproject.toml
  line-length-limit:
    exclude_globs:
      - .matplotlib-cache/**
      - copernican/rng_minigames/registry.json
      - copernican/models/**
      - copernican/validation/manifests/**
      - licenses/THIRD_PARTY_LICENSES.md
      - copernican/lib/licenses/THIRD_PARTY_LICENSES.md
      - copernican/lib/licenses/*.txt
      - copernican/datasets/**
    force_include_globs:
      - devcovenant/custom/**
      - tests/**/*.py
      - tests/**/*.md
      - copernican/datasets/**/cosmo_parser_*.py
      - copernican/datasets/**/metadata_*.yml
      - copernican/datasets/**/metadata_*.yaml
    allow_long_url_lines: true
    url_prefixes:
      - 'https://'
      - 'http://'
      - 'ftp://'
      - 'ftps://'
      - 'sftp://'
      - 'ssh://'
      - 'ws://'
      - 'wss://'
      - 'file://'
      - 'git://'
      - 'svn://'
      - 'mailto:'
      - 'tel:'
      - 'magnet:'
      - 'torrent:'
      - 'urn:'
    long_lines_contain:
      - '=>'
  changelog-coverage:
    skipped_globs:
      - .matplotlib-cache/**
      - copernican/rng_minigames/**/ai_settings.yml
  name-clarity:
    force_include_globs:
      - devcovenant/custom/**/*.py
      - tests/**/*.py
  docstring-and-comment-coverage:
    exclude_prefixes:
      - tests
    force_include_globs:
      - devcovenant/custom/**/*.py
  security-scanner:
    force_include_globs:
      - devcovenant/custom/**/*.py
      - tests/**/*.py
  no-raw-errors:
    exclude_prefixes:
      - tests
    force_include_globs:
      - devcovenant/custom/**/*.py
  modules-need-tests:
    exclude_prefixes:
      - build
      - dist
      - node_modules
      - tests
      - devcovenant
    force_include_globs:
      - devcovenant/custom/**/*.py
    watch_dirs:
      - tests
    tests_watch_dirs:
      - tests
    mirror_roots:
      - copernican/datasets/bao=>tests/copernican/datasets/bao
      - copernican/datasets/cmb=>tests/copernican/datasets/cmb
      - copernican/datasets/gw=>tests/copernican/datasets/gw
      - copernican/datasets/sne=>tests/copernican/datasets/sne
      - devcovenant/custom=>tests/devcovenant/custom
  # Root docs are the source; package docs are synced clones.
  package-doc-sync:
    sync_pairs:
      - README.md=>copernican/README.md
      - ABOUT.md=>copernican/ABOUT.md
      - SECURITY.md=>copernican/SECURITY.md
      - SUPPORT.md=>copernican/SUPPORT.md
      - CITATION.cff=>copernican/CITATION.cff
      - docs/api_overview.md=>copernican/docs/api_overview.md
      - docs/architecture.md=>copernican/docs/architecture.md
      - docs/bao_compound_dataset_format.md=>copernican/docs/bao_compound_dataset_format.md
      - docs/cli_guide.md=>copernican/docs/cli_guide.md
      - docs/data_overview.md=>copernican/docs/data_overview.md
      - docs/dataset_licenses.md=>copernican/docs/dataset_licenses.md
      - docs/dataset_metadata.md=>copernican/docs/dataset_metadata.md
      - docs/design_overview.md=>copernican/docs/design_overview.md
      - docs/gui_guide.md=>copernican/docs/gui_guide.md
      - docs/gui_overview.md=>copernican/docs/gui_overview.md
      - docs/latex_syntax.md=>copernican/docs/latex_syntax.md
      - docs/minigames.md=>copernican/docs/minigames.md
      - docs/orchestration_services.md=>copernican/docs/orchestration_services.md
      - docs/packaging.md=>copernican/docs/packaging.md
      - docs/run_manifest.md=>copernican/docs/run_manifest.md
      - docs/security_changes.md=>copernican/docs/security_changes.md
    omit_block_pairs:
      - "<!-- REPO-ONLY:BEGIN -->=><!-- REPO-ONLY:END -->"
    rewrite_repo_relative_links: false
  last-updated:
    allowed_globs:
      - README.md
      - ABOUT.md
      - SECURITY.md
      - SUPPORT.md
      - AGENTS.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - SPEC.md
      - PLAN.md
      - 'copernican/README.md'
      - 'copernican/ABOUT.md'
      - 'copernican/SECURITY.md'
      - 'copernican/SUPPORT.md'
      - 'copernican/docs/*.md'
      - 'copernican/docs/**/*.md'
