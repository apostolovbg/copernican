# DriftGuard policy spec derived from PLAN.json driftguard_yaml_spec.
# DriftGuard is the authoritative source for development laws; repository docs
# point back here for enforceable guidance.
version: 1
project: Copernican Suite
rulesets:
  core-metadata: hard # Enforce metadata and date hygiene.
  docs-drift: warn # Track documentation freshness to prevent staleness.
  python-quality: hard # Protect Python code quality and test coverage.
  bugfix-coverage: warn # Encourage pairing fixes with regression tests.
  workflow-discipline: hard # Ensure workflows run the full suite and policy checks.
surfaces:
  docs:
    description: >-
      Documentation and license files that require Last Updated headers and
      strict date validation while pointing contributors back to DriftGuard.
    include:
      - README.md
      - AGENTS.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - docs/*.md
      - docs/**/*.md
      - CITATION.cff
      - LICENSE.md
      - THIRD_PARTY_LICENSES.md
    exclude: []
    rules:
      - last-updated-header
      - no-future-dates
  interfaces:
    description: >-
      User-facing entrypoints and configuration files that must remain aligned
      with recorded versions and dates.
    include:
      - copernican.py
      - start.sh
      - start.command
      - start.bat
      - copernican_lib/config_schemas/**/*.yml
      - models/**/*.yml
    exclude: []
    rules:
      - last-updated-header
      - no-future-dates
  metadata:
    description: >-
      Release metadata files that must remain synchronised across the suite.
    include:
      - README.md
      - CITATION.cff
      - copernican_lib/VERSION
      - pyproject.toml
    exclude: []
    rules:
      - version-sync
      - citation-yaml
      - no-future-dates
      - changelog-entry
  python-lib:
    description: >-
      Core Python library code that should avoid prints and pair new modules
      with tests.
    include:
      - copernican_lib/**/*.py
      - engines/**/*.py
    exclude:
      - tests/**/*.py
      - tools/**/*.py
      - driftguard/**/*.py
    rules:
      - no-print
      - new-modules-need-tests
      - bugfix-has-test
  python-tests:
    description: >-
      Test suite surface kept for future rules; currently inherits no
      additional checks beyond baseline linters.
    include:
      - tests/**/*.py
    exclude: []
    rules: []
  tools:
    description: >-
      Helper scripts reserved for bespoke tooling rules.
    include:
      - tools/**/*.py
    exclude: []
    rules: []
  ci-workflows:
    description: >-
      Continuous integration workflows that must exercise the full program
      unit test suite under /tests via both the documented `python -m pytest -q`
      command and the `python -m unittest discover -v` invocation, document the
      expectation that developers run both suites for every task before
      committing, and sequence DriftGuard after the tests.
    include:
      - .github/workflows/ci.yml
      - DRIFTGUARD.md
    exclude: []
    rules:
      - full-test-suite-in-ci
drift:
  metrics:
    - name: todo-count
      description: >-
        Total count of TODO/FIXME/XXX markers found in core library and engine
        code.
      max_warning: 50
    - name: test-coupling-ratio
      description: >-
        Approximate fraction of core modules that appear to have corresponding
        tests. Below this threshold emits a warning.
      min_warning: 0.8
    - name: doc-age-days
      description: >-
        Maximum age in days of key docs (README, AGENTS, CONTRIBUTING,
        docs/*). If any exceeds this, emit a drift warning.
      max_warning: 365
